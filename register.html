<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הרשמה | ארבעה אבות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=21" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <div class="dropdown brand-dropdown">
        <button type="button" class="brand dropdown-trigger">
          <span class="mark">📖</span>
          <span>פשיטא</span>
        </button>
        <div class="dropdown-menu brand-menu" hidden>
          <a class="dropdown-item" href="index.html">בית</a>
          <div class="auth-area" id="auth-area-out">
            <a class="auth-link auth-link-primary" href="login.html">התחברות</a>
          </div>
          <div class="auth-area" id="auth-area-in" hidden>
            <span class="score-badge" id="score-badge" hidden></span>
            <button type="button" class="auth-link auth-link-primary" id="logout-btn">התנתקות</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding-top: 34px; max-width: 480px;">
    <div class="breadcrumbs"><a href="index.html">בית</a> ← הרשמה</div>
    <h1 class="lesson-title">הרשמה</h1>
    <p style="color: var(--ink-soft); margin-bottom: 24px;">
      אפשר להמשיך ולגלוש באתר גם בלי להירשם. הרשמה מאפשרת לשמור מעקב התקדמות בשיעורים.
    </p>

    <form id="register-form" class="auth-form">
      <label>
        שם פרטי
        <input type="text" name="firstName" required />
      </label>
      <label>
        שם משפחה
        <input type="text" name="lastName" required />
      </label>
      <label>
        טלפון אבא
        <input type="tel" name="fatherPhone" placeholder="05XXXXXXXX" required />
      </label>
      <label>
        טלפון אמא
        <input type="tel" name="motherPhone" placeholder="05XXXXXXXX" required />
      </label>
      <label>
        קוד אישי (4 ספרות)
        <input type="password" name="pin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required />
      </label>
      <label>
        אימות קוד אישי
        <input type="password" name="confirmPin" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required />
      </label>

      <p class="auth-error" id="form-error" hidden></p>

      <button type="submit" class="auth-submit">הרשמה</button>
    </form>

    <p style="margin-top: 16px; font-size: .9rem; color: var(--ink-soft);">
      כבר נרשמת? <a href="login.html">התחברות</a>
    </p>
  </main>

  <footer class="site-footer"></footer>

  <script src="assets/js/main.js?v=1"></script>
  <script type="module" src="assets/js/header-auth.js"></script>
  <script type="module" src="assets/js/score.js"></script>
  <script type="module">
    import { registerUser, isReady } from "./assets/js/auth.js";

    const form = document.getElementById("register-form");
    const errorEl = document.getElementById("form-error");
    const phonePattern = /^0\d{8,9}$/;
    const pinPattern = /^\d{4}$/;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.hidden = true;

      if (!isReady()) {
        errorEl.textContent = "ההרשמה עדיין לא מוגדרת באתר. נסו שוב מאוחר יותר.";
        errorEl.hidden = false;
        return;
      }

      const data = Object.fromEntries(new FormData(form).entries());

      if (!phonePattern.test(data.fatherPhone) || !phonePattern.test(data.motherPhone)) {
        errorEl.textContent = "מספר טלפון לא תקין (לדוגמה: 0501234567).";
        errorEl.hidden = false;
        return;
      }
      if (!pinPattern.test(data.pin)) {
        errorEl.textContent = "הקוד האישי חייב להיות בדיוק 4 ספרות.";
        errorEl.hidden = false;
        return;
      }
      if (data.pin !== data.confirmPin) {
        errorEl.textContent = "הקודים האישיים אינם תואמים.";
        errorEl.hidden = false;
        return;
      }

      const submitBtn = form.querySelector(".auth-submit");
      submitBtn.disabled = true;
      try {
        await registerUser(data);
        window.location.href = "index.html";
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.hidden = false;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
