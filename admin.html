  <style>
    .admin-wrap { max-width: 760px; margin: 0 auto; padding: 28px 20px 60px; }
    .admin-wrap h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .admin-sub { color: var(--ink-soft); font-size: .92rem; margin: 0 0 18px; }
    .howto {
      background: var(--accent-soft);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      font-size: .9rem;

    }

    .toolbar-actions { display: flex; gap: 8px; }
    .btn {
      font-family: inherit;
      font-size: .86rem;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .9; }
    .btn:disabled { opacity: .4; cursor: default; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .tab {
      font-family: inherit;
      font-size: .88rem;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink-soft);
      cursor: pointer;
    }
    .tab:hover { border-color: var(--accent); }
    .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tab .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-strong); margin-inline-start: 6px; vertical-align: middle; }
    .tab.active .dot { background: #fff; }
    .field { margin-bottom: 18px; }
    .field-label { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .tag-badge {
      font-size: .7rem; font-weight: 700; letter-spacing: .03em;
      color: var(--accent-strong); background: var(--accent-soft);

    }
    .reset-link {
      font-size: .76rem; color: var(--ink-soft); background: none; border: none;
      cursor: pointer; text-decoration: underline; padding: 0; opacity: 0; transition: opacity .2s;
    }
    .field.edited .reset-link { opacity: 1; }
    .field textarea, .field input[type="text"] {
      width: 100%; font-family: inherit; color: var(--ink);
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px; resize: none;
      direction: rtl; text-align: right;
    }
    .field textarea:focus, .field input[type="text"]:focus { outline: none; border-color: var(--accent); }
    .field.edited textarea, .field.edited input[type="text"] { border-color: var(--accent); }
    .f-h1 input, .f-h2 input, .f-h3 input { font-family: "Frank Ruhl Libre", "David Libre", serif; font-weight: 700; }
    .f-h1 input { font-size: 1.4rem; }
    .f-h2 input { font-size: 1.15rem; }
    .f-h3 input { font-size: 1.05rem; }
    .f-p textarea { font-size: .98rem; line-height: 1.6; }
    .f-p.cls-p-strong textarea { font-weight: 600; }
    .f-p.cls-p-light textarea { color: var(--ink-soft); }
    .cg-styles { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .cg-style-row {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
      padding: 3px 8px; font-size: .74rem; color: var(--ink-soft);
    }
    .cg-style-row select {
      font-family: inherit; font-size: .74rem; border: none; background: transparent;
      color: var(--ink); cursor: pointer;
    }
    .cg-style-row select:focus { outline: none; }
    .save-status {
      font-size: .76rem;
      color: var(--ink-soft);
      margin-inline-start: auto;
      min-width: 70px;
      text-align: left;
    }
    .save-status.status-saving { color: var(--ink-soft); }
    .save-status.status-saved { color: #3a7d44; }
    .save-status.status-error { color: #b23b3b; }
    #auth-gate {
      background: var(--accent-soft);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      text-align: center;

    #auth-gate p { margin: 0 0 12px; font-size: .95rem; }
    #auth-gate .btn { display: inline-block; text-decoration: none; }
    [hidden] { display: none !important; }

  <script type="module">
    import { getDb, isReady, watchAuthState, logoutUser } from "./assets/js/auth.js";
    import { doc, getDoc, setDoc, deleteField } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    var LESSON_ORDER = ["avot-vetoldot", "shor-umave", "lo-hari-hashor", "gabei-shabbat-tanan", "umai-ika", "gabei-tumaot-tanan"];
    var LESSONS = {"avot-vetoldot": {"title": "אבות נזיקין", "blocks": [{"type": "group", "id": "avot-vetoldot:g1", "items": [{"cls": "p-light", "id": "avot-vetoldot:1", "text": "יהודה קנטור הוא ישראלי שנחטף בלידתו ונמסר לאימוץ אצל משפחה חשוכת ילדים. להוריו נאמר שנולד חולה ונפטר מיד. להורים וילדים יש דמיון מוחלט מבחינה גנטית, כך אחרי שנים רבות הוא פנה לחברה ישראלית פורצת דרך, שמחזיקה במאגר גנטי אדיר ומצא התאמה מוחלטת בינו לאדם אחר, זה היה אביו האמיתי. בדרך כלל אבא ובן יהיו דומים גם בתווי הפנים וחלק מהאופי והכישורים."}, {"cls": "p-strong", "id": "avot-vetoldot:2", "text": "אבא קוראים רק למי שיש לו ילד. והילד חייב להיות דומה לאבא."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "avot-vetoldot:3", "text": "מכה שלא כתובה בתורה"}, {"type": "group", "id": "avot-vetoldot:g4", "items": [{"cls": "p-strong", "id": "avot-vetoldot:4", "text": "למדנו שיש הבדל בין כל אחד מהמזיקים שהתורה מחייבת בהם. \"בור\" זה תקלה ברשות הרבים ובא מישהו אחר וניזוק בו."}, {"cls": "p-strong", "id": "avot-vetoldot:5", "text": "אדם שבר בקבוק זכוכית ברשות הרבים, אופניים עברו שם וקיבלו חור בגלגל, לא כתוב בתורה מה הדין במקרה כזה, גם לא כתוב מה הדין אם שפך שמן זית, קנולה, או קוקוס ובא מישהו אחר, החליק וניזוק."}, {"cls": "p-strong", "id": "avot-vetoldot:6", "text": "המקרים האלו ממש דומים לבור שכתוב בתורה, בשניהם מדובר בתקלה שהמזיק עשה ברשות הרבים ובא מישהו אחר וניזוק. לכן המקרים האלו הם תולדה של המזיק \"בור\" והדין שלהם דומה."}, {"cls": "p-strong", "id": "avot-vetoldot:7", "text": "\"אב\": הוא המזיק שכתוב בתורה במפורש שהמזיק חייב עליו. \"תולדה\": מזיקים נוספים שלא כתובים בתורה, אבל הם דומים למזיקים שכתובים בתורה וגם בהם חייב."}]}]}, "shor-umave": {"title": "השור, הבור, המבעה וההבער", "blocks": [{"type": "single", "tag": "h2", "cls": "", "id": "shor-umave:1", "text": "המזיקים"}, {"type": "single", "tag": "h3", "cls": "", "id": "shor-umave:2", "text": "שן"}, {"type": "single", "tag": "p", "cls": "p-light", "id": "shor-umave:3", "text": "רועי צאן ובקר מעדיפים לשלוח את הבהמות שלהם לשטחי מרעה, שם הם יוכלו לאכול חינם וליהנות ממרחבים עצומים. גם היום המדינה מחכירה בזול שטחים לא מיושבים למרעה וזה מייצר הרבה ויכוחים:"}, {"type": "single", "tag": "p", "cls": "p-strong", "id": "shor-umave:6", "text": "\"שן\" הוא שם של נזק שקורה כי בעל חי אוכל כדי ליהנות מהאכילה."}, {"type": "single", "tag": "h3", "cls": "", "id": "shor-umave:7", "text": "רגל"}, {"type": "single", "tag": "p", "cls": "p-strong", "id": "shor-umave:9", "text": "\"רגל\" הוא שם של נזק שקורה כי בעל חי רוצה ללכת ממקום אחד לשני ומזיק בהליכתו."}, {"type": "single", "tag": "h3", "cls": "", "id": "shor-umave:10", "text": "בור"}, {"type": "single", "tag": "p", "cls": "p-strong", "id": "shor-umave:12", "text": "\"בור\" הוא שם של נזק שקורה כי השאיר בור פתוח, נפלו בו בעלי חיים או רכוש וניזוקו."}, {"type": "single", "tag": "h3", "cls": "", "id": "shor-umave:13", "text": "אש"}, {"type": "single", "tag": "p", "cls": "p-strong", "id": "shor-umave:16", "text": "\"אש\" הוא שם של נזק שקורה כי המזיק הדליק אש ובגלל הרוח היא התפשטה גם לחצר של אחרים ושרפה רכוש."}]}, "lo-hari-hashor": {"title": "לא הרי השור כהרי המבעה", "blocks": [{"type": "single", "tag": "h3", "cls": "", "id": "lo-hari-hashor:1", "text": "העיקרון מובן"}, {"type": "group", "id": "lo-hari-hashor:g2", "items": [{"cls": "p-light", "id": "lo-hari-hashor:2", "text": "אדם ניסה לשדוד בנק ונתפס. התברר שהוא איים על הבנקאי עם רובה מים שנראה ממש כמו הדבר האמיתי. הוא גם טען במשפט שהוא זכאי, כי כתוב בחוק שאסור לאיים על אדם אחר עם נשק, רובה מים פחות מסוכן ואין הוכחה שגם הוא אסור."}, {"cls": "p-light", "id": "lo-hari-hashor:3", "text": "השופט לא התרשם ופסק שבאמת אין התייחסות בחוק למקרה הזה ואין לנו הוכחה שגם רובה מים אסור, אבל המקרה הזה דומה בדיוק לשימוש בנשק אמיתי, כי הבנקאי הרי חשב שמדובר באיום אמיתי וגם זה אסור באותה מידה."}, {"cls": "p-strong", "id": "lo-hari-hashor:4", "text": "התורה מלמדת על מקרים שהמזיק חייב בהם. אין צורך לכתוב את כל האפשרויות שיש בעולם להזיק, מספיק להבין את העיקרון וממנו נלמד שגם מזיקים נוספים חייבים. אבל נזק קטן יותר צריך לכתוב שחייב, כי אולי חייב רק במקרה חמור."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "lo-hari-hashor:5", "text": "על איזה מזיק קשה יותר לשמור?"}, {"type": "group", "id": "lo-hari-hashor:g6", "items": [{"cls": "p-strong", "id": "lo-hari-hashor:6", "text": "המזיקים שנכתבו בתורה שונים אחד מהשני, לכל אחד יש סיבה שונה מדוע דווקא הוא יכול להזיק, מדוע הבעלים היה אמור להבין שצריך לשמור שלא יהיה כאן נזק. מלבד זה יש למזיקים גם תכונות משותפות שבגללם הם יכולים להזיק."}, {"cls": "p-strong", "id": "lo-hari-hashor:7", "text": "מה קשה יותר קור, או חום? רעב, או צמא? קושי להירדם, או קושי להתעורר? לא בכל דבר אפשר להחליט מה קשה יותר, יש כאלו שמעדיפים כך ויש כאלו שמעדיפים אחרת."}, {"cls": "p-strong", "id": "lo-hari-hashor:8", "text": "אי אפשר להחליט על איזה מזיק קשה יותר לשמור, האם על בעל חי שמזיק להנאתו, או על בעל חי שהזיקו מצוי, האם על אלו שיש בהם רוח חיים, או על אלו שדרכם לילך ולהזיק, או שאולי הם דווקא קשים באותה מידה. הם שונים אחד מהשני ובכל אחד מהם יש סיבה אחרת לרצון של הבהמה להזיק."}, {"cls": "p-strong", "id": "lo-hari-hashor:9", "text": "לכן אי אפשר לדעת איזה מזיק קל יותר ואיזה חמור יותר."}, {"cls": "p-strong", "id": "lo-hari-hashor:10", "text": "ובלשון הגמרא: \"לא הרי השור (רגל) כהרי המבעה (שן)\": לא דומה סיבת הנזק ברגל לסיבת הנזק בשן ואולי ברגל קשה יותר לשמור ו\"לא הרי המבעה (שן) כהרי השור (רגל)\": לא דומה סיבת הנזק בשן לסיבת הנזק ברגל ואולי בשן קשה יותר לשמור."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "lo-hari-hashor:11", "text": "צריך לכתוב את כל המזיקים"}, {"type": "group", "id": "lo-hari-hashor:g12", "items": [{"cls": "p-strong", "id": "lo-hari-hashor:12", "text": "בכל אחד מהמזיקים יש היגיון להגיד שדווקא בו הבעלים פושע במיוחד, יותר מבשאר המזיקים, כי דווקא בו הוא היה חייב להבין במיוחד שהולך להיות כאן נזק."}, {"cls": "p-strong", "id": "lo-hari-hashor:13", "text": "לכן התורה צריכה לכתוב את כל המזיקים האלו ואין אפשרות לכתוב חלק ונלמד מהם שהשאר אסורים, כי אולי אלו שלא כתובים קלים יותר ופטורים."}]}]}, "gabei-shabbat-tanan": {"title": "גבי שבת תנן", "blocks": [{"type": "single", "tag": "h3", "cls": "", "id": "gabei-shabbat-tanan:1", "text": "ארבעים חסר אחת"}, {"type": "group", "id": "gabei-shabbat-tanan:g2", "items": [{"cls": "p-light", "id": "gabei-shabbat-tanan:2", "text": "במשכן היו 39 מלאכות חשובות שנצרכו לצורך עבודת המשכן, כל המלאכות האלו שהיו במשכן אסורות בשבת. אחת מהן הייתה כותב אותיות."}, {"cls": "p-light", "id": "gabei-shabbat-tanan:3", "text": "יש מלאכות נוספות שהיו במשכן, אבל לא היו חשובות. המלאכות האלו דומות למלאכות החשובות שהיו במשכן, לדוגמה: אדם שמצייר ציור, זה דומה למלאכת כותב. גם הם אסורות בשבת."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-shabbat-tanan:4", "text": "אבות ותולדות"}, {"type": "group", "id": "gabei-shabbat-tanan:g5", "items": [{"cls": "p-light", "id": "gabei-shabbat-tanan:5", "text": "הגאון הרב יוסף שלום אלישיב, היה בן יחיד להוריו. הוא נפטר בשנת תשע\"ב, בגיל 102. באותו זמן היו לו בערך 1400 צאצאים, בשישה דורות - ילדים, נכדים, נינים, בני נינים ונכדי נינים. בממוצע נולד לו צאצא חדש בכל יומיים."}, {"cls": "p-strong", "id": "gabei-shabbat-tanan:6", "text": "האבא הוא המקור של כל המשפחה וכל הצאצאים שמגיעים ממנו הם התולדות."}, {"cls": "p-strong", "id": "gabei-shabbat-tanan:7", "text": "כך גם בדיני שבת, \"אבות מלאכות\": הם המקור של איסורי שבת – המלאכות שהיו חשובות במשכן. \"תולדות\": הם אלו שדומים למלאכות שהיו חשובות במשכן."}, {"cls": "p-strong", "id": "gabei-shabbat-tanan:8", "text": "מסופר שרבי יוחנן וריש לקיש, לאחר לימוד משותף של שלוש וחצי שנים, מצאו 39 תולדות לכל אחד מהאבות."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-shabbat-tanan:9", "text": "כרת"}, {"type": "group", "id": "gabei-shabbat-tanan:g10", "items": [{"cls": "p-strong", "id": "gabei-shabbat-tanan:10", "text": "יש עבירות חמורות שאדם עושה בכוונה, אבל בית דין לא יכול לחייב אותו את העונש שמגיע למי שעשה במזיד, כי לא יודעים שעשה את העבירה, או שלא יודעים אם עשה אותה בכוונה או בטעות. התורה מלמדת על 36 עבירות כאלו שהקב\"ה בוחן כליות ולב מעניש עליהם."}, {"cls": "p-strong", "id": "gabei-shabbat-tanan:11", "text": "העונש הזה נקרא \"כרת\" – אדם כזה ילך מהעולם הזה עד גיל 60 ולא יזכה לעולם הבא. הגמרא מספרת שרב יוסף עשה סעודה כשהגיע לגיל הזה, כי שמח שהוא לא חייב כרת. מקבלים את העונש הזה רק על עבירות שנעשו לאחר גיל 20."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-shabbat-tanan:12", "text": "הדין"}, {"type": "group", "id": "gabei-shabbat-tanan:g13", "items": [{"cls": "p-light", "id": "gabei-shabbat-tanan:13", "text": "הַמְּקוֹשֵׁשׁ - כשבני ישראל היו במדבר, היה אדם שאסף עצים בשבת, משה לא ידע איך לנהוג במקרה הזה, שאל את הקב\"ה וקיבל תשובה שדינו בסקילה."}, {"cls": "p-strong", "id": "gabei-shabbat-tanan:14", "text": "שוגג: הוא אדם שעבר עבירה בטעות, הוא לא ידע שהיא אסורה. מזיד: הוא אדם שעבר עבירה בכוונה. התראה: כדי לדעת בביטחון שהוא באמת עשה את העבירה במזיד, צריך שאנשים יתנו לו התראה ויגידו לו שזה אסור."}, {"cls": "p-strong", "id": "gabei-shabbat-tanan:15", "text": "אדם שעשה מלאכה אסורה בשבת, בשוגג: חייב חטאת ובמזיד: חייב סקילה. אם עשה את המלאכה במזיד, אבל אין עדים והתראה, רק הקב\"ה יודע שזה היה במזיד וחייב כרת."}, {"cls": "p-strong", "id": "gabei-shabbat-tanan:16", "text": "אדם שעשה מלאכה אסורה בשבת תמיד חייב אותו דבר, אין הבדל אם עבר על אב מלאכה, או על תולדה."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-shabbat-tanan:17", "text": "תולדותיהן כיוצא בהן"}, {"type": "single", "tag": "p", "cls": "p-strong", "id": "gabei-shabbat-tanan:18", "text": "אנחנו רואים שגם בדיני שבת יש אבות ותולדות, כמו אצלנו בדיני נזיקין. לתולדות המלאכות שאסורות בשבת יש דין דומה כמו לאבות שלהם ולא דין שונה."}]}, "umai-ika": {"title": "ומאי איכא בין אב לתולדה", "blocks": [{"type": "single", "tag": "p", "cls": "p-strong", "id": "umai-ika:1", "text": "אדם שעשה מלאכה אסורה בשבת: בשוגג, חייב חטאת ובמזיד, אם לא היו עדים והתראה, נענש במיתה בידי שמים ואם היו עדים והתראה, נענש בסקילה."}, {"type": "single", "tag": "h3", "cls": "", "id": "umai-ika:2", "text": "מזיד"}, {"type": "single", "tag": "p", "cls": "p-strong", "id": "umai-ika:3", "text": "עבר במזיד על איסורי שבת הרבה פעמים ח\"ו, תמיד הוא יכול לקבל רק עונש אחד, כי הרי אי אפשר לקבל סקילה, או מיתה בידי שמים כמה פעמים."}, {"type": "single", "tag": "h3", "cls": "", "id": "umai-ika:4", "text": "עבירה אחת"}, {"type": "single", "tag": "p", "cls": "p-strong", "id": "umai-ika:5", "text": "אדם שעובר עבירה בשוגג, עושה אותה מחוסר ידע, אם היה יודע שזה אסור, הוא לא היה עושה אותה. אפילו אם הוא עשה אותה הרבה פעמים, כל המעשים האלו מגיעים מטעות אחת, המחשבה שזה מותר. לכן הוא לא פושע גדול יותר מאדם שעשה אותה בשוגג פעם אחת, כי חשב שזה מותר."}, {"type": "single", "tag": "h3", "cls": "", "id": "umai-ika:6", "text": "קרבן חטאת"}, {"type": "group", "id": "umai-ika:g7", "items": [{"cls": "p-light", "id": "umai-ika:7", "text": "לפני 200 שנה מלך רוסיה, הצאר ניקולאי, החליט לקחת בכוח ילדים יהודיים ולגייס אותם לצבא הרוסי, שם הם יקבלו בכוח חינוך לא יהודי. החיילים האלו היו נקראים \"קנטוניסים\". במשך השנים גויסו בכפייה 70,000 ילדים בגיל 12 וגם פחות מכך, לשירות של 31 שנים."}, {"cls": "p-light", "id": "umai-ika:8", "text": "היו שם הרבה מאוד סיפורים מרגשים על חיילים שהמשיכו לשמור מצוות במסירות נפש. בסיום השירות הצבאי, הם קיבלו אישור להתיישב באזורים שבהם הם שירתו המון שנים. כך קמו קהילות קטנות של קנטוניסטים, בפינלנד, בסיביר ובעוד מקומות נידחים."}, {"cls": "p-light", "id": "umai-ika:9", "text": "היהודים האלו היו בעלי רגש חם מאוד ליהדות, אמונה תמימה ומסירות נפש, אבל אחרי שנים רבות כל כך בין הגויים, הם לא הכירו את כל הפרטים הנדרשים לקיום מצוות כהלכתם."}, {"cls": "p-strong", "id": "umai-ika:10", "text": "אדם לא ידע שבשבת אסור להוציא מהסלט רק את הירק שהוא לא אוהב ועשה את זה בשוגג כל שבת במשך שנים רבות, האם בזמן שבית המקדש ייבנה הוא יצטרך להביא מאות קורבנות חטאת?"}, {"cls": "p-strong", "id": "umai-ika:11", "text": "עבר רק על אבות, או רק על תולדות: יצטרך להביא קרבן חטאת אחת על כל סוג של אב או תולדה שעבר, כי אפילו שעבר על בורר הרבה פעמים, הכול נובע מטעות אחת שזה מותר."}, {"cls": "p-strong", "id": "umai-ika:12", "text": "עבר על אב ותולדה שלו: כמו כותב ומצייר, מחלוקת: לפי תנא קמא: אב ותולדה זה אותה מלאכה, כמו אדם שעבר על אותו אב כמה פעמים ולכן מספיק קרבן חטאת אחד על שניהם ולפי רבי אליעזר: אב ותולדה אלו מלאכות שונות, כמו אדם שעבר על כמה אבות שונים ולכן חייב חטאת אחת על האב וחטאת נוספת על התולדה."}, {"cls": "p-strong", "id": "umai-ika:13", "text": "לפי תנא קמא: יש רווח גדול מכך שמצייר הוא תולדה של כותב ולא עוד אב מלאכה, כך חייב רק חטאת אחת."}, {"cls": "p-strong", "id": "umai-ika:14", "text": "לפי רבי אליעזר: אין רווח מכך שמצייר הוא תולדה של כותב, כי הוא כמו עוד אב מלאכה וחייב עוד חטאת."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "umai-ika:15", "text": "העלם אחד"}, {"type": "group", "id": "umai-ika:g16", "items": [{"cls": "p-strong", "id": "umai-ika:16", "text": "אדם שמר מצוות לאורך שנים רבות, אבל הוא לא ידע שאסור להוציא מהסלט רק את הירק שהוא לא אוהב, רק אחרי שנים התברר לו ומאז הוא זוכר ומקפיד על זה."}, {"cls": "p-strong", "id": "umai-ika:17", "text": "המידע הזה נעלם ממנו פעם אחת בלבד, כי אחרי שנודע לו הוא כבר זוכר את זה תמיד. בלשון הגמרא זה נקרא \"העלם אחד\" – כי המידע הזה נעלם ממנו רק פעם אחת. אבל אם שכח שוב פעם את האיסור הזה, המידע הזה כבר נעלם ממנו פעמיים, פעם אחת לפני שהוא למד אותו ופעם שניה אחרי שהוא למד אותו."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "umai-ika:18", "text": "משמעות"}, {"type": "group", "id": "umai-ika:g19", "items": [{"cls": "p-strong", "id": "umai-ika:19", "text": "מה המשמעות לכך שמלאכה אחת נקראת בשם אב ומלאכה אחרת נקראת בשם תולדה של האב הזה, מדוע לא לקרוא להם באותו שם, מלאכות שאסורות בשבת?"}, {"cls": "p-strong", "id": "umai-ika:20", "text": "לפי תנא קמא: יש משמעות הלכתית, כי אם עבר על אב ותולדה שלו מביא רק חטאת אחת."}, {"cls": "p-strong", "id": "umai-ika:21", "text": "לפי רבי אליעזר: אין משמעות הלכתית, ונקרא אב רק בגלל שהיה מלאכה חשובה במשכן."}]}]}, "gabei-tumaot-tanan": {"title": "גבי טומאות תנן", "blocks": [{"type": "single", "tag": "h3", "cls": "", "id": "gabei-tumaot-tanan:1", "text": "שמונה שרצים"}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-tumaot-tanan:2", "text": "טומאה וטהרה"}, {"type": "single", "tag": "p", "cls": "p-strong", "id": "gabei-tumaot-tanan:3", "text": "אדם טמא, אסור להיכנס לבית המקדש ולאכול תרומה ומהקורבנות של בית המקדש."}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-tumaot-tanan:4", "text": "מקור הטומאה"}, {"type": "group", "id": "gabei-tumaot-tanan:g5", "items": [{"cls": "p-strong", "id": "gabei-tumaot-tanan:5", "text": "כמה מהם:"}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:6", "text": "אדם מת: יהודי, או גוי."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:7", "text": "שרץ: אחד מ8 שרצים שמתו: \"וְזֶה לָכֶם הַטָּמֵא בַּשֶּׁרֶץ הַשֹּׁרֵץ עַל־הָאָרֶץ הַחֹלֶד וְהָעַכְבָּר וְהַצָּב לְמִינֵהוּ וְהָאֲנָקָה וְהַכֹּחַ וְהַלְּטָאָה וְהַחֹמֶט וְהַתִּנְשָׁמֶת\"."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-tumaot-tanan:8", "text": "מקבלים טומאה"}, {"type": "group", "id": "gabei-tumaot-tanan:g9", "items": [{"cls": "p-strong", "id": "gabei-tumaot-tanan:9", "text": "אדם: יהודי."}, {"cls": "p-light", "id": "gabei-tumaot-tanan:10", "text": "כלים: אחרי שבני ישראל עלו לרגל, הכוהנים היו מטהרים את כלי המקדש, מחשש שנגע בהם אדם טמא."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:11", "text": "כל הכלים מקבלים טומאה, חוץ מכלי אבן."}, {"cls": "p-light", "id": "gabei-tumaot-tanan:12", "text": "אוכל: בחפירות בעיר העתיקה בירושלים, מצאו כלי אוכל שעשויים מאבן. בזמן שבית המקדש היה קיים אנשים נזהרו מאוד מטומאה ולכן אכלו בכלים שלא מטמאים את האוכל."}, {"cls": "p-light", "id": "gabei-tumaot-tanan:13", "text": "אוכל מקבל טומאה רק אם נשטף במים. בליל הסדר אנחנו טובלים את הכרפס במי מלח. זאת הסיבה שלפני זה נוטלים ידיים, לטהר אותם שלא יטמאו את האוכל הרטוב."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:14", "text": "משקה: שבעה סוגים של משקים, ראשי תיבות: י\"ד שח\"ט ד\"ם: יין, דבש דבורים, שמן, חלב, טל, דם ומים."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-tumaot-tanan:15", "text": "אבות ותולדות הטומאה"}, {"type": "group", "id": "gabei-tumaot-tanan:g16", "items": [{"cls": "p-strong", "id": "gabei-tumaot-tanan:16", "text": "בשנת תש״פ התפרצה לחיינו מגיפת הקורונה. לפחות 18 מיליון בני אדם מתו ממנה. זה היה וירוס שיוצר במעבדה בסין ומשם נדבקו ממנו בכל העולם."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:17", "text": "הוירוס הוא אב המחלה - המקור שלה והדורות הבאים הם התולדות שהגיעו ממנה."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:18", "text": "כך גם בדיני הטומאה: אב הטומאה: הוא האדם המת והשרץ שהם המקור של הטומאה. תולדות הטומאה: הם אדם חי וכלים שהיו טהורים ונטמאו."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-tumaot-tanan:19", "text": "מטמאים"}, {"type": "single", "tag": "p", "cls": "p-strong", "id": "gabei-tumaot-tanan:20", "text": "כמו וירוס הקורונה שמדביק אחרים, אדם מת ושרץ מטמאים וגם דברים שנטמאו מתחילים לטמא אחרים."}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-tumaot-tanan:21", "text": "שרשרת הדורות"}, {"type": "group", "id": "gabei-tumaot-tanan:g22", "items": [{"cls": "p-strong", "id": "gabei-tumaot-tanan:22", "text": "וירוס הקורונה יוצר במעבדה בסין. חוקר מקומי נדבק שם, הוא הלך לחנות והדביק את כל הקונים. אחד מהם עלה לאוטובוס, הדביק את כולו ובין השאר גם אדם שהיה בדרך לשדה התעופה. שם הוא הדביק אנשים שטסו למדינות שונות. משם המשיכה שרשרת ההדבקה למיליארדי אנשים בכל העולם."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:23", "text": "שימו לב לשרשרת ההתפשטות של המחלה. כל אחד שנדבק, מדביק את הבא אחריו:"}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:24", "text": "הווירוס - המקור של המחלה."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:25", "text": "החוקר – במעבדה, נדבק מהווירוס. הראשון בשרשרת ההדבקה."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:26", "text": "הקונה - בחנות בסין, נדבק מהחוקר. השני בשרשרת ההדבקה."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:27", "text": "הנוסע - בטיסה נדבק מהמוכר. השלישי בשרשרת ההדבקה."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:28", "text": "כך גם בדיני טומאה:"}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:29", "text": "אדם נפטר בשיבה טובה בבית רפואה ונלקח לקבורה. הגיע חולה אחר לבית הרפואה, שכב במיטה שלו, הבריא, חזר הביתה והלך לאכול."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:30", "text": "המת והמיטה – אב הטומאה."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:31", "text": "החולה – הראשון בשרשרת ההדבקה."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:32", "text": "הכלי – השני בשרשרת ההדבקה."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:33", "text": "כל דבר שהיה טהור וקיבל טומאה, כמו אדם, כלים ואוכל, נגע בדבר טמא, הוא נהיה דור נוסף / בדרגה אחת פחות מהדבר הטמא. לדוגמה: אם נטמא מראשון לטומאה, הם טמאים והופכים להיות שניים לטומאה וכך הלאה."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-tumaot-tanan:34", "text": "ירידת הדורות"}, {"type": "group", "id": "gabei-tumaot-tanan:g35", "items": [{"cls": "p-strong", "id": "gabei-tumaot-tanan:35", "text": "הוירוס הראשון היה הכי חזק וקשה, אבל ככל שהוא עובר מאדם לאדם הוא נחלש."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:36", "text": "בהתחלה הוא היה חזק ופגע אפילו בצעירים, בריאים וחזקים ואחר כך רק בחלשים וחולים."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:37", "text": "היום יש אנשים שחולים בקורונה והם אפילו לא יודעים."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:38", "text": "מחלה חזקה פוגעת גם בחזקים, מחלה חלשה פוגעת רק בחלשים. ככל שהמחלה עוברת מאדם לאדם היא נחלשת."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:39", "text": "ככל שהטומאה היא בדור רחוק יותר מאב הטומאה היא בדרגה נמוכה יותר ומטמאת פחות דברים."}, {"cls": "p-strong", "id": "gabei-tumaot-tanan:40", "text": "ככל שהטומאה בדרגה נמוכה יותר, היא מטמאת פחות דברים."}]}, {"type": "single", "tag": "h3", "cls": "", "id": "gabei-tumaot-tanan:41", "text": "אבות ותולדות"}, {"type": "single", "tag": "p", "cls": "p-strong", "id": "gabei-tumaot-tanan:42", "text": "בדיני טומאה וטהרה יש אבות ותולדות. הדבר המטמא הוא אב והדבר שנטמא הוא תולדה של הטומאה. לתולדה יש דין שונה מהאב שלו. כי אב מטמא גם אדם וכלים ותולדה לא מטמא אדם וכלים."}]}};
    (function () {
      var overrides = {}; // { lessonId: { itemId: text, ... } }
      LESSON_ORDER.forEach(function (lid) { overrides[lid] = {}; });

      var currentLesson = LESSON_ORDER[0];
      var authGateEl = document.getElementById("auth-gate");
      var adminMainEl = document.getElementById("admin-main");
      var tabsEl = document.getElementById("tabs");
      var contentEl = document.getElementById("content");
      var dirtyCountEl = document.getElementById("dirty-count");
      var btnLogout = document.getElementById("btn-logout");
      var pendingTimers = {};

      function currentText(item) {
        var o = overrides[currentLesson];
        return Object.prototype.hasOwnProperty.call(o, item.id) ? o[item.id] : item.text;
      }

      function isDirty(item) {
        var o = overrides[currentLesson];
        return Object.prototype.hasOwnProperty.call(o, item.id) && o[item.id] !== item.text;
      }

      // Group overrides are stored as a whole array (replacing the block's
      // original paragraphs), so "dirty" just means an override exists.
      function currentGroupItems(block) {
        var o = overrides[currentLesson];
        if (Object.prototype.hasOwnProperty.call(o, block.id)) return o[block.id];
        return block.items.map(function (it) { return { text: it.text, cls: it.cls }; });
      }

      function isDirtyGroup(block) {
        return Object.prototype.hasOwnProperty.call(overrides[currentLesson], block.id);
      }

      function groupEqualsOriginal(arr, items) {
        if (arr.length !== items.length) return false;
        for (var i = 0; i < arr.length; i++) {
          if (arr[i].text !== items[i].text || (arr[i].cls || "") !== (items[i].cls || "")) return false;
        }
        return true;
      }

      function tagLabel(tag, cls) {
        if (tag === "h1") return "כותרת ראשית";
        if (tag === "h2") return "כותרת קטע";
        if (tag === "h3") return "כותרת משנה";
        if (cls === "p-strong") return "טקסט מודגש";
        if (cls === "p-light") return "טקסט רקע";
        return "טקסט";
      }

      function lessonDirtyCount(lid) {
        var n = 0;
        var o = overrides[lid];
        LESSONS[lid].blocks.forEach(function (block) {
          if (block.type === "single") {
            if (Object.prototype.hasOwnProperty.call(o, block.id) && o[block.id] !== block.text) n++;
          } else if (Object.prototype.hasOwnProperty.call(o, block.id)) {
            n++;
          }
        });
        return n;
      }

      function renderTabs() {
        tabsEl.innerHTML = "";
        LESSON_ORDER.forEach(function (lid) {
          var lesson = LESSONS[lid];
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tab" + (lid === currentLesson ? " active" : "");
          var dot = lessonDirtyCount(lid) > 0 ? '<span class="dot"></span>' : "";
          btn.innerHTML = lesson.title + dot;
          btn.addEventListener("click", function () {
            currentLesson = lid;
            renderTabs();
            renderContent();
          });
          tabsEl.appendChild(btn);
        });
      }

      function autoGrow(ta) {
        ta.style.height = "auto";
        ta.style.height = ta.scrollHeight + "px";
      }

      function setStatus(statusEl, state, label) {
        statusEl.className = "save-status" + (state ? " status-" + state : "");
        statusEl.textContent = label || "";
      }

      function saveSingle(lessonId, item, value, statusEl) {
        setStatus(statusEl, "saving", "שומר…");
        var payload = {};
        payload[item.id] = value === item.text ? deleteField() : value;
        payload.updatedAt = new Date().toISOString();
        setDoc(doc(getDb(), "content", lessonId), payload, { merge: true })
          .then(function () { setStatus(statusEl, "saved", "נשמר באתר ✓"); })
          .catch(function () { setStatus(statusEl, "error", "שגיאה בשמירה"); });
      }

      function saveGroup(lessonId, block, arr, statusEl) {
        setStatus(statusEl, "saving", "שומר…");
        var payload = {};
        payload[block.id] = groupEqualsOriginal(arr, block.items) ? deleteField() : arr;
        payload.updatedAt = new Date().toISOString();
        setDoc(doc(getDb(), "content", lessonId), payload, { merge: true })
          .then(function () { setStatus(statusEl, "saved", "נשמר באתר ✓"); })
          .catch(function () { setStatus(statusEl, "error", "שגיאה בשמירה"); });
      }

      function fieldShell() {
        var wrap = document.createElement("div");
        var labelRow = document.createElement("div");
        labelRow.className = "field-label";
        var badge = document.createElement("span");
        badge.className = "tag-badge";
        var resetBtn = document.createElement("button");
        resetBtn.type = "button";
        resetBtn.className = "reset-link";
        resetBtn.textContent = "איפוס לטקסט המקורי";
        var statusEl = document.createElement("span");
        statusEl.className = "save-status";
        labelRow.appendChild(badge);
        labelRow.appendChild(resetBtn);
        labelRow.appendChild(statusEl);
        wrap.appendChild(labelRow);
        return { wrap: wrap, badge: badge, resetBtn: resetBtn, statusEl: statusEl };
      }

      function renderSingleField(item, lessonId) {
        var isHeading = item.tag === "h1" || item.tag === "h2" || item.tag === "h3";
        var shell = fieldShell();
        var wrap = shell.wrap, badge = shell.badge, resetBtn = shell.resetBtn, statusEl = shell.statusEl;
        wrap.className = "field f-" + (isHeading ? item.tag : "p") + (item.cls ? " cls-" + item.cls : "") + (isDirty(item) ? " edited" : "");
        badge.textContent = tagLabel(item.tag, item.cls);

        var control;
        if (isHeading) {
          control = document.createElement("input");
          control.type = "text";
        } else {
          control = document.createElement("textarea");
          control.rows = 1;
        }
        control.value = currentText(item);

        control.addEventListener("input", function () {
          if (!isHeading) autoGrow(control);
          overrides[lessonId][item.id] = control.value;
          wrap.classList.toggle("edited", isDirty(item));
          renderTabs();

          clearTimeout(pendingTimers[item.id]);
          setStatus(statusEl, null, "");
          pendingTimers[item.id] = setTimeout(function () {
            saveSingle(lessonId, item, control.value, statusEl);
          }, 600);
        });

        resetBtn.addEventListener("click", function () {
          clearTimeout(pendingTimers[item.id]);
          delete overrides[lessonId][item.id];
          control.value = item.text;
          if (!isHeading) autoGrow(control);
          wrap.classList.remove("edited");
          renderTabs();
          saveSingle(lessonId, item, item.text, statusEl);
        });

        wrap.appendChild(control);
        contentEl.appendChild(wrap);
        if (!isHeading) requestAnimationFrame(function () { autoGrow(control); });
      }

      // Groups (2+ paragraphs with no heading between them on the live page)
      // are edited together in one textarea. Enter = new paragraph; the
      // whole array is saved as one Firestore field, so paragraphs can be
      // freely added or removed, not just re-worded.
      var STYLE_OPTIONS = [["", "רגיל"], ["p-light", "רקע (בהיר)"], ["p-strong", "מודגש"]];

      function buildStyleSelect(selectedCls) {
        var select = document.createElement("select");
        STYLE_OPTIONS.forEach(function (pair) {
          var opt = document.createElement("option");
          opt.value = pair[0];
          opt.textContent = pair[1];
          if (pair[0] === (selectedCls || "")) opt.selected = true;
          select.appendChild(opt);
        });
        return select;
      }

      function renderGroupField(block, lessonId) {
        var shell = fieldShell();
        var wrap = shell.wrap, badge = shell.badge, resetBtn = shell.resetBtn, statusEl = shell.statusEl;
        wrap.className = "field f-p" + (isDirtyGroup(block) ? " edited" : "");

        // currentArr is the live working state for this group: kept in sync
        // with both the textarea (text + paragraph count) and the per-
        // paragraph style selects below it, so a manually chosen style
        // survives further text edits instead of being recomputed away.
        var currentArr = currentGroupItems(block).map(function (p) { return { text: p.text, cls: p.cls || "" }; });
        badge.textContent = "טקסט (" + currentArr.length + " פסקאות)";

        var control = document.createElement("textarea");
        control.rows = 1;
        control.value = currentArr.map(function (p) { return p.text; }).join("\n");

        var stylesEl = document.createElement("div");
        stylesEl.className = "cg-styles";

        function renderStyleRows() {
          stylesEl.innerHTML = "";
          currentArr.forEach(function (p, idx) {
            var row = document.createElement("div");
            row.className = "cg-style-row";
            var label = document.createElement("span");
            label.className = "cg-style-label";
            label.textContent = "פסקה " + (idx + 1);
            var select = buildStyleSelect(p.cls);
            select.addEventListener("change", function () {
              currentArr[idx].cls = select.value;
              commit();
            });
            row.appendChild(label);
            row.appendChild(select);
            stylesEl.appendChild(row);
          });
        }

        function commit() {
          overrides[lessonId][block.id] = currentArr.map(function (p) { return { text: p.text, cls: p.cls }; });
          badge.textContent = "טקסט (" + currentArr.length + " פסקאות)";
          wrap.classList.toggle("edited", isDirtyGroup(block));
          renderTabs();

          clearTimeout(pendingTimers[block.id]);
          setStatus(statusEl, null, "");
          pendingTimers[block.id] = setTimeout(function () {
            saveGroup(lessonId, block, overrides[lessonId][block.id], statusEl);
          }, 600);
        }

        control.addEventListener("input", function () {
          autoGrow(control);
          var lines = control.value.split("\n");
          currentArr = lines.map(function (text, idx) {
            var cls = idx < currentArr.length ? currentArr[idx].cls : currentArr[currentArr.length - 1].cls;
            return { text: text, cls: cls };
          });
          renderStyleRows();
          commit();
        });

        resetBtn.addEventListener("click", function () {
          clearTimeout(pendingTimers[block.id]);
          delete overrides[lessonId][block.id];
          currentArr = block.items.map(function (it) { return { text: it.text, cls: it.cls || "" }; });
          control.value = currentArr.map(function (p) { return p.text; }).join("\n");
          renderStyleRows();
          autoGrow(control);
          wrap.classList.remove("edited");
          renderTabs();
          saveGroup(lessonId, block, currentArr.map(function (p) { return { text: p.text, cls: p.cls }; }), statusEl);
        });

        renderStyleRows();
        wrap.appendChild(control);
        wrap.appendChild(stylesEl);
        contentEl.appendChild(wrap);
        requestAnimationFrame(function () { autoGrow(control); });
      }

      function renderContent() {
        contentEl.innerHTML = "";
        var lesson = LESSONS[currentLesson];
        var lessonId = currentLesson;
        lesson.blocks.forEach(function (block) {
          if (block.type === "single") {
            renderSingleField(block, lessonId);
          } else {
            renderGroupField(block, lessonId);
          }
        });
      }

      function loadOverrides() {
        var loads = LESSON_ORDER.map(function (lid) {
          return getDoc(doc(getDb(), "content", lid)).then(function (snap) {
            if (!snap.exists()) return;
            var data = snap.data();
            Object.keys(data).forEach(function (cid) {
              if (cid === "updatedAt") return;
              overrides[lid][cid] = data[cid];
            });
          }).catch(function () { /* best effort */ });
        });
        return Promise.all(loads);
      }

      btnLogout.addEventListener("click", function () {
        logoutUser();
      });

      if (isReady()) {
        watchAuthState(function (user) {
          if (user) {
            authGateEl.hidden = true;
            adminMainEl.hidden = false;
            dirtyCountEl.textContent = user.displayName ? "מחובר/ת: " + user.displayName : "מחובר/ת";
            loadOverrides().then(function () {
              renderTabs();
              renderContent();
            });
          } else {
            authGateEl.hidden = false;
            adminMainEl.hidden = true;
          }
        });
      }
    })();
  </script>
</body>
</html>
