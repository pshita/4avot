    var LESSON_ORDER = ["avot-vetoldot", "shor-umave", "lo-hari-hashor", "gabei-shabbat-tanan", "umai-ika", "gabei-tumaot-tanan"];
    var LESSONS = {"avot-vetoldot": {"title": "אבות נזיקין", "titleText": "אבות ותולדות", "blocks": [{"bid": "b1", "type": "box"}, {"bid": "b2", "type": "paragraphs", "items": [{"text": "יהודה קנטור הוא ישראלי שנחטף בלידתו ונמסר לאימוץ אצל משפחה חשוכת ילדים. להוריו נאמר שנולד חולה ונפטר מיד. להורים וילדים יש דמיון מוחלט מבחינה גנטית, כך אחרי שנים רבות הוא פנה לחברה ישראלית פורצת דרך, שמחזיקה במאגר גנטי אדיר ומצא התאמה מוחלטת בינו לאדם אחר, זה היה אביו האמיתי. בדרך כלל אבא ובן יהיו דומים גם בתווי הפנים וחלק מהאופי והכישורים.", "cls": "p-light"}, {"text": "אבא קוראים רק למי שיש לו ילד. והילד חייב להיות דומה לאבא.", "cls": "p-strong"}]}, {"bid": "b3", "type": "quiz", "qid": "q13", "question": "למי קוראים בשם \"אבא\"?", "choices": [{"text": "כל אדם מבוגר", "correct": false}, {"text": "רק מי שיש לו ילד", "correct": true}, {"text": "כל אדם שהתחתן", "correct": false}], "extra": {}}, {"bid": "b4", "type": "quiz", "qid": "q14", "question": "למי קוראים בשם \"ילד\"?", "choices": [{"text": "ילד לפני בר מצוה", "correct": false}, {"text": "מי שדומה לאבא שלו", "correct": true}, {"text": "מי שעושה שטויות", "correct": false}], "extra": {}}, {"bid": "b5", "type": "heading", "tag": "h3", "cls": "", "text": "מכה שלא כתובה בתורה"}, {"bid": "b6", "type": "paragraphs", "items": [{"text": "למדנו שיש הבדל בין כל אחד מהמזיקים שהתורה מחייבת בהם. \"בור\" זה תקלה ברשות הרבים ובא מישהו אחר וניזוק בו.", "cls": "p-strong"}, {"text": "אדם שבר בקבוק זכוכית ברשות הרבים, אופניים עברו שם וקיבלו חור בגלגל, לא כתוב בתורה מה הדין במקרה כזה, גם לא כתוב מה הדין אם שפך שמן זית, קנולה, או קוקוס ובא מישהו אחר, החליק וניזוק.", "cls": "p-strong"}, {"text": "המקרים האלו ממש דומים לבור שכתוב בתורה, בשניהם מדובר בתקלה שהמזיק עשה ברשות הרבים ובא מישהו אחר וניזוק. לכן המקרים האלו הם תולדה של המזיק \"בור\" והדין שלהם דומה.", "cls": "p-strong"}, {"text": "\"אב\": הוא המזיק שכתוב בתורה במפורש שהמזיק חייב עליו. \"תולדה\": מזיקים נוספים שלא כתובים בתורה, אבל הם דומים למזיקים שכתובים בתורה וגם בהם חייב.", "cls": "p-strong"}]}, {"bid": "b7", "type": "quiz", "qid": "q15", "question": "מהו \"אב\" נזיקין?", "choices": [{"text": "מזיק שדומה למזיק שכתוב בתורה", "correct": false}, {"text": "מזיק שכתוב בתורה במפורש", "correct": true}, {"text": "מזיק שאין חייבים עליו כלל", "correct": false}], "extra": {}}, {"bid": "b8", "type": "quiz", "qid": "q16", "question": "אדם שבר בקבוק זכוכית ברשות הרבים והזיק, לאיזה מזיק שמוזכר בתורה דומה המקרה הזה?", "choices": [{"text": "שן", "correct": false}, {"text": "בור", "correct": true}, {"text": "אש", "correct": false}], "extra": {}}]}, "shor-umave": {"title": "השור, הבור, המבעה וההבער", "titleText": "השור, הבור, המבעה וההבער", "blocks": [{"bid": "b1", "type": "box"}, {"bid": "b2", "type": "heading", "tag": "h2", "cls": "", "text": "המזיקים"}, {"bid": "b3", "type": "raw", "html": "<ul class=\"avot-list\">\n<li data-kind=\"shen\">שן</li>\n<li data-kind=\"regel\">רגל</li>\n<li data-kind=\"bor\">בור</li>\n<li data-kind=\"esh\">אש</li>\n</ul>"}, {"bid": "b4", "type": "heading", "tag": "h3", "cls": "", "text": "שן"}, {"bid": "b5", "type": "paragraphs", "items": [{"text": "רועי צאן ובקר מעדיפים לשלוח את הבהמות שלהם לשטחי מרעה, שם הם יוכלו לאכול חינם וליהנות ממרחבים עצומים. גם היום המדינה מחכירה בזול שטחים לא מיושבים למרעה וזה מייצר הרבה ויכוחים:", "cls": "p-light"}]}, {"bid": "b6", "type": "raw", "html": "<div class=\"example\">\n<p data-cid=\"shor-umave:4\">התורה כבר מספרת שרועי הצאן של לוט נתנו להם לאכול בשטחים פרטיים, זה הוביל לריב עם רועי הצאן של אברהם. כדי לשמור על שלום, הם נפרדו אחד מהשני ולוט בחר לעבור לאזור העיר סדום.</p>\n</div>"}, {"bid": "b7", "type": "raw", "html": "<div class=\"example\">\n<p data-cid=\"shor-umave:5\">באנדי הוא תושב ארצות הברית שבבעלותו 1500 פרות ושוורים, הם מסתובבים וגדלים בשטח עצום של 600,000 דונם, פי 5 מכל ירושלים. בשנת תשע\"ד התעורר ויכוח בינו לממשלה למי שייך השטח, הם חייבו אותו מיליון דולר על כל מה שבעלי החיים שלו אכלו, אבל הוא לא היה מוכן לשלם. השוטרים הצליחו בכוח להחרים לו 400 מבעלי החיים שלו, אבל 1000 מפגינים, מאות מתוכם חמושים, הגיעו לתמוך בו ולעצור את השוטרים בכוח.</p>\n</div>"}, {"bid": "b8", "type": "paragraphs", "items": [{"text": "\"שן\" הוא שם של נזק שקורה כי בעל חי אוכל כדי ליהנות מהאכילה.", "cls": "p-strong"}]}, {"bid": "b9", "type": "quiz", "qid": "q43", "question": "\"שן\" הוא שם של נזק שקורה כי בעל חי:", "choices": [{"text": "דורך על חפצים בהליכתו", "correct": false}, {"text": "אוכל כדי ליהנות מהאכילה", "correct": true}, {"text": "משאיר בור פתוח ברשות הרבים", "correct": false}], "extra": {"marksSection": "shen"}}, {"bid": "b10", "type": "heading", "tag": "h3", "cls": "", "text": "רגל"}, {"bid": "b11", "type": "raw", "html": "<div class=\"example\">\n<p data-cid=\"shor-umave:8\">בעל חי שהלך ממקום אחד למקום אחר, בדרך היו חפצים והוא דרך עליהם. משום מה הוא לא הבין שאם דורכים עליהם, הם עלולים להתקלקל ועדיף לעבור מהצד.</p>\n</div>"}, {"bid": "b12", "type": "paragraphs", "items": [{"text": "\"רגל\" הוא שם של נזק שקורה כי בעל חי רוצה ללכת ממקום אחד לשני ומזיק בהליכתו.", "cls": "p-strong"}]}, {"bid": "b13", "type": "quiz", "qid": "q44", "question": "\"רגל\" הוא שם של נזק שקורה כי בעל חי:", "choices": [{"text": "מזיק תוך כדי הליכתו ממקום למקום", "correct": true}, {"text": "נהנה מאכילת רכוש הזולת", "correct": false}, {"text": "מדליק אש שמתפשטת ברוח", "correct": false}], "extra": {"marksSection": "regel"}}, {"bid": "b14", "type": "heading", "tag": "h3", "cls": "", "text": "בור"}, {"bid": "b15", "type": "raw", "html": "<div class=\"example with-media\">\n<div>\n<p data-cid=\"shor-umave:11\">הכבישים מלאים בורות של ביוב, חשמל ותקשורת. בערים מושלגות, השלג ממש אוכל את הכביש לאט לאט ונפתחים בו בורות. רק את עיריית ניו יורק תובעים אלפי אנשים בשנה, בסך כולל של מיליוני דולרים על נזקים למערכת הגלגלים מבורות בכביש. בעיר לוס אנג'לס נפער בולען עצום ושני רכבים נפלו בתוכו.</p>\n</div>\n<figure class=\"media-slot\" style=\"border-style: solid; padding: 0;\">\n<img alt=\"בולען בכביש שרכב נפל לתוכו\" src=\"../assets/images/arba-avot-nezikin/bor-1.jpg\" style=\"border-radius:10px;\"/>\n</figure>\n</div>"}, {"bid": "b16", "type": "paragraphs", "items": [{"text": "\"בור\" הוא שם של נזק שקורה כי השאיר בור פתוח, נפלו בו בעלי חיים או רכוש וניזוקו.", "cls": "p-strong"}]}, {"bid": "b17", "type": "quiz", "qid": "q45", "question": "\"בור\" הוא שם של נזק שקורה כי:", "choices": [{"text": "בעל חי אוכל מרכוש הזולת", "correct": false}, {"text": "אדם השאיר בור פתוח ורכוש נפל בו וניזוק", "correct": true}, {"text": "אש התפשטה ושרפה רכוש", "correct": false}], "extra": {"marksSection": "bor"}}, {"bid": "b18", "type": "heading", "tag": "h3", "cls": "", "text": "אש"}, {"bid": "b19", "type": "raw", "html": "<div class=\"example\">\n<p data-cid=\"shor-umave:14\">בחנוכה תשע\"א 2 בחורים השאירו גחל בוער ביער בכרמל, במהלך אותו יום נשבו רוחות חזקות שליבו את האש והתוצאה הייתה אסון. 44 בני אדם נספו ל\"ע, 17,000 איש פונו מבתיהם, 25,000 דונם נשרפו ובהם כמה מיליוני עצים, הנזק הוערך בשווי של 250 מיליון ש\"ח.</p>\n</div>"}, {"bid": "b20", "type": "raw", "html": "<div class=\"example\">\n<p data-cid=\"shor-umave:15\">אחרי 5 ימים של מאמץ אדיר, אלפי כבאים מהארץ ומחוץ לארץ, מאות משאיות כיבוי ועשרות מטוסים מכל העולם, הצליחו להשתלט על השריפה.</p>\n</div>"}, {"bid": "b21", "type": "paragraphs", "items": [{"text": "\"אש\" הוא שם של נזק שקורה כי המזיק הדליק אש ובגלל הרוח היא התפשטה גם לחצר של אחרים ושרפה רכוש.", "cls": "p-strong"}]}, {"bid": "b22", "type": "quiz", "qid": "q46", "question": "\"אש\" הוא שם של נזק שקורה כי:", "choices": [{"text": "בעל חי הולך ודורך על רכוש הזולת", "correct": false}, {"text": "אדם מדליק אש והיא מתפשטת ומזיקה", "correct": true}, {"text": "אדם חופר בור ברשות הרבים", "correct": false}], "extra": {"marksSection": "esh"}}, {"bid": "b23", "type": "box"}, {"bid": "b24", "type": "heading", "tag": "h2", "cls": "", "text": "החומרה שיש במזיקים"}, {"bid": "b25", "type": "heading", "tag": "h3", "cls": "", "text": "אכלה להנאתה"}, {"bid": "b26", "type": "paragraphs", "items": [{"text": "בעלי חיים עסוקים באכילה לאורך רוב היום, פרה אוכלת לפחות 12 שעות ביממה, כל פעם קצת, חלק מהזמן היא אוכלת אוכל חדש ובשאר הזמן מעלה גרה ולועסת את האוכל הקיים. במשך היום זה מגיע לפחות 50 קילו. באמת פרה. בעלי חיים אוהבים ליהנות ועדיף שזה יהיה כל היום.", "cls": "p-light"}, {"text": "שור שמזיק ב\"שן\", נהנה להזיק, קשה לשמור עליו בגלל זה, הבעלים פושע אם הוא מחזיק שור שהוא לא מסוגל להשתלט עליו וחייב.", "cls": "p-strong"}, {"text": "בלשון הגמרא: \"אכלה להנאתה\".", "cls": "p-strong"}]}, {"bid": "b27", "type": "quiz", "qid": "q48", "question": "על איזה מזיק קשה לשמור כי הוא \"אוכל להנאתו\"?", "choices": [{"text": "בור", "correct": false}, {"text": "שן", "correct": true}, {"text": "אש", "correct": false}], "extra": {}}, {"bid": "b28", "type": "heading", "tag": "h3", "cls": "", "text": "הזיקה מצוי"}, {"bid": "b29", "type": "paragraphs", "items": [{"text": "הגמרא אומרת שאצל בעל חיים הנזק הכי נפוץ הוא רגל, כי הוא הולך הרבה, יותר משאר הפעולות שהוא עושה ויכולות להזיק, קשה לשמור עליו בגלל זה, הבעלים פושע אם הוא מחזיק שור שהוא לא מסוגל להשתלט עליו וחייב.", "cls": "p-strong"}, {"text": "בלשון הגמרא: \"הזיקה מצוי\" ו\"הזיקה בדרך הילוכה\".", "cls": "p-strong"}]}, {"bid": "b30", "type": "quiz", "qid": "q49", "question": "איזה נזק הכי נפוץ אצל בעלי חיים?", "choices": [{"text": "שן", "correct": false}, {"text": "רגל", "correct": true}, {"text": "בור", "correct": false}], "extra": {}}, {"bid": "b31", "type": "heading", "tag": "h3", "cls": "", "text": "יש בהם רוח חיים"}, {"bid": "b32", "type": "paragraphs", "items": [{"text": "אש לא יכולה להתפשט ולהזיק במקומות חדשים בלי הרוח, לכן המזיק יכול לטעון שהוא לא חשב שתגיע הרוח והאש תתפשט ותזיק, אבל בעל חי לא צריך אחרים שיעזרו לו להזיק הוא מחליט לבד ללכת ולהזיק באכילה, או בהליכה, לכן הבעלים היה אמור להבין שיכול להיות כאן נזק. בלשון הגמרא: \"יש בהם רוח חיים\".", "cls": "p-strong"}]}, {"bid": "b33", "type": "quiz", "qid": "q50", "question": "מדוע יש סיכוי טוב יותר לנזק במזיקים ש\"יש בהם רוח חיים\"?", "choices": [{"text": "כי בעל החי לא ניזוק בעצמו מעולם", "correct": false}, {"text": "כי בעל החי מחליט בעצמו ללכת ולהזיק, ואינו זקוק לרוח כדי להזיק", "correct": true}, {"text": "כי בעל החי תמיד נמצא באותו מקום", "correct": false}], "extra": {}}, {"bid": "b34", "type": "heading", "tag": "h3", "cls": "", "text": "דרכם לילך ולהזיק"}, {"bid": "b35", "type": "paragraphs", "items": [{"text": "בור לא עושה ביקורי בית כדי להזיק, הוא תמיד נמצא באותו מקום ומחכה שהניזק יגיע אליו וייפול בו, אבל שור ואש הולכים בעצמם אל הניזק, לכן הבעלים היה אמור להבין שיכול להיות כאן נזק. בלשון הגמרא: \"דרכם לילך ולהזיק\".", "cls": "p-strong"}]}, {"bid": "b36", "type": "quiz", "qid": "q51", "question": "יש מזיקים ש\"דרכם לילך ולהזיק\", מה הכוונה?", "choices": [{"text": "הם נשארים במקום והניזק מגיע אליהם", "correct": false}, {"text": "הם הולכים בעצמם אל הניזק ומזיקים לו", "correct": true}, {"text": "הם יכולים להזיק", "correct": false}], "extra": {}}, {"bid": "b37", "type": "quiz", "qid": "q52", "question": "מי הם המזיקים ש\"דרכם לילך ולהזיק\"?", "choices": [{"text": "בור ואש", "correct": false}, {"text": "שור ואש", "correct": true}, {"text": "כל המזיקים", "correct": false}], "extra": {}}, {"bid": "b38", "type": "heading", "tag": "h3", "cls": "", "text": "דרכם להזיק ושמירתן עליך"}, {"bid": "b39", "type": "paragraphs", "items": [{"text": "בעל חי אוכל, ישן ונושם, זה חלק מהתכונות שלו. כך גם חלק מהתכונות שלו זה שהוא לא מבין אם אוכל מרכוש של מישהו אחר, או דורך ושובר תוך כדי הליכה. חלק מהתכונות של אש זה שהיא מתפשטת ושל בור פתוח, זה שיש בו אויר ואפשר ליפול בו.", "cls": "p-strong"}, {"text": "לא מפתיע שקורה כאן נזק ולכן הבעלים היה אמור להבין שהגיוני שזה יזיק. בלשון הגמרא: \"דרכם להזיק ושמירתן עליך\", דרכם להזיק ומוטל על הבעלים לשמור עליהם.", "cls": "p-strong"}]}, {"bid": "b40", "type": "quiz", "qid": "q53", "question": "איזו תכונה משותפת לכל המזיקים ומטילה על הבעלים חובת שמירה?", "choices": [{"text": "הבעלים צריך לשמור עליהם", "correct": false}, {"text": "דרכם להזיק", "correct": false}, {"text": "כל התשובות נכונות", "correct": true}], "extra": {}}, {"bid": "b41", "type": "heading", "tag": "h3", "cls": "", "text": "לסיכום"}, {"bid": "b42", "type": "paragraphs", "items": [{"text": "המזיקים שנכתבו בתורה שונים אחד מהשני, לכל אחד יש סיבה שונה מדוע דווקא הוא יכול להזיק, מדוע הבעלים היה אמור להבין שצריך לשמור שלא יהיה כאן נזק. מלבד זה יש למזיקים גם תכונות משותפות שבגללם הם יכולים להזיק.", "cls": "p-strong"}]}, {"bid": "b43", "type": "raw", "html": "<div class=\"table-scroll\">\n<table class=\"data-table\">\n<thead>\n<tr>\n<th>אב</th>\n<th>הסבר</th>\n<th>הנאה להזיקה</th>\n<th>הזיקו מצוי</th>\n<th>יש בו רוח חיים</th>\n<th>דרכו לילך ולהזיק</th>\n<th>דרכו להזיק ושמירתו עליך</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>שן</td>\n<td>בעל חי שאוכל מהרכוש של השני</td>\n<td>✓</td><td></td><td>✓</td><td>✓</td><td>✓</td>\n</tr>\n<tr>\n<td>רגל</td>\n<td>בעל חי שהולך ומזיק תוך כדי הליכתו</td>\n<td></td><td>✓</td><td></td><td></td><td></td>\n</tr>\n<tr>\n<td>אש</td>\n<td>הדליק אש והתפשטה והזיקה</td>\n<td></td><td></td><td></td><td></td><td></td>\n</tr>\n<tr>\n<td>בור</td>\n<td>חפר בור ונפל בו משהו וניזוק</td>\n<td></td><td></td><td></td><td></td><td></td>\n</tr>\n</tbody>\n</table>\n</div>"}, {"bid": "b44", "type": "quiz", "qid": "q54", "question": "במה מיוחד כל אחד מהמזיקים הכתובים בתורה?", "choices": [{"text": "כולם דומים לגמרי אחד לשני", "correct": false}, {"text": "לכל אחד סיבה אחרת מדוע הוא יכול להזיק", "correct": true}, {"text": "התורה לא הסבירה מדוע הם חייבים", "correct": false}], "extra": {}}, {"bid": "b45", "type": "box"}, {"bid": "b46", "type": "heading", "tag": "h3", "cls": "", "text": "שור ומבעה"}, {"bid": "b47", "type": "paragraphs", "items": [{"text": "לשיטת שמואל: שור: רגל, מבעה: שן.", "cls": "p-strong"}]}, {"bid": "b48", "type": "quiz", "qid": "q55", "question": "לפי שיטת שמואל, מהו \"מבעה\"?", "choices": [{"text": "רגל", "correct": false}, {"text": "שן", "correct": true}, {"text": "בור", "correct": false}], "extra": {}}, {"bid": "b49", "type": "quiz", "qid": "q56", "question": "לפי שיטת שמואל, מהו \"שור\"?", "choices": [{"text": "רגל", "correct": true}, {"text": "שן", "correct": false}, {"text": "בור", "correct": false}], "extra": {}}]}, "lo-hari-hashor": {"title": "לא הרי השור כהרי המבעה", "titleText": "לא הרי השור כהרי המבעה", "blocks": [{"bid": "b1", "type": "box"}, {"bid": "b2", "type": "heading", "tag": "h3", "cls": "", "text": "העיקרון מובן"}, {"bid": "b3", "type": "paragraphs", "items": [{"text": "אדם ניסה לשדוד בנק ונתפס. התברר שהוא איים על הבנקאי עם רובה מים שנראה ממש כמו הדבר האמיתי. הוא גם טען במשפט שהוא זכאי, כי כתוב בחוק שאסור לאיים על אדם אחר עם נשק, רובה מים פחות מסוכן ואין הוכחה שגם הוא אסור.", "cls": "p-light"}, {"text": "השופט לא התרשם ופסק שבאמת אין התייחסות בחוק למקרה הזה ואין לנו הוכחה שגם רובה מים אסור, אבל המקרה הזה דומה בדיוק לשימוש בנשק אמיתי, כי הבנקאי הרי חשב שמדובר באיום אמיתי וגם זה אסור באותה מידה.", "cls": "p-light"}, {"text": "התורה מלמדת על מקרים שהמזיק חייב בהם. אין צורך לכתוב את כל האפשרויות שיש בעולם להזיק, מספיק להבין את העיקרון וממנו נלמד שגם מזיקים נוספים חייבים. אבל נזק קטן יותר צריך לכתוב שחייב, כי אולי חייב רק במקרה חמור.", "cls": "p-strong"}]}, {"bid": "b4", "type": "quiz", "qid": "q19", "question": "מדוע אין צורך שהתורה תכתוב את כל האפשרויות שיש להזיק?", "choices": [{"text": "כי כל הנזקים פטורים מתשלום", "correct": false}, {"text": "כי מספיק להבין את העיקרון, וממנו ללמוד גם על מקרים נוספים", "correct": true}, {"text": "כי כל המזיקים זהים לחלוטין", "correct": false}], "extra": {}}, {"bid": "b5", "type": "heading", "tag": "h3", "cls": "", "text": "על איזה מזיק קשה יותר לשמור?"}, {"bid": "b6", "type": "paragraphs", "items": [{"text": "המזיקים שנכתבו בתורה שונים אחד מהשני, לכל אחד יש סיבה שונה מדוע דווקא הוא יכול להזיק, מדוע הבעלים היה אמור להבין שצריך לשמור שלא יהיה כאן נזק. מלבד זה יש למזיקים גם תכונות משותפות שבגללם הם יכולים להזיק.", "cls": "p-strong"}, {"text": "מה קשה יותר קור, או חום? רעב, או צמא? קושי להירדם, או קושי להתעורר? לא בכל דבר אפשר להחליט מה קשה יותר, יש כאלו שמעדיפים כך ויש כאלו שמעדיפים אחרת.", "cls": "p-strong"}, {"text": "אי אפשר להחליט על איזה מזיק קשה יותר לשמור, האם על בעל חי שמזיק להנאתו, או על בעל חי שהזיקו מצוי, האם על אלו שיש בהם רוח חיים, או על אלו שדרכם לילך ולהזיק, או שאולי הם דווקא קשים באותה מידה. הם שונים אחד מהשני ובכל אחד מהם יש סיבה אחרת לרצון של הבהמה להזיק.", "cls": "p-strong"}, {"text": "לכן אי אפשר לדעת איזה מזיק קל יותר ואיזה חמור יותר.", "cls": "p-strong"}, {"text": "ובלשון הגמרא: \"לא הרי השור (רגל) כהרי המבעה (שן)\": לא דומה סיבת הנזק ברגל לסיבת הנזק בשן ואולי ברגל קשה יותר לשמור ו\"לא הרי המבעה (שן) כהרי השור (רגל)\": לא דומה סיבת הנזק בשן לסיבת הנזק ברגל ואולי בשן קשה יותר לשמור.", "cls": "p-strong"}]}, {"bid": "b7", "type": "quiz", "qid": "q20", "question": "על איזה מזיק קשה יותר לשמור:", "choices": [{"text": "רגל תמיד קשה יותר לשמור משן", "correct": false}, {"text": "אי אפשר לקבוע על איזה מזיק קשה יותר לשמור, כי לכל אחד סיבה שונה", "correct": true}, {"text": "שן קשה יותר לשמור עליו מכל שאר המזיקים", "correct": false}], "extra": {}}, {"bid": "b8", "type": "quiz", "qid": "q21", "question": "\"לא הרי השור כהרי המבעה\", למה הכוונה ב\"שור\" וב\"מבעה\"?", "choices": [{"text": "בור ואש", "correct": false}, {"text": "רגל ושן", "correct": true}, {"text": "שן ורגל", "correct": false}], "extra": {}}, {"bid": "b9", "type": "heading", "tag": "h3", "cls": "", "text": "צריך לכתוב את כל המזיקים"}, {"bid": "b10", "type": "paragraphs", "items": [{"text": "בכל אחד מהמזיקים יש היגיון להגיד שדווקא בו הבעלים פושע במיוחד, יותר מבשאר המזיקים, כי דווקא בו הוא היה חייב להבין במיוחד שהולך להיות כאן נזק.", "cls": "p-strong"}, {"text": "לכן התורה צריכה לכתוב את כל המזיקים האלו ואין אפשרות לכתוב חלק ונלמד מהם שהשאר אסורים, כי אולי אלו שלא כתובים קלים יותר ופטורים.", "cls": "p-strong"}]}, {"bid": "b11", "type": "quiz", "qid": "q22", "question": "מדוע התורה צריכה לכתוב את כל המזיקים?", "choices": [{"text": "כי כל המזיקים זהים לגמרי", "correct": false}, {"text": "כי אלו שלא כתובים ייתכן שפטורים", "correct": true}, {"text": "כי אין כל דרך ללמוד היקש בין מזיקים", "correct": false}], "extra": {}}, {"bid": "b12", "type": "quiz", "qid": "q23", "question": "מדוע מזיק שהתורה לא כותבת ייתכן שפטור?", "choices": [{"text": "כי כל המזיקים זהים לגמרי", "correct": false}, {"text": "כי אולי הוא קלים יותר מהמזיקים הכתובים בתורה", "correct": true}, {"text": "כי אין כל דרך ללמוד היקש בין מזיקים", "correct": false}], "extra": {}}]}, "gabei-shabbat-tanan": {"title": "גבי שבת תנן", "titleText": "גבי שבת תנן", "blocks": [{"bid": "b1", "type": "box"}, {"bid": "b2", "type": "heading", "tag": "h3", "cls": "", "text": "ארבעים חסר אחת"}, {"bid": "b3", "type": "paragraphs", "items": [{"text": "במשכן היו 39 מלאכות חשובות שנצרכו לצורך עבודת המשכן, כל המלאכות האלו שהיו במשכן אסורות בשבת. אחת מהן הייתה כותב אותיות.", "cls": "p-light"}, {"text": "יש מלאכות נוספות שהיו במשכן, אבל לא היו חשובות. המלאכות האלו דומות למלאכות החשובות שהיו במשכן, לדוגמה: אדם שמצייר ציור, זה דומה למלאכת כותב. גם הם אסורות בשבת.", "cls": "p-light"}]}, {"bid": "b4", "type": "quiz", "qid": "q24", "question": "כמה \"אבות מלאכות\" היו במשכן?", "choices": [{"text": "ארבעים", "correct": false}, {"text": "שלושים ותשע", "correct": true}, {"text": "שלושים ושבע", "correct": false}], "extra": {}}, {"bid": "b5", "type": "quiz", "qid": "q25", "question": "מהי \"תולדה\" של מלאכה בשבת?", "choices": [{"text": "מלאכה שהייתה חשובה במשכן", "correct": false}, {"text": "מלאכה שדומה למלאכה חשובה במשכן", "correct": true}, {"text": "מלאכה שאינה אסורה בשבת", "correct": false}], "extra": {}}, {"bid": "b6", "type": "heading", "tag": "h3", "cls": "", "text": "אבות ותולדות"}, {"bid": "b7", "type": "paragraphs", "items": [{"text": "הגאון הרב יוסף שלום אלישיב, היה בן יחיד להוריו. הוא נפטר בשנת תשע\"ב, בגיל 102. באותו זמן היו לו בערך 1400 צאצאים, בשישה דורות - ילדים, נכדים, נינים, בני נינים ונכדי נינים. בממוצע נולד לו צאצא חדש בכל יומיים.", "cls": "p-light"}, {"text": "האבא הוא המקור של כל המשפחה וכל הצאצאים שמגיעים ממנו הם התולדות.", "cls": "p-strong"}, {"text": "כך גם בדיני שבת, \"אבות מלאכות\": הם המקור של איסורי שבת – המלאכות שהיו חשובות במשכן. \"תולדות\": הם אלו שדומים למלאכות שהיו חשובות במשכן.", "cls": "p-strong"}, {"text": "מסופר שרבי יוחנן וריש לקיש, לאחר לימוד משותף של שלוש וחצי שנים, מצאו 39 תולדות לכל אחד מהאבות.", "cls": "p-strong"}]}, {"bid": "b8", "type": "heading", "tag": "h3", "cls": "", "text": "כרת"}, {"bid": "b9", "type": "paragraphs", "items": [{"text": "יש עבירות חמורות שאדם עושה בכוונה, אבל בית דין לא יכול לחייב אותו את העונש שמגיע למי שעשה במזיד, כי לא יודעים שעשה את העבירה, או שלא יודעים אם עשה אותה בכוונה או בטעות. התורה מלמדת על 36 עבירות כאלו שהקב\"ה בוחן כליות ולב מעניש עליהם.", "cls": "p-strong"}, {"text": "העונש הזה נקרא \"כרת\" – אדם כזה ילך מהעולם הזה עד גיל 60 ולא יזכה לעולם הבא. הגמרא מספרת שרב יוסף עשה סעודה כשהגיע לגיל הזה, כי שמח שהוא לא חייב כרת. מקבלים את העונש הזה רק על עבירות שנעשו לאחר גיל 20.", "cls": "p-strong"}]}, {"bid": "b10", "type": "heading", "tag": "h3", "cls": "", "text": "הדין"}, {"bid": "b11", "type": "paragraphs", "items": [{"text": "הַמְּקוֹשֵׁשׁ - כשבני ישראל היו במדבר, היה אדם שאסף עצים בשבת, משה לא ידע איך לנהוג במקרה הזה, שאל את הקב\"ה וקיבל תשובה שדינו בסקילה.", "cls": "p-light"}, {"text": "שוגג: הוא אדם שעבר עבירה בטעות, הוא לא ידע שהיא אסורה. מזיד: הוא אדם שעבר עבירה בכוונה. התראה: כדי לדעת בביטחון שהוא באמת עשה את העבירה במזיד, צריך שאנשים יתנו לו התראה ויגידו לו שזה אסור.", "cls": "p-strong"}, {"text": "אדם שעשה מלאכה אסורה בשבת, בשוגג: חייב חטאת ובמזיד: חייב סקילה. אם עשה את המלאכה במזיד, אבל אין עדים והתראה, רק הקב\"ה יודע שזה היה במזיד וחייב כרת.", "cls": "p-strong"}, {"text": "אדם שעשה מלאכה אסורה בשבת תמיד חייב אותו דבר, אין הבדל אם עבר על אב מלאכה, או על תולדה.", "cls": "p-strong"}]}, {"bid": "b12", "type": "quiz", "qid": "q26", "question": "אדם שעשה מלאכה אחת אסורה בשבת במזיד, בלי עדים והתראה, מה דינו?", "choices": [{"text": "חטאת", "correct": false}, {"text": "סקילה", "correct": false}, {"text": "כרת", "correct": true}], "extra": {}}, {"bid": "b13", "type": "quiz", "qid": "q27", "question": "האם יש הבדל בעונש בין מי שעבר על \"אב מלאכה\" לבין מי שעבר על \"תולדה\"?", "choices": [{"text": "כן, העונש על האב חמור יותר", "correct": false}, {"text": "לא, העונש זהה בשני המקרים", "correct": true}, {"text": "כן, העונש על התולדה חמור יותר", "correct": false}], "extra": {}}, {"bid": "b14", "type": "heading", "tag": "h3", "cls": "", "text": "תולדותיהן כיוצא בהן"}, {"bid": "b15", "type": "paragraphs", "items": [{"text": "אנחנו רואים שגם בדיני שבת יש אבות ותולדות, כמו אצלנו בדיני נזיקין. לתולדות המלאכות שאסורות בשבת יש דין דומה כמו לאבות שלהם ולא דין שונה.", "cls": "p-strong"}]}, {"bid": "b16", "type": "quiz", "qid": "q28", "question": "מה הדמיון בין דיני שבת לדיני נזיקין?", "choices": [{"text": "בשניהם אין כל הבדל בין אב לתולדה", "correct": false}, {"text": "בשניהם קיימת חלוקה לאבות ותולדות", "correct": true}, {"text": "בשניהם התולדה חמורה יותר מהאב", "correct": false}], "extra": {}}]}, "umai-ika": {"title": "ומאי איכא בין אב לתולדה", "titleText": "ומאי איכא בין אב לתולדה", "blocks": [{"bid": "b1", "type": "box"}, {"bid": "b2", "type": "paragraphs", "items": [{"text": "אדם שעשה מלאכה אסורה בשבת: בשוגג, חייב חטאת ובמזיד, אם לא היו עדים והתראה, נענש במיתה בידי שמים ואם היו עדים והתראה, נענש בסקילה.", "cls": "p-strong"}]}, {"bid": "b3", "type": "heading", "tag": "h3", "cls": "", "text": "מזיד"}, {"bid": "b4", "type": "paragraphs", "items": [{"text": "עבר במזיד על איסורי שבת הרבה פעמים ח\"ו, תמיד הוא יכול לקבל רק עונש אחד, כי הרי אי אפשר לקבל סקילה, או מיתה בידי שמים כמה פעמים.", "cls": "p-strong"}]}, {"bid": "b5", "type": "quiz", "qid": "q29", "question": "אדם שעבר במזיד על איסורי שבת פעמים רבות - כמה עונשים הוא יכול לקבל?", "choices": [{"text": "עונש נפרד על כל פעם שעבר", "correct": false}, {"text": "עונש אחד בלבד בסך הכול", "correct": true}, {"text": "הוא פטור מעונש", "correct": false}], "extra": {}}, {"bid": "b6", "type": "heading", "tag": "h3", "cls": "", "text": "עבירה אחת"}, {"bid": "b7", "type": "paragraphs", "items": [{"text": "אדם שעובר עבירה בשוגג, עושה אותה מחוסר ידע, אם היה יודע שזה אסור, הוא לא היה עושה אותה. אפילו אם הוא עשה אותה הרבה פעמים, כל המעשים האלו מגיעים מטעות אחת, המחשבה שזה מותר. לכן הוא לא פושע גדול יותר מאדם שעשה אותה בשוגג פעם אחת, כי חשב שזה מותר.", "cls": "p-strong"}]}, {"bid": "b8", "type": "quiz", "qid": "q30", "question": "עבר בשוגג על איסור מסוים פעמים רבות, נחשב פושע יותר ממי שעבר עליו פעם אחת?", "choices": [{"text": "כן, כי כל שגגה נחשבת עברה נפרדת", "correct": false}, {"text": "לא, כי כל המעשים נובעים מטעות אחת שהדבר מותר", "correct": true}, {"text": "לא, כי שגגה אינה נחשבת עברה כלל", "correct": false}], "extra": {}}, {"bid": "b9", "type": "heading", "tag": "h3", "cls": "", "text": "קרבן חטאת"}, {"bid": "b10", "type": "paragraphs", "items": [{"text": "לפני 200 שנה מלך רוסיה, הצאר ניקולאי, החליט לקחת בכוח ילדים יהודיים ולגייס אותם לצבא הרוסי, שם הם יקבלו בכוח חינוך לא יהודי. החיילים האלו היו נקראים \"קנטוניסים\". במשך השנים גויסו בכפייה 70,000 ילדים בגיל 12 וגם פחות מכך, לשירות של 31 שנים.", "cls": "p-light"}, {"text": "היו שם הרבה מאוד סיפורים מרגשים על חיילים שהמשיכו לשמור מצוות במסירות נפש. בסיום השירות הצבאי, הם קיבלו אישור להתיישב באזורים שבהם הם שירתו המון שנים. כך קמו קהילות קטנות של קנטוניסטים, בפינלנד, בסיביר ובעוד מקומות נידחים.", "cls": "p-light"}, {"text": "היהודים האלו היו בעלי רגש חם מאוד ליהדות, אמונה תמימה ומסירות נפש, אבל אחרי שנים רבות כל כך בין הגויים, הם לא הכירו את כל הפרטים הנדרשים לקיום מצוות כהלכתם.", "cls": "p-light"}, {"text": "אדם לא ידע שבשבת אסור להוציא מהסלט רק את הירק שהוא לא אוהב ועשה את זה בשוגג כל שבת במשך שנים רבות, האם בזמן שבית המקדש ייבנה הוא יצטרך להביא מאות קורבנות חטאת?", "cls": "p-strong"}, {"text": "עבר רק על אבות, או רק על תולדות: יצטרך להביא קרבן חטאת אחת על כל סוג של אב או תולדה שעבר, כי אפילו שעבר על בורר הרבה פעמים, הכול נובע מטעות אחת שזה מותר.", "cls": "p-strong"}, {"text": "עבר על אב ותולדה שלו: כמו כותב ומצייר, מחלוקת: לפי תנא קמא: אב ותולדה זה אותה מלאכה, כמו אדם שעבר על אותו אב כמה פעמים ולכן מספיק קרבן חטאת אחד על שניהם ולפי רבי אליעזר: אב ותולדה אלו מלאכות שונות, כמו אדם שעבר על כמה אבות שונים ולכן חייב חטאת אחת על האב וחטאת נוספת על התולדה.", "cls": "p-strong"}, {"text": "לפי תנא קמא: יש רווח גדול מכך שמצייר הוא תולדה של כותב ולא עוד אב מלאכה, כך חייב רק חטאת אחת.", "cls": "p-strong"}, {"text": "לפי רבי אליעזר: אין רווח מכך שמצייר הוא תולדה של כותב, כי הוא כמו עוד אב מלאכה וחייב עוד חטאת.", "cls": "p-strong"}]}, {"bid": "b11", "type": "quiz", "qid": "q31", "question": "אדם שעבר בשוגג כמה פעמים רק על \"אבות\" מלאכה - כמה קרבנות חטאת עליו להביא?", "choices": [{"text": "קרבן נפרד על כל פעם שעבר", "correct": false}, {"text": "קרבן חטאת אחד על כל סוג של אב שעבר עליו", "correct": true}, {"text": "אינו חייב קרבן כלל", "correct": false}], "extra": {}}, {"bid": "b12", "type": "quiz", "qid": "q32", "question": "לפי רבי אליעזר, אדם שעבר על אב ועל התולדה שלו (כגון כותב ומצייר) חייב:", "choices": [{"text": "קרבן חטאת אחד בלבד", "correct": false}, {"text": "שני קרבנות חטאת - אחד על האב ואחד על התולדה", "correct": true}, {"text": "פטור לגמרי מקרבן", "correct": false}], "extra": {}}, {"bid": "b13", "type": "heading", "tag": "h3", "cls": "", "text": "העלם אחד"}, {"bid": "b14", "type": "paragraphs", "items": [{"text": "אדם שמר מצוות לאורך שנים רבות, אבל הוא לא ידע שאסור להוציא מהסלט רק את הירק שהוא לא אוהב, רק אחרי שנים התברר לו ומאז הוא זוכר ומקפיד על זה.", "cls": "p-strong"}, {"text": "המידע הזה נעלם ממנו פעם אחת בלבד, כי אחרי שנודע לו הוא כבר זוכר את זה תמיד. בלשון הגמרא זה נקרא \"העלם אחד\" – כי המידע הזה נעלם ממנו רק פעם אחת. אבל אם שכח שוב פעם את האיסור הזה, המידע הזה כבר נעלם ממנו פעמיים, פעם אחת לפני שהוא למד אותו ופעם שניה אחרי שהוא למד אותו.", "cls": "p-strong"}]}, {"bid": "b15", "type": "quiz", "qid": "q33", "question": "מהו \"העלם אחד\"?", "choices": [{"text": "מצב שבו אדם עבר על איסור פעמיים בשוגג", "correct": false}, {"text": "מצב שבו המידע על האיסור נעלם מהאדם פעם אחת בלבד, עד שנודע לו", "correct": true}, {"text": "מצב שבו אדם ידע את האיסור אך התעלם ממנו", "correct": false}], "extra": {}}, {"bid": "b16", "type": "heading", "tag": "h3", "cls": "", "text": "משמעות"}, {"bid": "b17", "type": "paragraphs", "items": [{"text": "מה המשמעות לכך שמלאכה אחת נקראת בשם אב ומלאכה אחרת נקראת בשם תולדה של האב הזה, מדוע לא לקרוא להם באותו שם, מלאכות שאסורות בשבת?", "cls": "p-strong"}, {"text": "לפי תנא קמא: יש משמעות הלכתית, כי אם עבר על אב ותולדה שלו מביא רק חטאת אחת.", "cls": "p-strong"}, {"text": "לפי רבי אליעזר: אין משמעות הלכתית, ונקרא אב רק בגלל שהיה מלאכה חשובה במשכן.", "cls": "p-strong"}]}, {"bid": "b18", "type": "quiz", "qid": "q34", "question": "לפי תנא קמא, מהי המשמעות ההלכתית לכך שמלאכה אחת נקראת \"אב\" ואחרת \"תולדה\"?", "choices": [{"text": "אין לכך כל משמעות הלכתית", "correct": false}, {"text": "יש לכך משמעות - העובר על אב ועל התולדה שלו מביא רק קרבן חטאת אחד", "correct": true}, {"text": "המשמעות היא שהתולדה חמורה מהאב", "correct": false}], "extra": {}}]}, "gabei-tumaot-tanan": {"title": "גבי טומאות תנן", "titleText": "גבי טומאות תנן", "blocks": [{"bid": "b1", "type": "box"}, {"bid": "b2", "type": "heading", "tag": "h3", "cls": "", "text": "שמונה שרצים"}, {"bid": "b3", "type": "raw", "html": "<ul class=\"glossary-list\">\n<li>\"חלד\": סמור.</li>\n<li>\"עכבר\":</li>\n<li>\"צב\": קרפדה.</li>\n<li>\"אנקה\": קיפוד.</li>\n<li>\"כח\":</li>\n<li>\"לטאה\":</li>\n<li>\"חמט\": חלזון.</li>\n<li>\"תנשמת\": חפרפרת.</li>\n</ul>"}, {"bid": "b4", "type": "heading", "tag": "h3", "cls": "", "text": "טומאה וטהרה"}, {"bid": "b5", "type": "paragraphs", "items": [{"text": "אדם טמא, אסור להיכנס לבית המקדש ולאכול תרומה ומהקורבנות של בית המקדש.", "cls": "p-strong"}]}, {"bid": "b6", "type": "quiz", "qid": "q35", "question": "מה אסור לאדם טמא:", "choices": [{"text": "לאכול כל מאכל שהוא", "correct": false}, {"text": "להיכנס לבית המקדש ולאכול תרומה וקורבנות", "correct": true}, {"text": "לצאת מביתו", "correct": false}], "extra": {}}, {"bid": "b7", "type": "heading", "tag": "h3", "cls": "", "text": "מקור הטומאה"}, {"bid": "b8", "type": "paragraphs", "items": [{"text": "כמה מהם:", "cls": "p-strong"}, {"text": "אדם מת: יהודי, או גוי.", "cls": "p-strong"}, {"text": "שרץ: אחד מ8 שרצים שמתו: \"וְזֶה לָכֶם הַטָּמֵא בַּשֶּׁרֶץ הַשֹּׁרֵץ עַל־הָאָרֶץ הַחֹלֶד וְהָעַכְבָּר וְהַצָּב לְמִינֵהוּ וְהָאֲנָקָה וְהַכֹּחַ וְהַלְּטָאָה וְהַחֹמֶט וְהַתִּנְשָׁמֶת\".", "cls": "p-strong"}]}, {"bid": "b9", "type": "quiz", "qid": "q36", "question": "איזה אדם מטמא?", "choices": [{"text": "רק יהודי שמת", "correct": false}, {"text": "יהודי או גוי שמתו", "correct": true}, {"text": "רק גוי שמת", "correct": false}], "extra": {}}, {"bid": "b10", "type": "heading", "tag": "h3", "cls": "", "text": "מקבלים טומאה"}, {"bid": "b11", "type": "paragraphs", "items": [{"text": "אדם: יהודי.", "cls": "p-strong"}, {"text": "כלים: אחרי שבני ישראל עלו לרגל, הכוהנים היו מטהרים את כלי המקדש, מחשש שנגע בהם אדם טמא.", "cls": "p-light"}, {"text": "כל הכלים מקבלים טומאה, חוץ מכלי אבן.", "cls": "p-strong"}, {"text": "אוכל: בחפירות בעיר העתיקה בירושלים, מצאו כלי אוכל שעשויים מאבן. בזמן שבית המקדש היה קיים אנשים נזהרו מאוד מטומאה ולכן אכלו בכלים שלא מטמאים את האוכל.", "cls": "p-light"}, {"text": "אוכל מקבל טומאה רק אם נשטף במים. בליל הסדר אנחנו טובלים את הכרפס במי מלח. זאת הסיבה שלפני זה נוטלים ידיים, לטהר אותם שלא יטמאו את האוכל הרטוב.", "cls": "p-light"}, {"text": "משקה: שבעה סוגים של משקים, ראשי תיבות: י\"ד שח\"ט ד\"ם: יין, דבש דבורים, שמן, חלב, טל, דם ומים.", "cls": "p-strong"}]}, {"bid": "b12", "type": "quiz", "qid": "q37", "question": "מאילו חומרים עשויים \"כלים\" שמקבלים טומאה?", "choices": [{"text": "אבן וזכוכית", "correct": false}, {"text": "בגדים, עץ, עור, חרס ומתכת", "correct": true}, {"text": "זהב וכסף בלבד", "correct": false}], "extra": {}}, {"bid": "b13", "type": "quiz", "qid": "q38", "question": "איזה \"אדם\" מקבל טומאה?", "choices": [{"text": "יהודי", "correct": true}, {"text": "גבר בלבד", "correct": false}, {"text": "רק כהן", "correct": false}], "extra": {}}, {"bid": "b14", "type": "heading", "tag": "h3", "cls": "", "text": "אבות ותולדות הטומאה"}, {"bid": "b15", "type": "paragraphs", "items": [{"text": "בשנת תש״פ התפרצה לחיינו מגיפת הקורונה. לפחות 18 מיליון בני אדם מתו ממנה. זה היה וירוס שיוצר במעבדה בסין ומשם נדבקו ממנו בכל העולם.", "cls": "p-strong"}, {"text": "הוירוס הוא אב המחלה - המקור שלה והדורות הבאים הם התולדות שהגיעו ממנה.", "cls": "p-strong"}, {"text": "כך גם בדיני הטומאה: אב הטומאה: הוא האדם המת והשרץ שהם המקור של הטומאה. תולדות הטומאה: הם אדם חי וכלים שהיו טהורים ונטמאו.", "cls": "p-strong"}]}, {"bid": "b16", "type": "heading", "tag": "h3", "cls": "", "text": "מטמאים"}, {"bid": "b17", "type": "paragraphs", "items": [{"text": "כמו וירוס הקורונה שמדביק אחרים, אדם מת ושרץ מטמאים וגם דברים שנטמאו מתחילים לטמא אחרים.", "cls": "p-strong"}]}, {"bid": "b18", "type": "heading", "tag": "h3", "cls": "", "text": "שרשרת הדורות"}, {"bid": "b19", "type": "paragraphs", "items": [{"text": "וירוס הקורונה יוצר במעבדה בסין. חוקר מקומי נדבק שם, הוא הלך לחנות והדביק את כל הקונים. אחד מהם עלה לאוטובוס, הדביק את כולו ובין השאר גם אדם שהיה בדרך לשדה התעופה. שם הוא הדביק אנשים שטסו למדינות שונות. משם המשיכה שרשרת ההדבקה למיליארדי אנשים בכל העולם.", "cls": "p-strong"}, {"text": "שימו לב לשרשרת ההתפשטות של המחלה. כל אחד שנדבק, מדביק את הבא אחריו:", "cls": "p-strong"}, {"text": "הווירוס - המקור של המחלה.", "cls": "p-strong"}, {"text": "החוקר – במעבדה, נדבק מהווירוס. הראשון בשרשרת ההדבקה.", "cls": "p-strong"}, {"text": "הקונה - בחנות בסין, נדבק מהחוקר. השני בשרשרת ההדבקה.", "cls": "p-strong"}, {"text": "הנוסע - בטיסה נדבק מהמוכר. השלישי בשרשרת ההדבקה.", "cls": "p-strong"}, {"text": "כך גם בדיני טומאה:", "cls": "p-strong"}, {"text": "אדם נפטר בשיבה טובה בבית רפואה ונלקח לקבורה. הגיע חולה אחר לבית הרפואה, שכב במיטה שלו, הבריא, חזר הביתה והלך לאכול.", "cls": "p-strong"}, {"text": "המת והמיטה – אב הטומאה.", "cls": "p-strong"}, {"text": "החולה – הראשון בשרשרת ההדבקה.", "cls": "p-strong"}, {"text": "הכלי – השני בשרשרת ההדבקה.", "cls": "p-strong"}, {"text": "כל דבר שהיה טהור וקיבל טומאה, כמו אדם, כלים ואוכל, נגע בדבר טמא, הוא נהיה דור נוסף / בדרגה אחת פחות מהדבר הטמא. לדוגמה: אם נטמא מראשון לטומאה, הם טמאים והופכים להיות שניים לטומאה וכך הלאה.", "cls": "p-strong"}]}, {"bid": "b20", "type": "quiz", "qid": "q39", "question": "מה קורה לדבר טהור לאחר שהוא נטמא?", "choices": [{"text": "נשאר טהור לגמרי", "correct": false}, {"text": "מתחיל גם הוא לטמא אחרים", "correct": true}, {"text": "הוא נעלם ואינו קיים יותר", "correct": false}], "extra": {}}, {"bid": "b21", "type": "heading", "tag": "h3", "cls": "", "text": "ירידת הדורות"}, {"bid": "b22", "type": "paragraphs", "items": [{"text": "הוירוס הראשון היה הכי חזק וקשה, אבל ככל שהוא עובר מאדם לאדם הוא נחלש.", "cls": "p-strong"}, {"text": "בהתחלה הוא היה חזק ופגע אפילו בצעירים, בריאים וחזקים ואחר כך רק בחלשים וחולים.", "cls": "p-strong"}, {"text": "היום יש אנשים שחולים בקורונה והם אפילו לא יודעים.", "cls": "p-strong"}, {"text": "מחלה חזקה פוגעת גם בחזקים, מחלה חלשה פוגעת רק בחלשים. ככל שהמחלה עוברת מאדם לאדם היא נחלשת.", "cls": "p-strong"}, {"text": "ככל שהטומאה היא בדור רחוק יותר מאב הטומאה היא בדרגה נמוכה יותר ומטמאת פחות דברים.", "cls": "p-strong"}, {"text": "ככל שהטומאה בדרגה נמוכה יותר, היא מטמאת פחות דברים.", "cls": "p-strong"}]}, {"bid": "b23", "type": "raw", "html": "<div class=\"table-scroll\">\n<table class=\"data-table\">\n<thead>\n<tr>\n<th></th>\n<th>אדם וכלים</th>\n<th>אוכל ומשקה</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>אבות הטומאה</td>\n<td>✓</td>\n<td rowspan=\"2\">✓</td>\n</tr>\n<tr>\n<td>ראשון לטומאה</td>\n<td></td>\n</tr>\n</tbody>\n</table>\n</div>"}, {"bid": "b24", "type": "quiz", "qid": "q40", "question": "דבר טהור שנגע ב\"ראשון לטומאה\" הופך להיות:", "choices": [{"text": "אב הטומאה", "correct": false}, {"text": "שני לטומאה", "correct": true}, {"text": "טהור לגמרי", "correct": false}], "extra": {}}, {"bid": "b25", "type": "quiz", "qid": "q41", "question": "ככל שדרגת הטומאה נמוכה יותר:", "choices": [{"text": "היא מטמאת פחות דברים", "correct": true}, {"text": "היא מטמאת יותר דברים", "correct": false}, {"text": "אין לדרגה כל השפעה על הטומאה", "correct": false}], "extra": {}}, {"bid": "b26", "type": "heading", "tag": "h3", "cls": "", "text": "אבות ותולדות"}, {"bid": "b27", "type": "paragraphs", "items": [{"text": "בדיני טומאה וטהרה יש אבות ותולדות. הדבר המטמא הוא אב והדבר שנטמא הוא תולדה של הטומאה. לתולדה יש דין שונה מהאב שלו. כי אב מטמא גם אדם וכלים ותולדה לא מטמא אדם וכלים.", "cls": "p-strong"}]}, {"bid": "b28", "type": "quiz", "qid": "q42", "question": "מה ההבדל בין \"אב\" הטומאה ל\"תולדה\" שלו?", "choices": [{"text": "אין כל הבדל ביניהם", "correct": false}, {"text": "אב מטמא גם אדם וכלים ותולדה לא", "correct": true}, {"text": "תולדה מטמאת אדם וכלים, ואב לא", "correct": false}], "extra": {}}]}};

    (function () {
      var overrides = {};       // lessonId -> raw Firestore doc data ({} if none loaded)
      var workingSections = {}; // lessonId -> live editable blocks array (lazy-built)
      var touched = {};         // lessonId -> has a saved/local sections override
      LESSON_ORDER.forEach(function (lid) {
        overrides[lid] = {};
        workingSections[lid] = null;
        touched[lid] = false;
      });

      var currentLesson = LESSON_ORDER[0];
      var authGateEl = document.getElementById("auth-gate");
      var adminMainEl = document.getElementById("admin-main");
      var tabsEl = document.getElementById("tabs");
      var contentEl = document.getElementById("content");
      var dirtyCountEl = document.getElementById("dirty-count");
      var saveStatusEl = document.getElementById("save-status");
      var btnLogout = document.getElementById("btn-logout");
      var btnResetLesson = document.getElementById("btn-reset-lesson");
      var saveTimer = null;
      var bidSeq = 0;

      function newBid() {
        bidSeq++;
        return "n" + Date.now() + "_" + bidSeq;
      }

      function cloneBlocks(blocks) {
        return JSON.parse(JSON.stringify(blocks));
      }

      function getSections(lid) {
        if (!workingSections[lid]) {
          var ov = overrides[lid];
          if (Array.isArray(ov.sections)) {
            workingSections[lid] = cloneBlocks(ov.sections);
            touched[lid] = true;
          } else {
            workingSections[lid] = cloneBlocks(LESSONS[lid].blocks);
          }
        }
        return workingSections[lid];
      }

      function titleKey(lid) { return lid + ":0"; }

      function currentTitleText(lid) {
        var key = titleKey(lid);
        return Object.prototype.hasOwnProperty.call(overrides[lid], key) ? overrides[lid][key] : LESSONS[lid].titleText;
      }

      function isTitleDirty(lid) {
        var key = titleKey(lid);
        return Object.prototype.hasOwnProperty.call(overrides[lid], key) && overrides[lid][key] !== LESSONS[lid].titleText;
      }

      function lessonIsDirty(lid) {
        return touched[lid] || isTitleDirty(lid);
      }

      function setStatus(state, label) {
        saveStatusEl.className = "save-status" + (state ? " status-" + state : "");
        saveStatusEl.textContent = label || "";
      }

      function scheduleSave(lid) {
        touched[lid] = true;
        clearTimeout(saveTimer);
        setStatus(null, "");
        saveTimer = setTimeout(function () { saveLesson(lid); }, 600);
        renderTabs();
      }

      function saveLesson(lid) {
        setStatus("saving", "שומר…");
        var payload = { sections: getSections(lid), updatedAt: new Date().toISOString() };
        setDoc(doc(getDb(), "content", lid), payload, { merge: true })
          .then(function () { setStatus("saved", "נשמר באתר ✓"); })
          .catch(function () { setStatus("error", "שגיאה בשמירה"); });
      }

      function saveTitle(lid, value) {
        setStatus("saving", "שומר…");
        var payload = {};
        payload[titleKey(lid)] = value === LESSONS[lid].titleText ? deleteField() : value;
        payload.updatedAt = new Date().toISOString();
        setDoc(doc(getDb(), "content", lid), payload, { merge: true })
          .then(function () { setStatus("saved", "נשמר באתר ✓"); })
          .catch(function () { setStatus("error", "שגיאה בשמירה"); });
        renderTabs();
      }

      function renderTabs() {
        tabsEl.innerHTML = "";
        LESSON_ORDER.forEach(function (lid) {
          var lesson = LESSONS[lid];
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tab" + (lid === currentLesson ? " active" : "");
          var dot = lessonIsDirty(lid) ? '<span class="dot"></span>' : "";
          btn.innerHTML = lesson.title + dot;
          btn.addEventListener("click", function () {
            currentLesson = lid;
            renderTabs();
            renderContent();
          });
          tabsEl.appendChild(btn);
        });
      }

      function autoGrow(ta) {
        ta.style.height = "auto";
        ta.style.height = ta.scrollHeight + "px";
      }

      // ---- block card renderers ----

      function renderTitleField(lid) {
        var wrap = document.createElement("div");
        wrap.className = "field";
        var labelRow = document.createElement("div");
        labelRow.className = "field-label";
        var badge = document.createElement("span");
        badge.className = "tag-badge";
        badge.textContent = "כותרת ראשית";
        labelRow.appendChild(badge);
        wrap.appendChild(labelRow);

        var input = document.createElement("input");
        input.type = "text";
        input.className = "title-input";
        input.value = currentTitleText(lid);
        input.addEventListener("input", function () {
          overrides[lid][titleKey(lid)] = input.value;
          clearTimeout(saveTimer);
          setStatus(null, "");
          saveTimer = setTimeout(function () { saveTitle(lid, input.value); }, 600);
        });
        wrap.appendChild(input);
        return wrap;
      }

      function blockTopRow(badgeText, lid, index, total, isProtected) {
        var top = document.createElement("div");
        top.className = "block-top";
        var badge = document.createElement("span");
        badge.className = "tag-badge";
        badge.textContent = badgeText;
        top.appendChild(badge);
        return top;
      }

      function appendControls(top, lid, index, total, isProtected) {
        var ctr = document.createElement("div");
        ctr.className = "block-controls";
        var up = document.createElement("button");
        up.type = "button"; up.className = "ctrl-btn"; up.textContent = "\u25b2"; up.title = "הזזה למעלה";
        up.disabled = index === 0;
        up.addEventListener("click", function () { moveBlock(lid, index, -1); });
        var down = document.createElement("button");
        down.type = "button"; down.className = "ctrl-btn"; down.textContent = "\u25bc"; down.title = "הזזה למטה";
        down.disabled = index === total - 1;
        down.addEventListener("click", function () { moveBlock(lid, index, 1); });
        var del = document.createElement("button");
        del.type = "button"; del.className = "ctrl-btn ctrl-del"; del.textContent = "\ud83d\uddd1"; del.title = "מחיקה";
        del.disabled = !!isProtected;
        del.addEventListener("click", function () { deleteBlock(lid, index); });
        ctr.appendChild(up); ctr.appendChild(down); ctr.appendChild(del);
        top.appendChild(ctr);
      }

      function tagLabelHeading(tag) {
        if (tag === "h2") return "כותרת קטע";
        return "כותרת משנה";
      }

      function renderHeadingBlock(lid, block, index, total) {
        var card = document.createElement("div");
        card.className = "block-card";
        var top = blockTopRow(tagLabelHeading(block.tag), lid, index, total);
        var levelSel = document.createElement("select");
        levelSel.className = "level-select";
        [["h2", "כותרת קטע (גדולה)"], ["h3", "כותרת משנה"]].forEach(function (pair) {
          var o = document.createElement("option");
          o.value = pair[0]; o.textContent = pair[1];
          if (pair[0] === block.tag) o.selected = true;
          levelSel.appendChild(o);
        });
        levelSel.addEventListener("change", function () {
          block.tag = levelSel.value;
          top.querySelector(".tag-badge").textContent = tagLabelHeading(block.tag);
          scheduleSave(lid);
        });
        top.insertBefore(levelSel, top.lastChild);
        appendControls(top, lid, index, total, false);
        card.appendChild(top);

        var input = document.createElement("input");
        input.type = "text";
        input.className = "heading-input";
        input.value = block.text;
        input.addEventListener("input", function () {
          block.text = input.value;
          scheduleSave(lid);
        });
        card.appendChild(input);
        return card;
      }

      var STYLE_OPTIONS = [["", "רגיל"], ["p-light", "רקע (בהיר)"], ["p-strong", "מודגש"]];

      function buildStyleSelect(selectedCls) {
        var select = document.createElement("select");
        STYLE_OPTIONS.forEach(function (pair) {
          var opt = document.createElement("option");
          opt.value = pair[0];
          opt.textContent = pair[1];
          if (pair[0] === (selectedCls || "")) opt.selected = true;
          select.appendChild(opt);
        });
        return select;
      }

      function renderParagraphsBlock(lid, block, index, total) {
        var card = document.createElement("div");
        card.className = "block-card";
        var top = blockTopRow("טקסט (" + block.items.length + " פסקאות)", lid, index, total);
        appendControls(top, lid, index, total, false);
        card.appendChild(top);

        var control = document.createElement("textarea");
        control.className = "p-textarea";
        control.rows = 1;
        control.value = block.items.map(function (p) { return p.text; }).join("\n");

        var stylesEl = document.createElement("div");
        stylesEl.className = "cg-styles";

        function renderStyleRows() {
          stylesEl.innerHTML = "";
          block.items.forEach(function (p, idx) {
            var row = document.createElement("div");
            row.className = "cg-style-row";
            var label = document.createElement("span");
            label.textContent = "פסקה " + (idx + 1);
            var select = buildStyleSelect(p.cls);
            select.addEventListener("change", function () {
              block.items[idx].cls = select.value;
              scheduleSave(lid);
            });
            row.appendChild(label);
            row.appendChild(select);
            stylesEl.appendChild(row);
          });
        }

        control.addEventListener("input", function () {
          autoGrow(control);
          var lines = control.value.split("\n");
          var prevItems = block.items;
          block.items = lines.map(function (text, idx) {
            var cls = idx < prevItems.length ? prevItems[idx].cls : (prevItems.length ? prevItems[prevItems.length - 1].cls : "");
            return { text: text, cls: cls };
          });
          top.querySelector(".tag-badge").textContent = "טקסט (" + block.items.length + " פסקאות)";
          renderStyleRows();
          scheduleSave(lid);
        });

        renderStyleRows();
        card.appendChild(control);
        card.appendChild(stylesEl);
        requestAnimationFrame(function () { autoGrow(control); });
        return card;
      }

      function renderQuizBlock(lid, block, index, total) {
        var card = document.createElement("div");
        card.className = "block-card";
        var top = blockTopRow("שאלת תרגול", lid, index, total);
        appendControls(top, lid, index, total, false);
        card.appendChild(top);

        var qInput = document.createElement("input");
        qInput.type = "text";
        qInput.className = "quiz-q-input";
        qInput.value = block.question;
        qInput.addEventListener("input", function () {
          block.question = qInput.value;
          scheduleSave(lid);
        });
        card.appendChild(qInput);

        var radioName = "correct-" + block.bid;
        block.choices.forEach(function (choice, cIdx) {
          var row = document.createElement("div");
          row.className = "quiz-choice-row";
          var radio = document.createElement("input");
          radio.type = "radio";
          radio.name = radioName;
          radio.checked = !!choice.correct;
          radio.addEventListener("change", function () {
            block.choices.forEach(function (c, i) { c.correct = i === cIdx; });
            scheduleSave(lid);
          });
          var text = document.createElement("input");
          text.type = "text";
          text.value = choice.text;
          text.addEventListener("input", function () {
            choice.text = text.value;
            scheduleSave(lid);
          });
          row.appendChild(radio);
          row.appendChild(text);
          card.appendChild(row);
        });
        return card;
      }

      function stripTags(html) {
        var div = document.createElement("div");
        div.innerHTML = html;
        var text = div.textContent.replace(/\s+/g, " ").trim();
        return text.length > 140 ? text.slice(0, 140) + "…" : text;
      }

      function renderRawBlock(lid, block, index, total) {
        var card = document.createElement("div");
        card.className = "block-card";
        var top = blockTopRow("תוכן מיוחד (רשימה / טבלה / דוגמה) - לא ניתן לעריכה כאן", lid, index, total);
        appendControls(top, lid, index, total, false);
        card.appendChild(top);
        var preview = document.createElement("div");
        preview.className = "raw-preview";
        var text = stripTags(block.html);
        preview.textContent = text || "(תוכן חזותי, ללא טקסט)";
        card.appendChild(preview);
        return card;
      }

      function renderBoxBlock(lid, block, index, total) {
        var row = document.createElement("div");
        row.className = "box-divider";
        var label = document.createElement("span");
        label.textContent = "\u2726 קלף חדש מתחיל כאן";
        row.appendChild(label);
        appendControls(row, lid, index, total, index === 0);
        return row;
      }

      function defaultBlockFor(type) {
        if (type === "heading") return { bid: newBid(), type: "heading", tag: "h3", cls: "", text: "כותרת חדשה" };
        if (type === "paragraphs") return { bid: newBid(), type: "paragraphs", items: [{ text: "טקסט חדש", cls: "p-strong" }] };
        if (type === "quiz") return {
          bid: newBid(), type: "quiz", qid: "custom-" + newBid(), question: "שאלה חדשה",
          choices: [{ text: "תשובה נכונה", correct: true }, { text: "תשובה שגויה", correct: false }, { text: "תשובה שגויה", correct: false }]
        };
        return { bid: newBid(), type: "box" };
      }

      function insertBlock(lid, index, type) {
        var arr = getSections(lid);
        var insertAt = index;
        if (insertAt === 0 && arr.length && arr[0].type === "box" && type !== "box") insertAt = 1;
        arr.splice(insertAt, 0, defaultBlockFor(type));
        scheduleSave(lid);
        renderContent();
      }

      function moveBlock(lid, index, dir) {
        var arr = getSections(lid);
        var newIndex = index + dir;
        if (newIndex < 0 || newIndex >= arr.length) return;
        var tmp = arr[index];
        arr[index] = arr[newIndex];
        arr[newIndex] = tmp;
        scheduleSave(lid);
        renderContent();
      }

      function deleteBlock(lid, index) {
        var arr = getSections(lid);
        if (arr[index].type === "box" && index === 0) return;
        if (!window.confirm("למחוק את הקטע הזה?")) return;
        arr.splice(index, 1);
        if (arr.length && arr[0].type !== "box") arr.unshift({ bid: newBid(), type: "box" });
        scheduleSave(lid);
        renderContent();
      }

      function renderAddRow(lid, index) {
        var row = document.createElement("div");
        row.className = "add-row";
        var toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "add-toggle";
        toggle.textContent = "+ הוספת קטע";
        var menu = document.createElement("div");
        menu.className = "add-menu";
        menu.hidden = true;
        [["heading", "כותרת"], ["paragraphs", "פסקה"], ["quiz", "שאלת תרגול"], ["box", "קלף חדש"]].forEach(function (pair) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "btn";
          b.textContent = pair[1];
          b.addEventListener("click", function () { insertBlock(lid, index, pair[0]); });
          menu.appendChild(b);
        });
        toggle.addEventListener("click", function () { menu.hidden = !menu.hidden; });
        row.appendChild(toggle);
        row.appendChild(menu);
        return row;
      }

      function renderContent() {
        contentEl.innerHTML = "";
        contentEl.appendChild(renderTitleField(currentLesson));

        var arr = getSections(currentLesson);
        contentEl.appendChild(renderAddRow(currentLesson, 0));
        arr.forEach(function (block, index) {
          var card;
          if (block.type === "heading") card = renderHeadingBlock(currentLesson, block, index, arr.length);
          else if (block.type === "paragraphs") card = renderParagraphsBlock(currentLesson, block, index, arr.length);
          else if (block.type === "quiz") card = renderQuizBlock(currentLesson, block, index, arr.length);
          else if (block.type === "raw") card = renderRawBlock(currentLesson, block, index, arr.length);
          else if (block.type === "box") card = renderBoxBlock(currentLesson, block, index, arr.length);
          if (card) contentEl.appendChild(card);
          contentEl.appendChild(renderAddRow(currentLesson, index + 1));
        });
      }

      function loadOverrides() {
        var loads = LESSON_ORDER.map(function (lid) {
          return getDoc(doc(getDb(), "content", lid)).then(function (snap) {
            if (!snap.exists()) return;
            overrides[lid] = snap.data();
          }).catch(function () { /* best effort */ });
        });
        return Promise.all(loads);
      }

      btnLogout.addEventListener("click", function () {
        logoutUser();
      });

      btnResetLesson.addEventListener("click", function () {
        if (!window.confirm("לאפס את כל השיעור הזה לגרסה המקורית? השינויים שנשמרו יימחקו.")) return;
        var lid = currentLesson;
        clearTimeout(saveTimer);
        setStatus("saving", "מאפס…");
        var payload = {};
        payload.sections = deleteField();
        payload[titleKey(lid)] = deleteField();
        payload.updatedAt = new Date().toISOString();
        setDoc(doc(getDb(), "content", lid), payload, { merge: true })
          .then(function () {
            overrides[lid] = {};
            workingSections[lid] = null;
            touched[lid] = false;
            setStatus("saved", "אופס ✓");
            renderTabs();
            renderContent();
          })
          .catch(function () { setStatus("error", "שגיאה באיפוס"); });
      });

      if (isReady()) {
        watchAuthState(function (user) {
          if (user) {
            authGateEl.hidden = true;
            adminMainEl.hidden = false;
            dirtyCountEl.textContent = user.displayName ? "מחובר/ת: " + user.displayName : "מחובר/ת";
            loadOverrides().then(function () {
              renderTabs();
              renderContent();
            });
          } else {
            authGateEl.hidden = false;
            adminMainEl.hidden = true;
          }
        });
      }
    })();
  </script>
</body>
</html>
