<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>פאנל עריכת תוכן | ארבעה אבות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css?v=41" />
  <style>
    .admin-wrap { max-width: 780px; margin: 0 auto; padding: 28px 20px 60px; }
    .admin-wrap h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
    }
    .toolbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn {
      font-family: inherit;
      font-size: .86rem;
      font-weight: 600;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .btn:hover { border-color: var(--accent); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .9; }
    .btn:disabled { opacity: .4; cursor: default; }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-strong); margin-inline-start: 6px; vertical-align: middle; }
    .dot-error { background: #b23b3b; }
    .lesson-select { position: relative; display: inline-block; margin-bottom: 14px; }
    .lesson-select-trigger {
      display: flex; align-items: center; gap: 4px;
      font-family: inherit; font-size: .92rem; font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      max-width: 100%;
    }
    .lesson-select-trigger:hover { border-color: var(--accent); }
    .lesson-select-trigger span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lesson-select-trigger .submenu-arrow { width: 16px; height: 16px; flex: none; margin-inline-start: 4px; }
    .lesson-select:has(.lesson-select-menu:not([hidden])) .lesson-select-trigger .submenu-arrow { transform: rotate(180deg); }
    .lesson-select-menu { min-width: 260px; }
    .lesson-order-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; }
    .lesson-order-controls .order-label { font-size: .86rem; color: var(--ink-soft); }
    .lesson-order-controls .order-status { font-size: .82rem; color: var(--ink-soft); }
    #btn-new-lesson { margin-bottom: 22px; }
    .new-lesson-form {
      background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
      padding: 16px; margin-bottom: 22px; max-width: 420px;
    }
    .new-lesson-form .field { margin-bottom: 14px; }
    .new-lesson-form label { display: block; font-size: .82rem; color: var(--ink-soft); margin-bottom: 5px; }
    #new-lesson-id { direction: ltr; text-align: left; }
    #new-lesson-after {
      width: 100%; font-family: inherit; font-size: .92rem; color: var(--ink);
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
      padding: 9px 12px; direction: rtl;
    }
    .new-lesson-actions { display: flex; gap: 8px; }
    .new-lesson-status { margin: 10px 0 0; font-size: .85rem; }
    .new-lesson-status.status-error { color: #b23b3b; }
    .new-lesson-status.status-saved { color: #3a7d44; }
    .save-status {
      font-size: .78rem;
      color: var(--ink-soft);
      min-width: 76px;
    }
    .save-status.status-saving { color: var(--ink-soft); }
    .save-status.status-saved { color: #3a7d44; }
    .save-status.status-error { color: #b23b3b; }
    #auth-gate {
      background: var(--accent-soft);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }
    #auth-gate p { margin: 0 0 12px; font-size: .95rem; }
    #auth-gate .btn { display: inline-block; text-decoration: none; }

    .field { margin-bottom: 20px; }
    .field-label { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .tag-badge {
      font-size: .7rem; font-weight: 700; letter-spacing: .03em;
      color: var(--accent-strong); background: var(--accent-soft);
      border-radius: 999px; padding: 2px 9px; white-space: nowrap;
    }
    .field input[type="text"] {
      width: 100%; font-family: inherit; color: var(--ink);
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 12px;
      direction: rtl; text-align: right;
    }
    .field input[type="text"]:focus { outline: none; border-color: var(--accent); }
    .title-input { font-family: "Frank Ruhl Libre", "David Libre", serif; font-weight: 700; font-size: 1.3rem; }

    .block-card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; background: var(--surface); }
    .block-top { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .block-controls { display: flex; gap: 4px; margin-inline-start: auto; }
    .ctrl-btn {
      font-size: .82rem; width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer;
    }
    .ctrl-btn:hover { border-color: var(--accent); }
    .ctrl-btn:disabled { opacity: .3; cursor: default; }
    .ctrl-del { color: #b23b3b; }
    .level-select {
      font-family: inherit; font-size: .78rem; border: 1px solid var(--line); border-radius: 6px;
      padding: 3px 8px; background: var(--surface); color: var(--ink); cursor: pointer;
    }
    .heading-input {
      width: 100%; font-family: "Frank Ruhl Libre", "David Libre", serif; font-weight: 700; font-size: 1.1rem;
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
      direction: rtl; text-align: right; color: var(--ink); background: var(--surface);
    }
    .p-textarea {
      width: 100%; font-family: inherit; font-size: .98rem; line-height: 1.6;
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: none;
      direction: rtl; text-align: right; color: var(--ink); background: var(--surface);
    }
    .inline-toolbar { display: flex; gap: 6px; margin-bottom: 6px; }
    .inline-btn {
      font-family: inherit; font-size: .78rem; border: 1px solid var(--line); border-radius: 6px;
      padding: 4px 10px; background: var(--bg); color: var(--ink); cursor: pointer;
    }
    .inline-btn:hover { border-color: var(--accent); }
    .inline-btn-bold { font-weight: 700; }
    .inline-btn-content { background: var(--accent-soft); border-color: var(--accent); }
    .quiz-q-input {
      width: 100%; font-weight: 600; font-family: inherit; font-size: .98rem;
      border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
      direction: rtl; text-align: right; color: var(--ink); background: var(--surface);
    }
    .quiz-choice-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .quiz-choice-row input[type="radio"] { flex: none; width: 18px; height: 18px; accent-color: var(--accent); }
    .quiz-choice-row input[type="text"] {
      flex: 1; font-family: inherit; font-size: .92rem;
      border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
      direction: rtl; text-align: right; color: var(--ink); background: var(--surface);
    }
    .raw-preview {
      font-size: .84rem; color: var(--ink-soft); background: var(--bg);
      border-radius: 8px; padding: 8px 10px; line-height: 1.5;
    }
    .box-divider {
      display: flex; align-items: center; gap: 8px; padding: 8px 4px; margin: 6px 0 14px;
      border-top: 1px dashed var(--accent); font-size: .76rem; color: var(--accent-strong); font-weight: 700;
    }
    .box-divider .block-controls { margin-inline-start: auto; }
    .add-row { display: flex; flex-direction: column; align-items: center; margin: 4px 0 14px; }
    .add-toggle {
      font-size: .78rem; color: var(--accent-strong); background: none;
      border: 1px dashed var(--line); border-radius: 999px; padding: 5px 14px; cursor: pointer;
    }
    .add-toggle:hover { border-color: var(--accent); }
    .add-menu { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }
    .loading-msg { color: var(--ink-soft); font-size: .9rem; padding: 20px 0; text-align: center; }
    [hidden] { display: none !important; }
  </style>
</head>

  <script type="module">
    import { isReady, watchAuthState, logoutUser, getApp } from "./assets/js/auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-functions.js";
    import { parseLessonHtml } from "./assets/js/lesson-parser.js";

    // The lesson order/labels/grouping all come live from index.html (see
    // refreshLessonOrder below) rather than being hardcoded here, so a
    // lesson created or reordered from anywhere (this panel, another admin
    // session) always shows up without a code change.
    var LESSON_ORDER = [];
    var LESSON_LABELS = {};

    (function () {
      var lessonData = {}; // lid -> { titleText, blocks } | null (not loaded yet)
      var saveState = {};  // lid -> "idle" | "pending" | "saving" | "saved" | "error"
      var groupsData = []; // [{ title, lessons: [{id, title}] }] - live from index.html

      var currentLesson = null;
      var authGateEl = document.getElementById("auth-gate");
      var adminMainEl = document.getElementById("admin-main");
      var lessonSelectTrigger = document.getElementById("lesson-select-trigger");
      var lessonSelectLabelEl = document.getElementById("lesson-select-label");
      var lessonSelectDotEl = document.getElementById("lesson-select-dot");
      var lessonSelectMenuEl = document.getElementById("lesson-select-menu");
      var contentEl = document.getElementById("content");
      var saveStatusEl = document.getElementById("save-status");
      var btnLogout = document.getElementById("btn-logout");
      var btnNewLesson = document.getElementById("btn-new-lesson");
      var newLessonFormEl = document.getElementById("new-lesson-form");
      var newLessonIdInput = document.getElementById("new-lesson-id");
      var newLessonTitleInput = document.getElementById("new-lesson-title");
      var newLessonSourceInput = document.getElementById("new-lesson-source");
      var newLessonAfterSelect = document.getElementById("new-lesson-after");
      var btnCreateLesson = document.getElementById("btn-create-lesson");
      var btnCancelNewLesson = document.getElementById("btn-cancel-new-lesson");
      var newLessonStatusEl = document.getElementById("new-lesson-status");
      var btnMoveUp = document.getElementById("btn-move-up");
      var btnMoveDown = document.getElementById("btn-move-down");
      var moveLessonStatusEl = document.getElementById("move-lesson-status");
      var saveTimers = {}; // lid -> pending debounce timer, one per lesson
      var bidSeq = 0;
      var saveFn = null;
      var createLessonFn = null;
      var moveLessonFn = null;

      function newBid() {
        bidSeq++;
        return "n" + Date.now() + "_" + bidSeq;
      }

      function setStatus(state, label) {
        saveStatusEl.className = "save-status" + (state ? " status-" + state : "");
        saveStatusEl.textContent = label || "";
      }

      function scheduleSave(lid) {
        saveState[lid] = "pending";
        clearTimeout(saveTimers[lid]);
        setStatus(null, "");
        renderLessonSelect();
        saveTimers[lid] = setTimeout(function () { doSave(lid); }, 600);
      }

      // If the tab is backgrounded, locked, or closed while a save is still
      // waiting out its debounce, send it immediately instead of losing it -
      // a phone getting locked or an app switch is common enough mid-edit
      // that the 600ms window shouldn't be a chance to drop the change.
      function flushPendingSaves() {
        Object.keys(saveTimers).forEach(function (lid) {
          if (saveState[lid] === "pending") {
            clearTimeout(saveTimers[lid]);
            doSave(lid);
          }
        });
      }
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) flushPendingSaves();
      });
      window.addEventListener("pagehide", flushPendingSaves);

      // Every subheading (h3) belongs to the paragraph text right after it -
      // the content-band CSS already relies on that adjacency, and letting
      // them drift apart in the editor just breaks it. Fold each such pair
      // into one "section" block so the panel only ever offers to move or
      // delete them together; flattenSections() below undoes this right
      // before saving, since the site's HTML (and the Cloud Function that
      // writes it) has no notion of a combined block - just a heading
      // followed by a paragraph.
      function mergeHeadingParagraphPairs(blocks) {
        var out = [];
        for (var i = 0; i < blocks.length; i++) {
          var b = blocks[i], next = blocks[i + 1];
          if (b.type === "heading" && b.tag === "h3" && next && next.type === "paragraphs") {
            out.push({ bid: newBid(), type: "section", heading: b, paragraphs: next });
            i++;
          } else {
            out.push(b);
          }
        }
        return out;
      }

      function flattenSections(blocks) {
        var out = [];
        blocks.forEach(function (b) {
          if (b.type === "section") {
            out.push(b.heading);
            out.push(b.paragraphs);
          } else {
            out.push(b);
          }
        });
        return out;
      }

      function doSave(lid) {
        if (!saveFn) return;
        setStatus("saving", "שומר…");
        saveState[lid] = "saving";
        renderLessonSelect();
        var data = lessonData[lid];
        saveFn({ lessonId: lid, titleText: data.titleText, sections: flattenSections(data.blocks) })
          .then(function () {
            saveState[lid] = "saved";
            setStatus("saved", "נשמר באתר ✓");
            renderLessonSelect();
          })
          .catch(function (err) {
            saveState[lid] = "error";
            setStatus("error", (err && err.message) || "שגיאה בשמירה");
            renderLessonSelect();
          });
      }

      function dotHtml(lid) {
        var state = saveState[lid];
        if (state === "error") return '<span class="dot dot-error"></span>';
        if (state === "pending" || state === "saving") return '<span class="dot"></span>';
        return "";
      }

      // The dropdown that replaced the old per-lesson tab buttons: a single
      // trigger showing the lesson currently open for editing, opening a
      // menu grouped by page/amud (same grouping as the home page and the
      // "insert after" choices) to switch to a different one.
      function renderLessonSelect() {
        lessonSelectLabelEl.textContent = currentLesson ? (LESSON_LABELS[currentLesson] || currentLesson) : "בחירת שיעור לעריכה";
        var curState = currentLesson ? saveState[currentLesson] : null;
        lessonSelectDotEl.className = "dot" + (curState === "error" ? " dot-error" : "");
        lessonSelectDotEl.hidden = !(curState === "error" || curState === "pending" || curState === "saving");

        lessonSelectMenuEl.innerHTML = "";
        groupsData.forEach(function (group) {
          var wrap = document.createElement("div");
          wrap.className = "submenu";
          var trigger = document.createElement("button");
          trigger.type = "button";
          trigger.className = "dropdown-item submenu-trigger";
          trigger.innerHTML = "<span>" + group.title + "</span><svg class=\"submenu-arrow\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>";
          var panel = document.createElement("div");
          panel.className = "dropdown-menu submenu-panel";
          panel.hidden = true;
          group.lessons.forEach(function (l) {
            var lid = l.id;
            var item = document.createElement("button");
            item.type = "button";
            item.className = "dropdown-item" + (lid === currentLesson ? " active" : "");
            item.innerHTML = "<span>" + (LESSON_LABELS[lid] || lid) + "</span>" + dotHtml(lid);
            item.addEventListener("click", function () {
              currentLesson = lid;
              renderLessonSelect();
              renderContent();
              document.querySelectorAll(".dropdown-menu").forEach(function (m) { m.hidden = true; });
            });
            panel.appendChild(item);
          });
          wrap.appendChild(trigger);
          wrap.appendChild(panel);
          lessonSelectMenuEl.appendChild(wrap);
          wireSubmenuToggle(trigger, panel);
        });

        updateMoveButtons();
      }

      // Finds where `lid` sits within its own page-group, so the move
      // buttons can be disabled at either end - reordering only ever
      // happens within a group (see moveLesson in functions/index.js).
      function lessonPositionInfo(lid) {
        for (var gi = 0; gi < groupsData.length; gi++) {
          var lessons = groupsData[gi].lessons;
          for (var li = 0; li < lessons.length; li++) {
            if (lessons[li].id === lid) return { indexInGroup: li, groupSize: lessons.length };
          }
        }
        return null;
      }

      function updateMoveButtons() {
        var info = lessonPositionInfo(currentLesson);
        btnMoveUp.disabled = !info || info.indexInGroup === 0;
        btnMoveDown.disabled = !info || info.indexInGroup === info.groupSize - 1;
      }

      function doMoveLesson(direction) {
        if (!moveLessonFn || !currentLesson) return;
        btnMoveUp.disabled = true;
        btnMoveDown.disabled = true;
        moveLessonStatusEl.textContent = "מעדכן…";
        moveLessonFn({ lessonId: currentLesson, direction: direction })
          .then(function () {
            moveLessonStatusEl.textContent = "";
            return refreshLessonOrder();
          })
          .catch(function (err) {
            moveLessonStatusEl.textContent = (err && err.message) || "שינוי הסדר נכשל.";
            updateMoveButtons();

      function autoGrow(ta) {

      // ---- block card renderers ----

      function blockTopRow(badgeText) {

      function appendControls(top, lid, index, total, isProtected) {

      function tagLabelHeading(tag) {
        if (tag === "h2") return "כותרת קטע";
        return "כותרת משנה";
      }

      function renderHeadingBlock(lid, block, index, total) {
        var card = document.createElement("div");
        card.className = "block-card";
        var top = blockTopRow(tagLabelHeading(block.tag));
        var levelSel = document.createElement("select");
        levelSel.className = "level-select";
        [["h2", "כותרת קטע (גדולה)"], ["h3", "כותרת משנה"]].forEach(function (pair) {
          var o = document.createElement("option");
          o.value = pair[0]; o.textContent = pair[1];
          if (pair[0] === block.tag) o.selected = true;
          levelSel.appendChild(o);
        });
        levelSel.addEventListener("change", function () {
          block.tag = levelSel.value;
          top.querySelector(".tag-badge").textContent = tagLabelHeading(block.tag);
          scheduleSave(lid);
        });
        top.insertBefore(levelSel, top.lastChild);
        appendControls(top, lid, index, total, false);
        card.appendChild(top);

        var input = document.createElement("input");
        input.type = "text";

        input.addEventListener("input", function () {

      }

      // Toggles `marker` (e.g. ** for bold, _ for italic) around the
      // selected text in `textarea` - the same lightweight syntax
      // functions/index.js turns into real <strong>/<em> tags. If the
      // selection is already marked (markers selected along with the text,
      // or sitting just outside it), they're removed instead of doubled up.
      // Returns false (no-op) if nothing is selected.
      function wrapSelection(textarea, marker) {
        var start = textarea.selectionStart;
        var end = textarea.selectionEnd;
        if (start === end) return false;
        var value = textarea.value;
        var selected = value.slice(start, end);
        var mLen = marker.length;
        var newValue, newStart, newEnd;

        if (selected.slice(0, mLen) === marker && selected.slice(-mLen) === marker && selected.length >= mLen * 2) {
          var inner = selected.slice(mLen, selected.length - mLen);
          newValue = value.slice(0, start) + inner + value.slice(end);
          newStart = start;
          newEnd = start + inner.length;
        } else if (value.slice(start - mLen, start) === marker && value.slice(end, end + mLen) === marker) {
          newValue = value.slice(0, start - mLen) + selected + value.slice(end + mLen);
          newStart = start - mLen;
          newEnd = newStart + selected.length;
        } else {
          newValue = value.slice(0, start) + marker + selected + marker + value.slice(end);
          newStart = start + mLen;
          newEnd = end + mLen;
        }

        textarea.value = newValue;
        textarea.selectionStart = newStart;
        textarea.selectionEnd = newEnd;
        textarea.focus();
        return true;
      }

      // Given the textarea's current selection, returns the [firstLine,
      // lastLine] paragraph-item indices it touches (counting newlines up
      // to each edge; a plain cursor with no selection still resolves to
      // the one line it sits on).
      function selectedLineRange(control) {
        var head = control.value.slice(0, control.selectionStart);
        var tail = control.value.slice(0, control.selectionEnd);
        var first = (head.match(/\n/g) || []).length;
        var last = (tail.match(/\n/g) || []).length;
        return [first, last];
      }

      function renderInlineToolbar(control, block, lid, onStyleChange) {
        var bar = document.createElement("div");
        bar.className = "inline-toolbar";
        // Tapping a button normally moves focus to it first, which on many
        // mobile browsers collapses the textarea's text selection before
        // the click handler even runs - so the format silently does
        // nothing. Blocking the default mousedown/pointerdown keeps focus
        // (and the selection) on the textarea itself.
        function preventFocusSteal(e) { e.preventDefault(); }

        var boldBtn = document.createElement("button");
        boldBtn.type = "button";
        boldBtn.className = "inline-btn inline-btn-bold";
        boldBtn.textContent = "הדגשה";
        boldBtn.title = "סמנו טקסט בתיבה ואז לחצו כאן";
        boldBtn.addEventListener("mousedown", preventFocusSteal);
        boldBtn.addEventListener("pointerdown", preventFocusSteal);
        boldBtn.addEventListener("click", function () {
          if (wrapSelection(control, "**")) control.dispatchEvent(new Event("input", { bubbles: true }));
        });
        // A content paragraph shows in the textarea wrapped in _..._ - the
        // same leading/trailing mark the old italic button used, so a
        // marked paragraph is visible at a glance without a separate list.
        var contentBtn = document.createElement("button");
        contentBtn.type = "button";
        contentBtn.className = "inline-btn inline-btn-content";
        contentBtn.textContent = "תוכן";
        contentBtn.title = "מקמו את הסמן בפסקה (או סמנו כמה פסקאות) ואז לחצו כאן";
        contentBtn.addEventListener("mousedown", preventFocusSteal);
        contentBtn.addEventListener("pointerdown", preventFocusSteal);
        contentBtn.addEventListener("click", function () {
          var range = selectedLineRange(control);
          var first = range[0], last = range[1];
          if (first > last) { var t = first; first = last; last = t; }
          var lines = control.value.split("\n");
          var touched = lines.slice(first, last + 1);
          if (!touched.length) return;
          function isWrapped(line) { return line.length >= 2 && line.slice(0, 1) === "_" && line.slice(-1) === "_"; }
          var allWrapped = touched.every(isWrapped);
          for (var i = first; i <= last && i < lines.length; i++) {
            var wrapped = isWrapped(lines[i]);
            if (allWrapped && wrapped) lines[i] = lines[i].slice(1, -1);
            else if (!allWrapped && !wrapped) lines[i] = "_" + lines[i] + "_";
          }
          control.value = lines.join("\n");
          control.focus();
          control.dispatchEvent(new Event("input", { bubbles: true }));
        });
        bar.appendChild(boldBtn);
        bar.appendChild(contentBtn);
        return bar;
      }

      // Builds the textarea + inline toolbar for a "paragraphs" block, wired
      // up to `block` and `lid`. `badgeEl` (optional) gets its paragraph
      // count kept in sync; pass null where the count isn't shown (a
      // section's card has a fixed label instead). Shared by the standalone
      // paragraphs block and the combined heading+paragraphs section block.
      function buildParagraphsEditor(lid, block, badgeEl) {
        var wrap = document.createElement("div");

        var control = document.createElement("textarea");
        control.className = "p-textarea";
        control.rows = 1;
        control.value = block.items.map(function (p) {
          return p.cls === "p-strong" ? "_" + p.text + "_" : p.text;
        }).join("\n");

        wrap.appendChild(renderInlineToolbar(control, block, lid));

        control.addEventListener("input", function () {
          autoGrow(control);
          var lines = control.value.split("\n");
          var prevItems = block.items;
          block.items = lines.map(function (line, idx) {
            var wrapped = line.length >= 2 && line.slice(0, 1) === "_" && line.slice(-1) === "_";
            if (wrapped) return { text: line.slice(1, -1), cls: "p-strong" };
            var prevCls = idx < prevItems.length ? prevItems[idx].cls : (prevItems.length ? prevItems[prevItems.length - 1].cls : "");
            // a paragraph just untoggled from content goes back to regular,
            // rather than whatever unrelated style it happened to carry
            return { text: line, cls: prevCls === "p-strong" ? "" : prevCls };
          });
          if (badgeEl) badgeEl.textContent = "טקסט (" + block.items.length + " פסקאות)";
          scheduleSave(lid);
        });

        wrap.appendChild(control);
        requestAnimationFrame(function () { autoGrow(control); });
        return wrap;
      }

      function renderParagraphsBlock(lid, block, index, total) {
        var card = document.createElement("div");
        card.className = "block-card";
        var top = blockTopRow("טקסט (" + block.items.length + " פסקאות)");
        appendControls(top, lid, index, total, false);
        card.appendChild(top);
        card.appendChild(buildParagraphsEditor(lid, block, top.querySelector(".tag-badge")));
        return card;
      }

      // A subheading (h3) locked together with the paragraph text right
      // after it - one card, one set of move/delete controls, so the
      // heading can never end up separated from its content. See
      // mergeHeadingParagraphPairs() for how these get formed on load.
      function renderSectionBlock(lid, block, index, total) {
        var card = document.createElement("div");
        card.className = "block-card";
        var top = blockTopRow("כותרת משנה + טקסט");
        appendControls(top, lid, index, total, false);
        card.appendChild(top);

        var headingInput = document.createElement("input");
        headingInput.type = "text";
        headingInput.className = "heading-input";
        headingInput.value = block.heading.text;
        headingInput.addEventListener("input", function () {
          block.heading.text = headingInput.value;
          scheduleSave(lid);
        });
        card.appendChild(headingInput);

        card.appendChild(buildParagraphsEditor(lid, block.paragraphs, null));
        return card;
      }

      function renderQuizBlock(lid, block, index, total) {
        var card = document.createElement("div");
        card.className = "block-card";
        var top = blockTopRow("שאלת תרגול");
        appendControls(top, lid, index, total, false);
        card.appendChild(top);

        var qInput = document.createElement("input");
        qInput.type = "text";
        qInput.className = "quiz-q-input";
        qInput.value = block.question;
        qInput.addEventListener("input", function () {
          block.question = qInput.value;
          scheduleSave(lid);
        });
        card.appendChild(qInput);

        var radioName = "correct-" + block.bid;
        block.choices.forEach(function (choice, cIdx) {
          var row = document.createElement("div");
          row.className = "quiz-choice-row";
          var radio = document.createElement("input");
          radio.type = "radio";
          radio.name = radioName;
          radio.checked = !!choice.correct;
          radio.addEventListener("change", function () {
            block.choices.forEach(function (c, i) { c.correct = i === cIdx; });
            scheduleSave(lid);
          });
          var text = document.createElement("input");
          text.type = "text";
          text.value = choice.text;
          text.addEventListener("input", function () {
            choice.text = text.value;
            scheduleSave(lid);
          });
          row.appendChild(radio);
          row.appendChild(text);
          card.appendChild(row);
        });
        return card;
      }

      function stripTags(html) {
        var div = document.createElement("div");
        div.innerHTML = html;
        var text = div.textContent.replace(/\s+/g, " ").trim();
        return text.length > 140 ? text.slice(0, 140) + "…" : text;
      }

      function renderRawBlock(lid, block, index, total) {
        var card = document.createElement("div");
        card.className = "block-card";
        var top = blockTopRow("תוכן מיוחד (רשימה / טבלה / דוגמה) - לא ניתן לעריכה כאן");
        appendControls(top, lid, index, total, false);
        card.appendChild(top);
        var preview = document.createElement("div");
        preview.className = "raw-preview";
        var text = stripTags(block.html);
        preview.textContent = text || "(תוכן חזותי, ללא טקסט)";
        card.appendChild(preview);
        return card;
      }

      function renderBoxBlock(lid, block, index, total) {
        var row = document.createElement("div");
        row.className = "box-divider";
        var label = document.createElement("span");
        label.textContent = "\u2726 קלף חדש מתחיל כאן";
        row.appendChild(label);
        appendControls(row, lid, index, total, index === 0);
        return row;
      }

      function defaultBlockFor(type) {
        if (type === "heading") return { bid: newBid(), type: "heading", tag: "h2", cls: "", text: "כותרת קטע חדשה" };
        if (type === "section") return {
          bid: newBid(), type: "section",
          heading: { bid: newBid(), type: "heading", tag: "h3", cls: "", text: "כותרת משנה חדשה" },
          paragraphs: { bid: newBid(), type: "paragraphs", items: [{ text: "טקסט חדש", cls: "p-strong" }] }
        };
        if (type === "quiz") return {
          bid: newBid(), type: "quiz", qid: "custom-" + newBid(), question: "שאלה חדשה",
          choices: [{ text: "תשובה נכונה", correct: true }, { text: "תשובה שגויה", correct: false }, { text: "תשובה שגויה", correct: false }]
        };
        return { bid: newBid(), type: "box" };
      }

      function insertBlock(lid, index, type) {
        var arr = lessonData[lid].blocks;
        var insertAt = index;
        if (insertAt === 0 && arr.length && arr[0].type === "box" && type !== "box") insertAt = 1;
        arr.splice(insertAt, 0, defaultBlockFor(type));
        scheduleSave(lid);
        renderContent();
      }

      function moveBlock(lid, index, dir) {
        var arr = lessonData[lid].blocks;
        var newIndex = index + dir;
        if (newIndex < 0 || newIndex >= arr.length) return;
        var tmp = arr[index];
        arr[index] = arr[newIndex];
        arr[newIndex] = tmp;
        scheduleSave(lid);
        renderContent();
      }

      function deleteBlock(lid, index) {
        var arr = lessonData[lid].blocks;
        if (arr[index].type === "box" && index === 0) return;
        if (!window.confirm("למחוק את הקטע הזה?")) return;
        arr.splice(index, 1);
        if (arr.length && arr[0].type !== "box") arr.unshift({ bid: newBid(), type: "box" });
        scheduleSave(lid);
        renderContent();
      }

      function renderAddRow(lid, index) {
        var row = document.createElement("div");
        row.className = "add-row";
        var toggle = document.createElement("button");
        toggle.type = "button";
        toggle.className = "add-toggle";
        toggle.textContent = "+ הוספת קטע";
        var menu = document.createElement("div");
        menu.className = "add-menu";
        menu.hidden = true;
        [["heading", "כותרת קטע (h2)"], ["section", "כותרת משנה + טקסט"], ["quiz", "שאלת תרגול"], ["box", "קלף חדש"]].forEach(function (pair) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "btn";
          b.textContent = pair[1];
          b.addEventListener("click", function () { insertBlock(lid, index, pair[0]); });
          menu.appendChild(b);
        });
        toggle.addEventListener("click", function () { menu.hidden = !menu.hidden; });
        row.appendChild(toggle);
        row.appendChild(menu);
        return row;
      }

      function renderContent() {
        contentEl.innerHTML = "";
        var data = lessonData[currentLesson];
        if (!data) {
          var loading = document.createElement("p");
          loading.className = "loading-msg";
          loading.textContent = "טוען מהאתר…";
          contentEl.appendChild(loading);
          return;
        }
        contentEl.appendChild(renderTitleField(currentLesson, data));

        contentEl.appendChild(renderAddRow(currentLesson, 0));
        data.blocks.forEach(function (block, index) {
          var card;
          if (block.type === "heading") card = renderHeadingBlock(currentLesson, block, index, data.blocks.length);
          else if (block.type === "paragraphs") card = renderParagraphsBlock(currentLesson, block, index, data.blocks.length);
          else if (block.type === "section") card = renderSectionBlock(currentLesson, block, index, data.blocks.length);
          else if (block.type === "quiz") card = renderQuizBlock(currentLesson, block, index, data.blocks.length);
          else if (block.type === "raw") card = renderRawBlock(currentLesson, block, index, data.blocks.length);
          else if (block.type === "box") card = renderBoxBlock(currentLesson, block, index, data.blocks.length);
          if (card) contentEl.appendChild(card);
          contentEl.appendChild(renderAddRow(currentLesson, index + 1));
        });
      }

      function loadLesson(lid) {
        return fetch("lessons/" + lid + ".html", { cache: "no-store" })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.text();
          })
          .then(function (html) {
            lessonData[lid] = parseLessonHtml(html);
            lessonData[lid].blocks = mergeHeadingParagraphPairs(lessonData[lid].blocks);
          })
          .catch(function () {
            lessonData[lid] = { titleText: "(שגיאה בטעינת השיעור)", blocks: [{ bid: newBid(), type: "box" }] };
          });
      }

      function loadAll() {
        return Promise.all(LESSON_ORDER.map(loadLesson));
      }

      btnLogout.addEventListener("click", function () {
        logoutUser();
      });

      function setNewLessonStatus(state, label) {
        newLessonStatusEl.className = "new-lesson-status" + (state ? " status-" + state : "");
        newLessonStatusEl.textContent = label || "";
      }

      btnNewLesson.addEventListener("click", function () {
        newLessonFormEl.hidden = !newLessonFormEl.hidden;
        if (!newLessonFormEl.hidden) {
          newLessonIdInput.value = "";
          newLessonTitleInput.value = "";
          newLessonSourceInput.value = "";
          setNewLessonStatus(null, "");
          renderNewLessonAfterOptions();
          newLessonIdInput.focus();
        }
      });

      // The "insert after" options depend on which page-group the typed
      // דף ועמוד matches - rebuilt every time that field changes so the
      // choices always stay lessons that actually share that group.
      function renderNewLessonAfterOptions() {
        var sourceVal = newLessonSourceInput.value.trim();
        var group = groupsData.find(function (g) { return g.title === sourceVal; });
        newLessonAfterSelect.innerHTML = "";
        var defaultOpt = document.createElement("option");
        defaultOpt.value = "";
        defaultOpt.textContent = "בסוף הדף";
        newLessonAfterSelect.appendChild(defaultOpt);
        if (group) {
          group.lessons.forEach(function (l) {
            var opt = document.createElement("option");
            opt.value = l.id;
            opt.textContent = "אחרי: " + l.title;
            newLessonAfterSelect.appendChild(opt);
          });
        }
      }
      newLessonSourceInput.addEventListener("input", renderNewLessonAfterOptions);

      btnCancelNewLesson.addEventListener("click", function () {
        newLessonFormEl.hidden = true;
      });

      var LESSON_ID_RE = /^[a-z0-9]+(-[a-z0-9]+)*$/;

      btnCreateLesson.addEventListener("click", function () {
        if (!createLessonFn) return;
        var lessonId = newLessonIdInput.value.trim();
        var titleText = newLessonTitleInput.value.trim();
        var sourceText = newLessonSourceInput.value.trim();
        if (!LESSON_ID_RE.test(lessonId)) {
          setNewLessonStatus("error", "מזהה לא תקין - רק אותיות אנגליות קטנות, ספרות ומקפים.");
          return;
        }
        if (LESSON_ORDER.indexOf(lessonId) !== -1) {
          setNewLessonStatus("error", "כבר קיים שיעור עם המזהה הזה.");
          return;
        }
        if (!titleText) {
          setNewLessonStatus("error", "צריך כותרת (דיבור המתחיל) לשיעור.");
          return;
        }
        if (!sourceText) {
          setNewLessonStatus("error", "צריך לציין על איזה דף ועמוד השיעור.");
          return;
        }
        var afterLessonId = newLessonAfterSelect.value || null;
        btnCreateLesson.disabled = true;
        setNewLessonStatus("saving", "יוצר שיעור…");
        createLessonFn({ lessonId: lessonId, titleText: titleText, sourceText: sourceText, afterLessonId: afterLessonId })
          .then(function () {
            btnCreateLesson.disabled = false;
            newLessonFormEl.hidden = true;
            currentLesson = lessonId;
            return refreshLessonOrder();
          })
          .then(function () {
            renderLessonSelect();
            renderContent();
            return loadLesson(lessonId);
          })
          .then(function () {
            renderLessonSelect();
            renderContent();
          })
          .catch(function (err) {
            btnCreateLesson.disabled = false;
            setNewLessonStatus("error", (err && err.message) || "יצירת השיעור נכשלה.");
          });
      });

      // Header dropdown + nested submenu toggling, self-contained here since
      // admin.html doesn't load the site's shared main.js. Mirrors the same
      // classes/behavior used on the public pages for visual consistency.
      function wireDropdownToggle(trigger, menu) {
        trigger.addEventListener("click", function (e) {
          e.stopPropagation();
          var willOpen = menu.hidden;
          document.querySelectorAll(".dropdown-menu").forEach(function (m) { m.hidden = true; });
          menu.hidden = !willOpen;
        });
      }
      function wireSubmenuToggle(trigger, panel) {
        trigger.addEventListener("click", function (e) {
          e.stopPropagation();
          panel.hidden = !panel.hidden;
        });
      }
      document.addEventListener("click", function () {
        document.querySelectorAll(".dropdown-menu").forEach(function (m) { m.hidden = true; });
      });

      var brandTrigger = document.querySelector(".brand-dropdown .dropdown-trigger");
      var brandMenu = document.querySelector(".brand-menu");
      // The header's own "ארבעה אבות" submenu is just for opening the live
      // lesson pages, same as on every other page - it doesn't pick which
      // lesson this panel is editing (that's lesson-select below).
      var lessonsMenuTrigger = document.querySelector(".brand-menu .submenu-trigger");
      var lessonsMenuPanel = document.querySelector(".brand-menu .submenu-panel");
      wireDropdownToggle(brandTrigger, brandMenu);
      wireSubmenuToggle(lessonsMenuTrigger, lessonsMenuPanel);
      wireDropdownToggle(lessonSelectTrigger, lessonSelectMenuEl);

      // Single source of truth for lesson order/grouping: read live from
      // index.html (so it never drifts from what's actually there - a
      // lesson created or reordered from this panel, another admin session,
      // or a moment ago from somewhere else all show up the same way), then
      // refresh everything that depends on it: the lesson-select dropdown,
      // the tabs bar, and the "insert after" choices in the new-lesson form.
      function refreshLessonOrder() {
        return fetch("index.html", { cache: "no-store" })
          .then(function (res) { return res.text(); })
          .then(function (html) {
            var doc = new DOMParser().parseFromString(html, "text/html");
            var groups = [];
            doc.querySelectorAll(".group-panel").forEach(function (panel) {
              var titleEl = panel.querySelector(".group-title span");
              var lessons = [];
              panel.querySelectorAll(".lesson-card").forEach(function (card) {
                var href = card.getAttribute("href") || "";
                var m = href.match(/^lessons\/([a-z0-9-]+)\.html$/);
                var h3 = card.querySelector("h3");
                if (m) lessons.push({ id: m[1], title: h3 ? h3.textContent.trim() : m[1] });
              });
              groups.push({ title: titleEl ? titleEl.textContent.trim() : "", lessons: lessons });
            });

            groupsData = groups;
            LESSON_ORDER = [];
            LESSON_LABELS = {};
            groups.forEach(function (group) {
              group.lessons.forEach(function (l) {
                LESSON_ORDER.push(l.id);
                LESSON_LABELS[l.id] = l.title;
                if (!(l.id in lessonData)) {
                  lessonData[l.id] = null;
                  saveState[l.id] = "idle";
                }
              });
            });
            if (!currentLesson && LESSON_ORDER.length) currentLesson = LESSON_ORDER[0];

            renderNewLessonAfterOptions();
            renderLessonSelect();
          })
          .catch(function () { /* best-effort: order just stays as it was */ });
      }

      if (isReady()) {
        watchAuthState(function (user) {
          if (user) {
            authGateEl.hidden = true;
            adminMainEl.hidden = false;
            var functions = getFunctions(getApp());
            saveFn = httpsCallable(functions, "saveLessonContent");
            createLessonFn = httpsCallable(functions, "createLesson");
            moveLessonFn = httpsCallable(functions, "moveLesson");
            renderContent();
            refreshLessonOrder().then(function () {
              renderContent();
              return loadAll();
            }).then(function () {
              renderLessonSelect();
              renderContent();
            });
          } else {
            authGateEl.hidden = false;
            adminMainEl.hidden = true;
          }
        });
      }
    })();
  </script>
</body>
</html>
