<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>נקודות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EA;
    --paper-dark:#EFEADB;
    --ink:#22304A;
    --ink-soft:#4B5C79;
    --line:#D9D2BC;
    --gold:#B8902E;
    --gold-bright:#D8AC3E;
    --gold-bg:#FBF1D9;
    --green:#2E7D4F;
    --green-bg:#E3F3E9;
    --danger:#9C3B3B;
    --danger-bg:#F5E4E1;
    --radius:10px;
  }

  * { box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Rubik', sans-serif;
    overflow-x: hidden;
  }

  body{
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%),
      repeating-linear-gradient(0deg, transparent, transparent 38px, rgba(34,48,74,0.035) 39px);
  }

  header{
    padding: 32px 24px 20px;
    text-align:center;
    position: relative;
  }

  header::after{
    content:"";
    display:block;
    width:120px;
    height:3px;
    background: var(--gold);
    margin: 14px auto 0;
    border-radius: 2px;
  }

  h1{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900;
    font-size: clamp(26px, 4vw, 38px);
    margin: 0;
    color: var(--ink);
    letter-spacing: 0.5px;
  }

  .subtitle{
    font-size: 14px;
    color: var(--ink-soft);
    margin-top: 6px;
    font-weight: 500;
  }

  .board-col{
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 14px;
    flex: 1 1 480px;
    max-width: 900px;
  }

  .metivta-board-col{
    flex: 1 1 260px;
    max-width: 400px;
  }

  .toolbar{
    display:flex;
    align-items:center;
    gap:14px;
  }

  .status{
    font-size: 13px;
    color: var(--ink-soft);
    min-height: 18px;
  }

  button.reset-btn{
    background: var(--paper);
    border: 1.5px solid var(--danger);
    color: var(--danger);
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button.reset-btn:hover{
    background: var(--danger);
    color: var(--paper);
  }
  button.reset-btn:active{ transform: scale(0.97); }

  button.archive-btn{
    background: var(--paper);
    border: 1.5px solid var(--ink);
    color: var(--ink);
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button.archive-btn:hover{
    background: var(--ink);
    color: var(--paper);
  }
  button.archive-btn:active{ transform: scale(0.97); }

  .archive-view{
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  .archive-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .archive-title{
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 22px;
    color: var(--ink);
    margin: 0;
  }

  .archive-empty{
    text-align: center;
    color: var(--ink-soft);
    padding: 40px 0;
  }

  .archive-entry{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 2px 0 var(--line), 0 8px 24px rgba(34,48,74,0.08);
    overflow: hidden;
    margin-bottom: 24px;
  }

  .weekly-tables-scroll{
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .weekly-tables-scroll .archive-entry{
    flex: 0 0 auto;
    margin-bottom: 0;
    width: 440px;
  }
  .weekly-tables-scroll .archive-table{
    width: 440px;
    table-layout: fixed;
  }

  .archive-date{
    background: var(--ink);
    color: var(--paper);
    font-weight: 700;
    font-size: 14px;
    padding: 10px 16px;
  }

  .weekly-header-row{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .export-btn{
    background: var(--gold);
    color: var(--ink);
    border: none;
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }
  .export-btn:hover{
    background: var(--gold-bright);
  }

  table.archive-table{
    border-collapse: collapse;
    width: 100%;
  }
  table.archive-table th{
    background: var(--paper-dark);
    font-size: 12.5px;
    font-weight: 700;
    padding: 8px 4px;
    border-bottom: 2px solid var(--gold);
    border-left: 1px solid var(--line);
    text-align: center;
  }
  table.archive-table th:first-child{ border-left: none; }
  table.archive-table td{
    text-align: center;
    font-size: 13px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }
  table.archive-table td:first-child{ border-left: none; white-space: nowrap; }
  table.archive-table th:first-child{ white-space: nowrap; }
  table.archive-table tr:nth-child(even){ background: #FCFBF6; }

  .boards{
    display:flex;
    gap: clamp(16px, 2vw, 32px);
    justify-content:center;
    align-items:flex-start;
    flex-wrap: wrap;
    padding: 6px;
    width: 100%;
  }

  .board-wrap{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 2px 0 var(--line), 0 8px 24px rgba(34,48,74,0.08);
    width: 100%;
  }

  .table-scroll{
    overflow-x: auto;
    overflow-y: visible;
    -webkit-overflow-scrolling: touch;
  }

  .board-title{
    background: var(--ink);
    color: var(--paper);
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 700;
    font-size: 15px;
    text-align: center;
    padding: 10px;
    letter-spacing: 0.5px;
  }

  table{
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }

  thead th{
    background: var(--paper-dark);
    color: var(--ink);
    font-size: clamp(11px, 4vw, 20px);
    font-weight: 700;
    padding: clamp(4px, 0.8vw, 8px) 6px;
    border-bottom: 2px solid var(--gold);
    border-left: 1px solid var(--line);
    white-space: nowrap;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .th-inner{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  thead th:first-child{ border-left: 1px solid var(--line); border-top-right-radius: 14px; }
  thead th:last-child{ border-top-left-radius: 14px; }
  tbody tr:last-child td:first-child{ border-bottom-right-radius: 14px; }
  tbody tr:last-child td:last-child{ border-bottom-left-radius: 14px; }

  .merged-dropdown{
    position: relative;
    display: inline-block;
    text-align: center;
  }

  .merged-dropdown-toggle{
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    font-size: clamp(11px, 3vw, 20px);
    color: var(--ink);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px 4px;
    max-width: 100%;
    text-align: center;
  }
  .archive-date .merged-dropdown-toggle{
    color: var(--paper);
  }
  .merged-dropdown-toggle:focus{
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  .merged-dropdown-list{
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    z-index: 30;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 6px 18px rgba(34,48,74,0.18);
    min-width: 110px;
    overflow: hidden;
  }
  .merged-dropdown-list.open{
    display: block;
  }
  .merged-dropdown-list-right{
    left: auto;
    right: 0;
  }

  .merged-dropdown-option{
    padding: 10px 14px;
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink);
    text-align: center;
    cursor: pointer;
    white-space: nowrap;
  }
  .merged-dropdown-option-all{
    border-top: 1px solid var(--line);
    margin-top: 2px;
    color: var(--gold);
    font-weight: 700;
  }
  .merged-dropdown-option:hover{
    background: var(--gold-bg);
  }

  .col-reset-btn{
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    font-size: clamp(12px, 4.5vw, 24px);
    color: var(--ink);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 2px 8px;
    text-align: center;
  }
  .col-reset-btn:hover{
    color: var(--gold);
  }

  tbody td{
    text-align: center;
    border-bottom: 1px solid var(--line);
    border-left: 1px solid var(--line);
    padding: 11px 2px;
  }
  tbody td:first-child{ border-left: 1px solid var(--line); }

  tbody tr:nth-child(even){ background: #FCFBF6; }
  tbody tr:hover{ background: var(--gold-bg); }

  .num-cell{
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .num-cell .cell-text{
    font-family: 'Rubik', sans-serif;
    font-weight: 700;
    font-size: clamp(14px, 5cqw, 36px);
  }

  .cell-text{
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    height: 61px;
    overflow: hidden;
  }

  @keyframes flashYellowBg{
    0%, 100% { background-color: transparent; }
    50% { background-color: #FFD54A; }
  }
  tr.flash-yellow td{
    animation: flashYellowBg 1s ease-in-out 3;
  }

  .total-cell{
    color: var(--ink-soft);
    background: rgba(184,144,46,0.08);
  }
  .total-cell .cell-text{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 800;
    font-size: clamp(16px, 6.5vw, 40px);
  }

  .point-cell{
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s ease;
  }

  .point-cell .point-val{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 800;
    font-size: clamp(16px, 6.5vw, 40px);
    color: var(--ink-soft);
    transition: transform 0.12s ease, color 0.12s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 61px;
    overflow: hidden;
    min-width: 1em;
  }

  .point-cell.active{
    background: var(--green-bg);
  }
  .point-cell.active .point-val{
    color: var(--green);
    transform: scale(1.1);
  }

  .purchase-cell.has-purchases{
    background: var(--danger-bg);
  }
  .purchase-cell.has-purchases .point-val{
    color: var(--danger);
    transform: scale(1.1);
  }

  .minus-cell.has-minus{
    background: var(--danger-bg);
  }
  .minus-cell.has-minus .point-val{
    color: var(--danger);
    transform: scale(1.1);
  }

  .point-cell:active .point-val{
    transform: scale(0.9);
  }

  footer{
    text-align:center;
    padding: 40px 20px 40px;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(34,48,74,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }

  .modal-box{
    background: var(--paper);
    border-radius: 14px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
    text-align: center;
  }

  .modal-msg{
    font-size: 16px;
    color: var(--ink);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .modal-btns{
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .modal-btn{
    font-family: 'Rubik', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 22px;
    border-radius: var(--radius);
    cursor: pointer;
    border: 1.5px solid transparent;
  }

  .modal-btn-confirm{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .modal-btn-confirm:hover{ opacity: 0.9; }

  .modal-btn-cancel{
    background: var(--paper);
    color: var(--ink-soft);
    border-color: var(--line);
  }
  .modal-btn-cancel:hover{ background: var(--paper-dark); }

  @media (max-width: 720px){
    .boards{ flex-direction: column; align-items: center; }
    .board-wrap{ width: 100%; max-width: 480px; }
  }

  @media (max-width: 200px){
    .col-hide-narrow{ display: none !important; }
    col.col-hide-narrow{ width: 0 !important; }
    col:not(.col-hide-narrow){ width: 33.33% !important; }
  }

  .lock-screen{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .lock-box{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 2px 0 var(--line), 0 8px 24px rgba(34,48,74,0.08);
    padding: 32px 28px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }

  .lock-title{
    font-family: 'Frank Ruhl Libre', serif;
    font-weight: 900;
    font-size: 24px;
    color: var(--ink);
    margin: 0 0 6px;
  }

  .lock-sub{
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  .lock-input{
    width: 100%;
    font-family: 'Rubik', sans-serif;
    font-size: 20px;
    text-align: center;
    letter-spacing: 4px;
    padding: 12px;
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 10px;
    background: var(--paper);
    color: var(--ink);
  }
  .lock-input:focus{
    outline: none;
    border-color: var(--gold);
  }

  .lock-error{
    color: var(--danger);
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<div id="appContent">
  <div class="boards" id="boards"></div>

  <div class="archive-view" id="todaySummary" style="padding: 0 20px 20px; max-width: 900px; margin: 0 auto;"></div>

  <div class="archive-view" id="frequentFlyerView" style="display:none; max-width: 1200px;"></div>

  <div class="archive-view" id="metivtaView" style="display:none; max-width: 1600px;"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, onSnapshot, runTransaction,
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { firebaseConfig } from "../assets/js/firebase-config.js";

window.addEventListener('error', (ev) => {
  showStartupError(ev.error || ev.message || ev);
});
window.addEventListener('unhandledrejection', (ev) => {
  showStartupError(ev.reason);
});

const CATEGORIES = [
  { key: 'c1', label: '8:10', value: 3 },
  { key: 'c2', label: 'קרבנות', value: 1 },
  { key: 'c3', label: 'תפילה', value: 2 },
  { key: 'c4', label: '11:23', value: 1 },
  { key: 'c5', label: '+', value: 1, resettable: true, cumulativeKey: 'c5Total' },
  { key: 'c6', label: 'מקווה', value: 1 },
  { key: 'c7', label: '8:45', value: 1 },
  { key: 'c8', label: '12:48', value: 1 }
];

const MERGE_GROUPS = [
  ['c1', 'c7', 'c4', 'c8'],
  ['c5', 'c2', 'c3']
];

const STUDENT_NAMES = [
  'צאלי', 'ישרוליק', 'נתנאל', 'מענדי ה.', 'מענדי ח.', 'אלעאי', 'יהונתן', 'איתן', 'מענדי ל.', 'שלוימי', 'מוישלה', 'לוי ס.',
  'שמוליק ע.', 'מולי', 'שלום', 'חננאל', 'שמוליק צ.', 'אושר', 'שמעון', 'מוטי', 'לוי ק.', 'נועם', 'משה'
];

function studentName(id){
  return STUDENT_NAMES[id - 1] || id;
}

const TOTAL_STUDENTS = 23;
const STORAGE_KEY = 'classroom-points-v1';
const FIRESTORE_COLLECTION = 'classroom_points';

const firebaseApp = initializeApp(firebaseConfig);
const firestoreDb = getFirestore(firebaseApp);
const stateDocRef = doc(firestoreDb, FIRESTORE_COLLECTION, STORAGE_KEY);

let lastSyncedStateJson = null;

async function storageGet(){
  try{
    const snap = await getDoc(stateDocRef);
    if (snap.exists()){
      const json = JSON.stringify(snap.data());
      lastSyncedStateJson = json;
      return { value: json };
    }
    return null;
  } catch(e){
    return null;
  }
}

async function storageSet(value){
  try{
    const body = JSON.parse(value);
    await setDoc(stateDocRef, body);
    lastSyncedStateJson = value;
    return { value };
  } catch(e){
    return null;
  }
}

function subscribeToRemoteStateChanges(){
  onSnapshot(stateDocRef, (snap) => {
    if (!snap.exists() || snap.metadata.hasPendingWrites) return;
    const json = JSON.stringify(snap.data());
    if (json === lastSyncedStateJson) return;
    lastSyncedStateJson = json;
    let parsed;
    try{ parsed = JSON.parse(json); } catch(e){ return; }
    if (!parsed || !Array.isArray(parsed.students) || parsed.students.length !== TOTAL_STUDENTS) return;
    state = parsed;
    render();
    if (document.getElementById('frequentFlyerView').style.display !== 'none') renderFrequentFlyerView();
    if (document.getElementById('metivtaView').style.display !== 'none') renderMetivtaView();
  }, (err) => {
    // realtime sync unavailable; local get/set on next load still works
  });
}

async function saveCsvFile(filename, csv){
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

let state = null; // { students: [{id, cumulative, cats:{c1,c2,c3,c4}}] }

const METIVTA_EXTRA_NAMES = [
  'יהונתן', 'נריה', 'יהודה', 'חסדיאל', 'אוריאל', 'מענדל', 'שניאור', 'מענדי דר.', 'מענדי זכ.', 'עוזי', 'מענדי יא.',
  'אופיר', 'לוי', 'מענדי מז.', 'מענדי מע.', 'אברמי', 'שמואל', 'מענדי סמ.', 'ברוכי', 'איזיק', 'בער', 'רמי', 'ניתאי'
];

function metivtaExtraName(id){
  return METIVTA_EXTRA_NAMES[id - 1] || String(id);
}

function defaultState(){
  const students = [];
  for (let i = 1; i <= TOTAL_STUDENTS; i++){
    students.push({ id: i, cumulative: 0, cats: { c1:0, c2:0, c3:0, c4:0, c5:0, c6:0, c7:0, c8:0 }, purchases: 0, c5Total: 0, minusTotal: 0, frequent: { mikvaot: 0, rambam: 0 }, frequentFrozen: { mikvaot: 0, rambam: 0 }, metivta: { attendance: 0, behavior: 0 }, metivtaFrozen: { attendance: 0, behavior: 0 } });
  }
  const metivtaExtra = [];
  for (let i = 1; i <= 23; i++){
    metivtaExtra.push({ id: i, metivta: { attendance: 0, behavior: 0 }, metivtaFrozen: { attendance: 0, behavior: 0 } });
  }
  return { students, metivtaExtra, mergedActive: MERGE_GROUPS.map(g => g[0]), minusShopActive: 'minus', archive: [], lastActivityDate: null, lastAutoResetDate: null };
}

function setStatus(msg){
  const el = document.getElementById('statusEl');
  if (el) el.textContent = msg;
}

async function loadState(){
  try{
    const result = await storageGet();
    if (result && result.value){
      const parsed = JSON.parse(result.value);
      if (parsed && Array.isArray(parsed.students) && parsed.students.length === TOTAL_STUDENTS){
        if (!Array.isArray(parsed.mergedActive) || parsed.mergedActive.length !== MERGE_GROUPS.length){
          parsed.mergedActive = MERGE_GROUPS.map(g => g[0]);
        }
        if (parsed.minusShopActive !== 'minus' && parsed.minusShopActive !== 'shop'){
          parsed.minusShopActive = 'minus';
        }
        parsed.students.forEach(s => {
          if (typeof s.purchases !== 'number') s.purchases = 0;
          if (!s.cats) s.cats = {};
          if (typeof s.cats.c5 !== 'number') s.cats.c5 = 0;
          if (typeof s.cats.c6 !== 'number') s.cats.c6 = 0;
          if (typeof s.cats.c7 !== 'number') s.cats.c7 = 0;
          if (typeof s.cats.c8 !== 'number') s.cats.c8 = 0;
          if (!s.frequent) s.frequent = { mikvaot: 0, rambam: 0 };
          if (!s.frequentFrozen) s.frequentFrozen = { mikvaot: s.frequent.mikvaot || 0, rambam: s.frequent.rambam || 0 };
          if (!s.metivta) s.metivta = { attendance: 0, behavior: 0 };
          if (!s.metivtaFrozen) s.metivtaFrozen = { attendance: s.metivta.attendance || 0, behavior: s.metivta.behavior || 0 };
          if (typeof s.c5Total !== 'number') s.c5Total = 0;
          if (typeof s.minusTotal !== 'number') s.minusTotal = 0;
        });
        if (!Array.isArray(parsed.metivtaExtra) || parsed.metivtaExtra.length !== 23){
          const existing = Array.isArray(parsed.metivtaExtra) ? parsed.metivtaExtra : [];
          const byId = {};
          existing.forEach(s => { byId[s.id] = s; });
          const metivtaExtra = [];
          for (let i = 1; i <= 23; i++){
            metivtaExtra.push(byId[i] || { id: i, metivta: { attendance: 0, behavior: 0 }, metivtaFrozen: { attendance: 0, behavior: 0 } });
          }
          parsed.metivtaExtra = metivtaExtra;
        }
        if (!Array.isArray(parsed.archive)) parsed.archive = [];
        {
          const dailyEntries = parsed.archive.filter(e => e.type !== 'weekly');
          const weeklyEntries = parsed.archive.filter(e => e.type === 'weekly');
          const MAX_DAILY = 90;
          const MAX_WEEKLY = 26;
          if (dailyEntries.length > MAX_DAILY || weeklyEntries.length > MAX_WEEKLY){
            const keptDaily = dailyEntries.slice(0, MAX_DAILY);
            const keptWeekly = weeklyEntries.slice(0, MAX_WEEKLY);
            parsed.archive = parsed.archive.filter(e => keptDaily.includes(e) || keptWeekly.includes(e));
          }
        }
        if (!parsed.testWeekCleanupDone){
          const cleanupPrevWeekStart = getWeekStart(new Date());
          cleanupPrevWeekStart.setDate(cleanupPrevWeekStart.getDate() - 7);
          const cleanupPrevWeekKey = getWeekKey(cleanupPrevWeekStart);
          parsed.archive = parsed.archive.filter(e => !(e.type === 'weekly' && e.weekKey === cleanupPrevWeekKey));
          parsed.testWeekCleanupDone = true;
        }
        if (!parsed.fixTzaali20260908){
          const tzaali = parsed.students.find(s => s.id === 1);
          if (tzaali){
            let plusReduceLeft = 32;
            const c5TotalReduce = Math.min(plusReduceLeft, tzaali.c5Total || 0);
            tzaali.c5Total = (tzaali.c5Total || 0) - c5TotalReduce;
            plusReduceLeft -= c5TotalReduce;
            if (plusReduceLeft > 0 && tzaali.cats){
              const c5Reduce = Math.min(plusReduceLeft, tzaali.cats.c5 || 0);
              tzaali.cats.c5 = (tzaali.cats.c5 || 0) - c5Reduce;
            }
            tzaali.minusTotal = Math.min(0, (tzaali.minusTotal || 0) + 28);
          }
          parsed.fixTzaali20260908 = true;
        }
        if (typeof parsed.lastActivityDate === 'undefined') parsed.lastActivityDate = null;
        if (typeof parsed.lastAutoResetDate === 'undefined') parsed.lastAutoResetDate = null;
        state = parsed;
        return;
      }
    }
  } catch(e){
    // key not found or storage error - fall through to default
  }
  state = defaultState();
}

function studentTotal(student){
  const todayCats = CATEGORIES.reduce((sum, c) => sum + (student.cats[c.key] || 0), 0);
  const todayPurchaseCost = (student.purchases || 0) * PURCHASE_COST;
  const todayNet = todayCats + (student.c5Total || 0) + (student.minusTotal || 0) - todayPurchaseCost;

  const archiveDailyEntries = (state.archive || []).filter(e => e.type !== 'weekly');
  const archiveSum = archiveDailyEntries.reduce((sum, entry) => {
    const s = (entry.students || []).find(x => x.id === student.id);
    if (!s) return sum;
    const catsSum = CATEGORIES.reduce((sum2, c) => sum2 + ((s.cats && s.cats[c.key]) || 0), 0);
    const purchaseCost = (s.purchases || 0) * PURCHASE_COST;
    return sum + catsSum + (s.minusTotal || 0) - purchaseCost;
  }, 0);

  return todayNet + archiveSum;
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function getWeekStart(date){
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - d.getDay());
  return d;
}

function getWeekKey(date){
  const ws = getWeekStart(date);
  return ws.getFullYear() + '-' + String(ws.getMonth() + 1).padStart(2, '0') + '-' + String(ws.getDate()).padStart(2, '0');
}

function applyDailyReset(){
  if (!Array.isArray(state.archive)) state.archive = [];
  const entryDate = state.lastActivityDate
    ? new Date(state.lastActivityDate + 'T12:00:00')
    : new Date();
  const entryDayKey = dayKeyOf(entryDate.toISOString());
  const newDailyData = {
    date: entryDate.toISOString(),
    students: state.students.map(s => ({
      id: s.id,
      cats: { ...s.cats },
      purchases: s.purchases || 0,
      minusTotal: s.minusTotal || 0,
      metivtaSum: (s.metivta ? (s.metivta.attendance || 0) + (s.metivta.behavior || 0) : 0),
      metivtaAttendance: (s.metivta ? (s.metivta.attendance || 0) : 0),
      metivtaBehavior: (s.metivta ? (s.metivta.behavior || 0) : 0)
    })),
    metivtaExtraStudents: (state.metivtaExtra || []).map(s => ({
      id: s.id,
      metivtaSum: (s.metivta ? (s.metivta.attendance || 0) + (s.metivta.behavior || 0) : 0),
      metivtaAttendance: (s.metivta ? (s.metivta.attendance || 0) : 0),
      metivtaBehavior: (s.metivta ? (s.metivta.behavior || 0) : 0)
    }))
  };
  const existingDailyIdx = state.archive.findIndex(e => e.type !== 'weekly' && dayKeyOf(e.date) === entryDayKey);
  if (existingDailyIdx !== -1){
    state.archive.splice(existingDailyIdx, 1);
  }
  state.archive.unshift(newDailyData);

  const weekKey = getWeekKey(entryDate);
  let weeklyEntry;
  const weeklyIdx = state.archive.findIndex(e => e.type === 'weekly' && e.weekKey === weekKey);
  if (weeklyIdx !== -1){
    weeklyEntry = state.archive[weeklyIdx];
    state.archive.splice(weeklyIdx, 1);
  } else {
    weeklyEntry = {
      type: 'weekly',
      title: 'הנוסע המתמיד',
      weekKey: weekKey,
      weekStart: getWeekStart(entryDate).toISOString(),
      date: entryDate.toISOString(),
      students: state.students.map(s => ({
        id: s.id,
        morning: 0,
        tefila: 0,
        mikve: 0,
        minusDelta: 0,
        bonus: 0,
        days: {},
        baselineMikvaot: s.frequentFrozen ? (s.frequentFrozen.mikvaot || 0) : 0,
        baselineRambam: s.frequentFrozen ? (s.frequentFrozen.rambam || 0) : 0,
        baselineMetivta: s.metivtaFrozen ? (s.metivtaFrozen.attendance || 0) + (s.metivtaFrozen.behavior || 0) : 0
      }))
    };
  }

  weeklyEntry.date = entryDate.toISOString();
  weeklyEntry.students.forEach(ws => {
    const s = state.students.find(x => x.id === ws.id);
    if (!s) return;
    if (!ws.days) ws.days = {};
    if (typeof ws.baselineMikvaot !== 'number') ws.baselineMikvaot = 0;
    if (typeof ws.baselineRambam !== 'number') ws.baselineRambam = 0;
    if (typeof ws.baselineMetivta !== 'number') ws.baselineMetivta = 0;

    const dayMorning = Math.round((s.cats.c1 || 0) * (2 / 3));
    const dayTefila = (s.cats.c7 || 0) + (s.cats.c3 || 0);
    const dayBonus = (s.minusTotal || 0) === 0 ? 1 : 0;

    const priorMikvaotSum = Object.values(ws.days).reduce((sum, d) => sum + (d.mikvaotVal || 0), 0);
    const priorRambamSum = Object.values(ws.days).reduce((sum, d) => sum + (d.rambamVal || 0), 0);
    const priorMetivtaSum = Object.values(ws.days).reduce((sum, d) => sum + (d.metivtaVal || 0), 0);

    const currentMikvaot = s.frequentFrozen ? (s.frequentFrozen.mikvaot || 0) : 0;
    const currentRambam = s.frequentFrozen ? (s.frequentFrozen.rambam || 0) : 0;
    const currentMetivta = s.metivtaFrozen ? (s.metivtaFrozen.attendance || 0) + (s.metivtaFrozen.behavior || 0) : 0;

    const dayMikvaotVal = currentMikvaot - ws.baselineMikvaot - priorMikvaotSum;
    const dayRambamVal = currentRambam - ws.baselineRambam - priorRambamSum;
    const dayMetivtaVal = currentMetivta - ws.baselineMetivta - priorMetivtaSum;

    ws.days[entryDayKey] = {
      morning: dayMorning,
      tefila: dayTefila,
      mikvaotVal: dayMikvaotVal,
      bonus: dayBonus,
      rambamVal: dayRambamVal,
      metivtaVal: dayMetivtaVal
    };

    ws.morning += dayMorning;
    ws.tefila += dayTefila;
    ws.mikve += (s.cats.c6 || 0) * 2;
    ws.minusDelta += s.minusTotal || 0;
    ws.bonus = (ws.bonus || 0) + dayBonus;
    ws.mikvaotVal = currentMikvaot - ws.baselineMikvaot;
    ws.rambamVal = currentRambam - ws.baselineRambam;
    ws.metivtaVal = currentMetivta - ws.baselineMetivta;
  });
  state.archive.unshift(weeklyEntry);

  const dailyEntries = state.archive.filter(e => e.type !== 'weekly');
  const weeklyEntries = state.archive.filter(e => e.type === 'weekly');
  const MAX_DAILY = 90;
  const MAX_WEEKLY = 26;
  if (dailyEntries.length > MAX_DAILY || weeklyEntries.length > MAX_WEEKLY){
    const keptDaily = dailyEntries.slice(0, MAX_DAILY);
    const keptWeekly = weeklyEntries.slice(0, MAX_WEEKLY);
    state.archive = state.archive.filter(e => keptDaily.includes(e) || keptWeekly.includes(e));
  }

  state.students.forEach(s => {
    const daily = CATEGORIES.reduce((sum, c) => sum + (s.cats[c.key] || 0), 0);
    s.cumulative += daily + (s.minusTotal || 0);
    CATEGORIES.forEach(c => { s.cats[c.key] = 0; });
    s.c5Total = 0;
    s.purchases = 0;
    s.minusTotal = 0;
    s.frequent = { mikvaot: 0, rambam: 0 };
    s.metivta = { attendance: 0, behavior: 0 };
  });
  (state.metivtaExtra || []).forEach(s => {
    s.metivta = { attendance: 0, behavior: 0 };
  });
  state.lastAutoResetDate = todayStr();
  state.lastActivityDate = null;
}

async function doResetGuarded(){
  if (!state.lastActivityDate) return;
  try{
    await runTransaction(firestoreDb, async (tx) => {
      const snap = await tx.get(stateDocRef);
      if (snap.exists()){
        const fresh = JSON.parse(JSON.stringify(snap.data()));
        if (fresh && Array.isArray(fresh.students) && fresh.students.length === TOTAL_STUDENTS){
          state = fresh;
        }
      }
      if (!state.lastActivityDate){
        // someone else already archived and reset this transition
        return;
      }
      applyDailyReset();
      tx.set(stateDocRef, state);
      lastSyncedStateJson = JSON.stringify(state);
    });
  } catch(e){
    // transaction failed (offline, etc.) - render whatever is in memory so the UI isn't stuck
  }
  render();
  renderFrequentFlyerView();
  renderMetivtaView();
}

function checkAutoReset(){
  if (!state) return;
  if (!state.lastActivityDate) return;
  const today = todayStr();
  if (state.lastActivityDate === today){
    if (new Date().getHours() >= 18 && state.lastAutoResetDate !== today){
      doResetGuarded();
    }
  } else {
    if (state.lastAutoResetDate !== state.lastActivityDate){
      doResetGuarded();
    }
  }
}

        list.classList.remove('open');
        activateExpandedGroup('minusShop');
      });
      list.appendChild(allOpt);

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'merged-dropdown-toggle';
      toggle.textContent = (state.minusShopActive === 'shop' ? '🛒' : '-');
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.merged-dropdown-list.open').forEach(l => {
          if (l !== list) l.classList.remove('open');
        });
        list.classList.toggle('open');
      });

      const dropdown = document.createElement('div');
      dropdown.className = 'merged-dropdown';
      dropdown.appendChild(toggle);
      dropdown.appendChild(list);
      th.appendChild(dropdown);
    } else if (s.kind === 'merged'){
      th.className = (th.className ? th.className + ' ' : '') + 'col-hide-narrow';

      const list = document.createElement('div');
      list.className = 'merged-dropdown-list';
      s.group.forEach(key => {
        const cat = CATEGORIES.find(c => c.key === key);
        const opt = document.createElement('div');
        opt.className = 'merged-dropdown-option';
        opt.textContent = cat.label;
        opt.addEventListener('click', (e) => {
          e.stopPropagation();
          list.classList.remove('open');
          if (key === 'c5' && state.mergedActive[s.groupIndex] === 'c5'){
            resetColumn('c5');
          } else {
            setMergedActive(s.groupIndex, key);
          }
        });
        list.appendChild(opt);
      });
      const allOpt = document.createElement('div');
      allOpt.className = 'merged-dropdown-option merged-dropdown-option-all';
      allOpt.textContent = 'הכל';
      allOpt.addEventListener('click', (e) => {
        e.stopPropagation();
        list.classList.remove('open');
        activateExpandedGroup(s.category);
      });
      list.appendChild(allOpt);

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'merged-dropdown-toggle';
      const activeCat = CATEGORIES.find(c => c.key === state.mergedActive[s.groupIndex]);
      toggle.textContent = (activeCat ? activeCat.label : '');
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.merged-dropdown-list.open').forEach(l => {
          if (l !== list) l.classList.remove('open');
        });
        list.classList.toggle('open');
      });

      const dropdown = document.createElement('div');
      dropdown.className = 'merged-dropdown';
      dropdown.appendChild(toggle);
      dropdown.appendChild(list);
      th.appendChild(dropdown);
    } else if (s.kind === 'individual'){
      const cat = CATEGORIES.find(c => c.key === s.key);
      th.textContent = cat.label;
    } else if (s.kind === 'minusOnly'){
      th.textContent = '-';
    } else if (s.kind === 'shopOnly'){
      th.textContent = '🛒';
    }

    const thInner = document.createElement('div');
    thInner.className = 'th-inner';
    while (th.firstChild) thInner.appendChild(th.firstChild);
    th.appendChild(thInner);

    trh.appendChild(th);
  });

  thead.appendChild(trh);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  students.forEach(student => {
    const tr = document.createElement('tr');
    tr.dataset.studentId = student.id;

    colSpec.forEach(s => {
      const td = document.createElement('td');
      if (isColHidden(s.category)) td.style.display = 'none';

      if (s.kind === 'name'){
        td.className = (td.className ? td.className + ' ' : '') + 'num-cell';
        const numSpan = document.createElement('span');
        numSpan.className = 'cell-text';
        numSpan.textContent = studentName(student.id);
        td.appendChild(numSpan);
      } else if (s.kind === 'total'){
        td.className = (td.className ? td.className + ' ' : '') + 'total-cell col-hide-narrow';
        const totalSpan = document.createElement('span');
        totalSpan.className = 'cell-text';
        totalSpan.textContent = studentTotal(student);
        td.appendChild(totalSpan);
      } else if (s.kind === 'plus'){
        const c = plusCategory;
        const roundActive = !!student.cats[c.key];
        const displayVal = c.cumulativeKey
          ? (student[c.cumulativeKey] || 0) + (student.cats[c.key] || 0)
          : student.cats[c.key];
        td.className = (td.className ? td.className + ' ' : '') + 'point-cell' + (roundActive ? ' active' : '');
        const val = document.createElement('span');
        val.className = 'point-val';
        val.textContent = displayVal ? displayVal : '';
        td.appendChild(val);
        td.addEventListener('click', () => toggleCell(student.id, c.key));
      } else if (s.kind === 'minus'){
        if (state.minusShopActive === 'shop'){
          const purchaseCost = (student.purchases || 0) * PURCHASE_COST;
          const hasValue = purchaseCost !== 0;
          td.className = (td.className ? td.className + ' ' : '') + 'point-cell purchase-cell' + (hasValue ? ' has-purchases' : '');
          const val = document.createElement('span');
          val.className = 'point-val';
          val.textContent = hasValue ? -purchaseCost : '';
          td.appendChild(val);
          td.addEventListener('click', () => makePurchase(student.id));

          const hasMinus = (student.minusTotal || 0) !== 0;

        const activeHasPoints = (student.cats[activeKey] || 0) > 0;
        td.className = (td.className ? td.className + ' ' : '') + 'point-cell col-hide-narrow' + (activeHasPoints ? ' active' : '');

        val.className = 'point-val';
        val.textContent = sum > 0 ? sum : '';
        td.appendChild(val);
        td.addEventListener('click', () => toggleCell(student.id, activeKey));
      } else if (s.kind === 'individual'){
        const roundActive = !!student.cats[s.key];
        td.className = (td.className ? td.className + ' ' : '') + 'point-cell' + (roundActive ? ' active' : '');
        const val = document.createElement('span');
        val.className = 'point-val';
        val.textContent = student.cats[s.key] ? student.cats[s.key] : '';
        td.appendChild(val);

        const minusVal = document.createElement('span');
        minusVal.className = 'point-val';
        minusVal.textContent = hasMinus ? student.minusTotal : '';
        td.appendChild(minusVal);
        td.addEventListener('click', () => showMinusPicker(student.id));
      } else if (s.kind === 'shopOnly'){
        const purchaseCost = (student.purchases || 0) * PURCHASE_COST;
        const hasValue = purchaseCost !== 0;
        td.className = (td.className ? td.className + ' ' : '') + 'point-cell purchase-cell' + (hasValue ? ' has-purchases' : '');

        val.textContent = hasValue ? -purchaseCost : '';
        td.appendChild(val);
        td.addEventListener('click', () => makePurchase(student.id));
      }

      tr.appendChild(td);
    });

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  const scrollWrap = document.createElement('div');
  scrollWrap.className = 'table-scroll';
  scrollWrap.appendChild(table);
  wrap.appendChild(scrollWrap);
  return wrap;
}

function toggleFrequent(studentId, key){
  requireEditAccess(() => {
    const student = state.students.find(s => s.id === studentId);
    if (!student) return;
    if (!student.frequent) student.frequent = { mikvaot: 0, rambam: 0 };
    if (!student.frequentFrozen) student.frequentFrozen = { mikvaot: 0, rambam: 0 };
    const turningOn = !student.frequent[key];
    student.frequent[key] = turningOn ? 2 : 0;
    student.frequentFrozen[key] = (student.frequentFrozen[key] || 0) + (turningOn ? 2 : -2);
    markActivity();
    renderFrequentFlyerView();
    saveState();
  });
}

function renderFrequentFlyerView(){

  boardsWrap.style.padding = '0';

  fitAllTextCells();
}

function showMetivtaAttendancePicker(studentId){

      btn.className = 'modal-btn modal-btn-confirm';
      btn.textContent = String(amount);

        const student = state.students.find(s => s.id === studentId);
        if (!student) return;
        if (!student.metivta) student.metivta = { attendance: 0, behavior: 0 };
        const current = student.metivta.attendance || 0;

          return;
        }
        document.body.removeChild(overlay);
        if (!student.metivtaFrozen) student.metivtaFrozen = { attendance: 0, behavior: 0 };
        student.metivta.attendance = current + amount;
        student.metivtaFrozen.attendance = (student.metivtaFrozen.attendance || 0) + amount;
        markActivity();
        renderMetivtaView();
        saveState();
      });

    cancelBtn.className = 'modal-btn modal-btn-cancel';

    overlay.appendChild(box);
    document.body.appendChild(overlay);
  });
}

function adjustMetivtaBehavior(studentId, delta){
  const student = state.students.find(s => s.id === studentId);
  if (!student) return;
  if (!student.metivta) student.metivta = { attendance: 0, behavior: 0 };
  if (!student.metivtaFrozen) student.metivtaFrozen = { attendance: 0, behavior: 0 };
  let newTotal = (student.metivta.behavior || 0) + delta;
  if (newTotal > 0) newTotal = 0;
  const actualDelta = newTotal - (student.metivta.behavior || 0);
  student.metivta.behavior = newTotal;
  student.metivtaFrozen.behavior = (student.metivtaFrozen.behavior || 0) + actualDelta;
  markActivity();
  renderMetivtaView();
  saveState();
}

async function exportMetivtaArchiveCSV(days){
  try {
    const headers = ['שם'];
    days.forEach(entry => {
      const d = new Date(entry.date);
      const dl = formatHebrewDateShort(d);
      headers.push(dl + ' · נוכחות', dl + ' · התנהגות');
    });
    const rows = [headers];
    state.students.forEach(student => {
      const row = [studentName(student.id)];
      days.forEach(entry => {
        const s = entry.students.find(x => x.id === student.id) || {};
        row.push(s.metivtaAttendance || 0, s.metivtaBehavior || 0);
      });
      rows.push(row);
    });
    (state.metivtaExtra || []).forEach(student => {
      const row = [metivtaExtraName(student.id)];
      days.forEach(entry => {
        const s = (entry.metivtaExtraStudents || []).find(x => x.id === student.id) || {};
        row.push(s.metivtaAttendance || 0, s.metivtaBehavior || 0);
      });
      rows.push(row);

      return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;

let historyMergedActive = {};
let todayHistoryContainerEl = null;

function hebrewDayLetters(n){
  const ones = ['', 'א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ז', 'ח', 'ט'];
  const tens = ['', 'י', 'כ', 'ל'];
  if (n === 15) return 'טו';
  if (n === 16) return 'טז';
  const t = Math.floor(n / 10);
  const o = n % 10;
  return tens[t] + ones[o];
}

function formatHebrewDateShort(d, opts){
  opts = opts || {};
  const parts = new Intl.DateTimeFormat('he-IL-u-ca-hebrew', { day: 'numeric', month: 'short' }).formatToParts(d);
  let day = '';
  let month = '';
  parts.forEach(p => {
    if (p.type === 'day') day = p.value;
    if (p.type === 'month') month = p.value;
  });
  const dayNum = parseInt(day, 10);
  const dayLetters = isNaN(dayNum) ? day : hebrewDayLetters(dayNum);
  return dayLetters + ' ' + month;
}

function dayKeyOf(dateStr){
  const d = new Date(dateStr);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function getHistoryActive(dayKey, groupType, defaultKey){
  const k = dayKey + '_' + groupType;
  if (!(k in historyMergedActive)) historyMergedActive[k] = defaultKey;
  return historyMergedActive[k];
}

function setHistoryActive(dayKey, groupType, key){
  historyMergedActive[dayKey + '_' + groupType] = key;

  const activeOpt = options.find(o => o.key === activeKey) || options[0];

    nameTd.textContent = studentName(student.id);

    days.forEach(entry => {
      const s = entry.students.find(x => x.id === student.id);
      const cats = (s && s.cats) || {};
      const activeKey = getHistoryActive('archive_shared', groupType, allOptions[0].key);

      let val;
      if (activeKey === 'shop'){
        val = -((s && s.purchases || 0) * PURCHASE_COST);
      } else if (activeKey === 'minus'){
        val = (s && s.minusTotal) || 0;
      } else {
        val = cats[activeKey] || 0;
      }
      const td = document.createElement('td');
      td.textContent = val || '';
      td.style.cursor = 'pointer';
      td.addEventListener('click', () => {
        if (!s) return;
        if (activeKey === 'shop'){
          promptEditArchiveValue(s.purchases || 0, (newVal) => {
            s.purchases = newVal;
            saveState();
            render();
          });
        } else if (activeKey === 'minus'){
          promptEditArchiveValue(s.minusTotal || 0, (newVal) => {
            s.minusTotal = newVal;
            saveState();
            render();
          });
        } else {
          promptEditArchiveValue(cats[activeKey] || 0, (newVal) => {
            if (!s.cats) s.cats = {};

            saveState();
            render();
          });
        }
      });
      tr.appendChild(td);
    });

function computeSortScore(student){
  const attendanceSum = MERGE_GROUPS[0].reduce((sum, k) => sum + (student.cats[k] || 0), 0);
  const plusGroupSum = MERGE_GROUPS[1].reduce((sum, k) => sum + (student.cats[k] || 0), 0);
  const plusPersistent = student.c5Total || 0;
  const minusOnly = student.minusTotal || 0;
  return attendanceSum + plusGroupSum + plusPersistent + minusOnly;
}

  const secondHalf = state.students.slice(half).sort((a, b) => computeSortScore(b) - computeSortScore(a));

function fitAllTextCells(){
  const bodyItems = [];
  document.querySelectorAll('.num-cell .cell-text, .total-cell .cell-text, .point-val').forEach(el => {
    el.style.fontSize = '';
    const container = el.closest('td');
    if (container) bodyItems.push({ el, container });
  });

  const headerGroups = new Map();
  document.querySelectorAll('thead .col-reset-btn, thead .merged-dropdown-toggle').forEach(el => {
    el.style.fontSize = '';
    const container = el.closest('th');
    const table = el.closest('table');
    if (!container || !table) return;
    if (!headerGroups.has(table)) headerGroups.set(table, []);
    headerGroups.get(table).push({ el, container });
  });

  requestAnimationFrame(() => {
    function fitGroup(items, startSize){
      function fitsAll(size){
        return items.every(({ el, container }) => {
          const limitW = Math.max(container.clientWidth - 2, 0);
          const limitH = Math.max(container.clientHeight - 2, 0);
          return el.scrollWidth <= limitW && el.scrollHeight <= limitH;
        });
      }
      function applySize(size){
        items.forEach(({ el }) => { el.style.fontSize = size + 'px'; });
      }

      let size = startSize;
      const minSize = 8;
      applySize(size);
      let guard = 0;
      while (!fitsAll(size) && size > minSize && guard < 150){
        size -= 1;
        applySize(size);
        guard++;
      }
    }

    fitGroup(bodyItems, 90);
    headerGroups.forEach(items => fitGroup(items, 40));
  });
}

const SCREENSAVER_IDLE_MS = 30000;
const SCREENSAVER_ROTATE_MS = 20000;
const SCREENSAVER_STATES = [null, 'prayer', 'attendance'];
let screensaverIdleTimer = null;
let screensaverRotateTimer = null;
let screensaverActive = false;
let screensaverStateIndex = 0;
let screensaverPrevView = 'main';

function currentView(){
  if (document.getElementById('frequentFlyerView').style.display !== 'none') return 'frequentFlyer';
  if (document.getElementById('metivtaView').style.display !== 'none') return 'metivta';
  return 'main';
}

function enterScreensaver(){
  if (screensaverActive) return;
  screensaverActive = true;
  screensaverPrevView = currentView();
  clearTimeout(expandedGroupTimer);
  screensaverStateIndex = 0;
  if (screensaverPrevView !== 'main') showMain();
  expandedGroup = SCREENSAVER_STATES[screensaverStateIndex];
  render();
  screensaverRotateTimer = setInterval(() => {
    screensaverStateIndex = (screensaverStateIndex + 1) % SCREENSAVER_STATES.length;
    expandedGroup = SCREENSAVER_STATES[screensaverStateIndex];
    render();
  }, SCREENSAVER_ROTATE_MS);
}

function exitScreensaver(){
  if (!screensaverActive) return;
  screensaverActive = false;
  clearInterval(screensaverRotateTimer);
  screensaverRotateTimer = null;
  expandedGroup = null;
  if (screensaverPrevView === 'frequentFlyer') showFrequentFlyer();
  else if (screensaverPrevView === 'metivta') showMetivta();
  else render();
}

function armScreensaverIdleTimer(){
  clearTimeout(screensaverIdleTimer);
  screensaverIdleTimer = setTimeout(enterScreensaver, SCREENSAVER_IDLE_MS);
}

['mousemove', 'click', 'touchstart', 'keydown'].forEach(evt => {

function dedupDailyArchiveEntries(){
  if (state.dailyArchiveDedupedV1) return;
  if (!Array.isArray(state.archive)) { state.dailyArchiveDedupedV1 = true; saveState(); return; }

  const byDayKey = {};
  const order = [];
  state.archive.forEach(e => {
    if (e.type === 'weekly') return;
    const k = dayKeyOf(e.date);
    if (!byDayKey[k]){ byDayKey[k] = []; order.push(k); }
    byDayKey[k].push(e);
  });

  const merged = [];
  order.forEach(k => {
    const entries = byDayKey[k];
    if (entries.length === 1){
      merged.push(entries[0]);
      return;
    }
    const base = entries[0];
    const combined = {
      date: base.date,
      students: state.students.map(s => {
        const cats = { c1: 0, c2: 0, c3: 0, c4: 0, c5: 0, c6: 0, c7: 0, c8: 0 };
        let purchases = 0, minusTotal = 0, metivtaAttendance = 0, metivtaBehavior = 0;
        entries.forEach(e => {
          const es = (e.students || []).find(x => x.id === s.id);
          if (!es) return;
          CATEGORIES.forEach(c => { cats[c.key] += (es.cats && es.cats[c.key]) || 0; });
          purchases += es.purchases || 0;
          minusTotal += es.minusTotal || 0;
          metivtaAttendance += es.metivtaAttendance || 0;
          metivtaBehavior += es.metivtaBehavior || 0;
        });
        return { id: s.id, cats, purchases, minusTotal, metivtaSum: metivtaAttendance + metivtaBehavior, metivtaAttendance, metivtaBehavior };
      }),
      metivtaExtraStudents: (state.metivtaExtra || []).map(s => {
        let metivtaAttendance = 0, metivtaBehavior = 0;
        entries.forEach(e => {
          const es = (e.metivtaExtraStudents || []).find(x => x.id === s.id);
          if (!es) return;
          metivtaAttendance += es.metivtaAttendance || 0;
          metivtaBehavior += es.metivtaBehavior || 0;
        });
        return { id: s.id, metivtaSum: metivtaAttendance + metivtaBehavior, metivtaAttendance, metivtaBehavior };
      })
    };
    merged.push(combined);
  });

  state.archive = state.archive.filter(e => e.type === 'weekly').concat(merged);
  state.dailyArchiveDedupedV1 = true;
  saveState();
}

function isEmptyDailyEntry(e){
  const allStudentsEmpty = (e.students || []).every(s => {
    const catsEmpty = !s.cats || Object.values(s.cats).every(v => !v);
    return catsEmpty && !s.purchases && !s.minusTotal && !s.metivtaAttendance && !s.metivtaBehavior;
  });
  const allExtraEmpty = (e.metivtaExtraStudents || []).every(s => !s.metivtaAttendance && !s.metivtaBehavior);
  return allStudentsEmpty && allExtraEmpty;
}

function removeEmptyPlaceholderDays(){
  if (state.emptyPlaceholdersRemovedV1) return;

}

    'יהונתן': [2,3,2,2,2,3], 'איתן': [0,3,0,2,2,0], 'מענדי ל.': [2,3,0,2,2,4],

    'חננאל': [2,3,2,2,2,4], 'שמוליק צ.': [0,3,2,2,2,4], 'אושר': [0,3,2,2,2,1],
    'שמעון': [2,3,2,2,2,4], 'מוטי': [2,3,2,2,2,4], 'לוי ק.': [2,1,2,2,2,0],
    'נועם': [0,3,2,2,2,4], 'משה': [2,3,2,2,0,2]
  };
  const nameToId = {};
  STUDENT_NAMES.forEach((n, idx) => { nameToId[n] = idx + 1; });
  const importWeekStartD = getWeekStart(new Date());
  const importWeekKey = getWeekKey(new Date());
  if (!Array.isArray(state.archive)) state.archive = [];
  let wEntry = state.archive.find(e => e.type === 'weekly' && e.weekKey === importWeekKey);
  if (!wEntry){
    wEntry = {
      type: 'weekly',
      title: 'הנוסע המתמיד',
      weekKey: importWeekKey,
      weekStart: importWeekStartD.toISOString(),
      date: new Date().toISOString(),
      students: []
    };
    state.archive.push(wEntry);
  }
  Object.keys(importData).forEach(name => {
    const id = nameToId[name];
    if (!id) return;
    const [morningVal, tefilaVal, mikvaotVal, bonusVal, rambamVal, metivtaVal] = importData[name];

  input.inputMode = 'numeric';
  input.maxLength = 10;
  input.autocomplete = 'off';
  box.appendChild(input);

  const errorEl = document.createElement('div');
  errorEl.className = 'lock-error';
  box.appendChild(errorEl);

    if (input.value.trim() === ARCHIVE_ACCESS_CODE){

      errorEl.textContent = 'קוד שגוי, נסה שוב';
