  <style>
    /* The header scrolls away here so the scene can take the full screen. */
    .site-header { position: relative; }

    .sw-track { position: relative; height: 620vh; background: #1d1710; }
    .sw-stage {
      position: sticky; top: 0;
      height: 100vh; height: 100dvh;
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
    }
    .sw-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    .sw-shade {
      position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(20, 14, 8, .6) 0%, rgba(20, 14, 8, 0) 20%),
        linear-gradient(to top, rgba(20, 14, 8, .88) 0%, rgba(20, 14, 8, .5) 28%, rgba(20, 14, 8, 0) 58%);
    }

    .sw-tabs {
      position: absolute; top: 16px; inset-inline: 16px;
      max-width: 1100px; margin-inline: auto;
      display: flex; gap: 10px; z-index: 2;
    }
    .sw-tab {
      flex: 1 1 0; min-width: 0;
      font-family: var(--font-head); font-size: .86rem; font-weight: 600;
      color: rgba(255, 255, 255, .75);
      background: none; border: none; padding: 0 0 8px;
      text-align: start; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sw-tab .bar {
      display: block; height: 3px; margin-bottom: 8px; border-radius: 3px;
      background: rgba(255, 255, 255, .3); overflow: hidden;
    }
    .sw-tab .fill { display: block; height: 100%; width: 0; background: #fff; border-radius: inherit; }
    .sw-tab.is-active { color: #fff; }
    .sw-tab:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 4px; }

    .sw-card {
      position: absolute; bottom: 0; inset-inline: 0;
      max-width: 1100px; margin-inline: auto;
      padding: 0 26px 34px;
      color: #fff; z-index: 2;
      opacity: 0; transform: translateY(18px);
      transition: opacity .35s ease, transform .35s ease;
      pointer-events: none;
    }
    .sw-card.is-shown { opacity: 1; transform: none; pointer-events: auto; }
    .sw-kicker { margin: 0 0 4px; font-size: .84rem; color: rgba(255, 255, 255, .8); }
    .sw-title {
      margin: 0 0 6px;
      font-family: var(--font-head); font-weight: 700;
      font-size: clamp(1.7rem, 4.6vw, 2.8rem); line-height: 1.12;
      color: #fff; text-wrap: balance;
      text-shadow: 0 2px 14px rgba(0, 0, 0, .35);
    }
    .sw-blurb {
      margin: 0 0 16px; max-width: 52ch;
      font-size: clamp(.92rem, 1.8vw, 1.06rem); line-height: 1.5;
      color: rgba(255, 255, 255, .9);
    }
    .sw-go {
      display: inline-block; text-decoration: none;
      font-family: var(--font-head); font-weight: 600; font-size: .95rem;
      padding: 11px 22px; border-radius: 999px;
      background: #fff; color: var(--accent-strong);
      box-shadow: 0 3px 0 rgba(0, 0, 0, .25);
    }
    .sw-go:hover { opacity: .92; }

    .sw-hint {
      position: absolute; bottom: 26px; left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      font-family: var(--font-head); font-size: .9rem; font-weight: 600;
      color: #fff;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .5);
      transition: opacity .3s ease;
      pointer-events: none;
    }
    .sw-hint svg { width: 22px; height: 22px; animation: sw-bob 1.6s ease-in-out infinite; }
    .sw-hint.is-gone { opacity: 0; }
    @keyframes sw-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

    .sw-loading {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: rgba(255, 255, 255, .7); font-size: .9rem;
      pointer-events: none;
    }

    @media (max-width: 640px) {
      .sw-tabs { top: 12px; inset-inline: 12px; gap: 6px; }
      .sw-tab { font-size: .74rem; }
      .sw-card { padding: 0 18px 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .sw-card, .sw-hint { transition: none; }
      .sw-hint svg { animation: none; }
    }
  </style>
</head>

  <main class="sw-track" id="sw-track" aria-label="בחירת שיעור">
    <div class="sw-stage">
      <p class="sw-loading" id="sw-loading">טוען…</p>
      <canvas class="sw-canvas" id="sw-canvas" aria-hidden="true"></canvas>
      <div class="sw-shade"></div>

      <div class="sw-tabs" id="sw-tabs" role="tablist"></div>

      <div class="sw-card" id="sw-card" aria-live="polite">

        <h2 class="sw-title" id="sw-title"></h2>

      </div>

      <div class="sw-hint" id="sw-hint">
        <span>גללו למטה</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>
  </main>

  <footer class="site-footer"></footer>

  <script>
  (function () {
    var FRAME_COUNT = 120;          // 10s of footage at 12fps
    var FIRST = 4;                  // the clip's opening establishing shot (frames 0-3) is left out
    function frameSrc(i) { return "assets/media/frames/f" + String(i).padStart(3, "0") + ".webp"; }

    // Scroll progress (0..1 through the track) -> frame. Each lesson gets
    // an "approach" stretch where the camera moves, then a "hold" where its
    // scene stays put and its card is shown. The holds end exactly on the
    // last frame before each cut in the footage.
    var LESSONS = [
      { id: "mai-shena-negicha",     title: "״מאי שנא נגיחה״",
        blurb: "נגיחה ונגיפה - מה ההבדל ביניהן, ולמה שתיהן שייכות למזיק קרן.",
        from: 0,    arrive: 0.14, leave: 0.30, f0: FIRST, f1: 30 },
      { id: "mai-shena-gabei-adam",  title: "״מאי שנא גבי אדם״",
        blurb: "למה אדם נפגע בדרך כלל מנגיחה, ובעל חי מדחיפה עם הקרן.",
        from: 0.30, arrive: 0.56, leave: 0.72, f0: 30, f1: 88 },
      { id: "muad-livhema",          title: "״מועד לבהמה״",
        blurb: "שור שהזיק שלוש פעמים - למי הוא נעשה מועד, ולמי עדיין לא.",
        from: 0.72, arrive: 0.90, leave: 1.01, f0: 88, f1: 119 }
    ];

    var track = document.getElementById("sw-track");
    var canvas = document.getElementById("sw-canvas");
    var ctx = canvas.getContext("2d");
    var loadingEl = document.getElementById("sw-loading");
    var tabsEl = document.getElementById("sw-tabs");
    var card = document.getElementById("sw-card");
    var kickerEl = document.getElementById("sw-kicker");
    var titleEl = document.getElementById("sw-title");
    var blurbEl = document.getElementById("sw-blurb");
    var goEl = document.getElementById("sw-go");
    var hint = document.getElementById("sw-hint");
    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    // ---- frames ----
    var frames = new Array(FRAME_COUNT);
    var loaded = new Array(FRAME_COUNT).fill(false);
    function load(i) {
      if (frames[i]) return;
      var img = new Image();
      img.decoding = "async";
      img.onload = function () {
        loaded[i] = true;
        if (i === FIRST) loadingEl.hidden = true;
        if (Math.abs(i - wantFrame) < 3) requestDraw();
      };
      img.src = frameSrc(i);
      frames[i] = img;
    }
    // Lesson stop frames first so a tab click never lands on a blank, then
    // everything else in playback order.
    [FIRST, 30, 88, 119].forEach(load);
    for (var i = FIRST; i < FRAME_COUNT; i++) load(i);

    function nearestLoaded(i) {
      for (var d = 0; d < FRAME_COUNT; d++) {
        if (i - d >= FIRST && loaded[i - d]) return i - d;
        if (i + d < FRAME_COUNT && loaded[i + d]) return i + d;
      }
      return -1;
    }

    // ---- drawing ----
    var wantFrame = FIRST, drawnFrame = -1, drawQueued = false;
    function sizeCanvas() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(canvas.clientWidth * dpr);
      canvas.height = Math.round(canvas.clientHeight * dpr);
      drawnFrame = -1;
      requestDraw();
    }
    function draw() {
      drawQueued = false;
      var idx = nearestLoaded(wantFrame);
      if (idx < 0 || idx === drawnFrame) return;
      var img = frames[idx];
      var cw = canvas.width, ch = canvas.height;
      var scale = Math.max(cw / img.naturalWidth, ch / img.naturalHeight);
      var w = img.naturalWidth * scale, h = img.naturalHeight * scale;
      ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
      drawnFrame = idx;
    }
    function requestDraw() {
      if (!drawQueued) { drawQueued = true; requestAnimationFrame(draw); }
    }

    // ---- tabs ----
    var tabs = LESSONS.map(function (l, i) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "sw-tab";
      b.setAttribute("role", "tab");
      b.innerHTML = '<span class="bar"><span class="fill"></span></span>';
      b.appendChild(document.createTextNode(l.title));
      b.addEventListener("click", function () { flyTo(i); });
      tabsEl.appendChild(b);
      return b;
    });

    // ---- scroll -> state ----
    function trackRange() {
      var top = track.getBoundingClientRect().top + window.scrollY;
      return { top: top, span: track.offsetHeight - window.innerHeight };
    }
    function progress() {
      var r = trackRange();
      return Math.max(0, Math.min(1, (window.scrollY - r.top) / r.span));
    }
    function ease(x) { return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }

    var shownLesson = -1;
    function update() {
      var p = progress();
      var frame = FIRST, active = 0, holding = -1;
      LESSONS.forEach(function (l, i) {
        if (p >= l.from) active = i;
        var fill;
        if (p < l.from) fill = 0;
        else if (p >= l.leave) fill = 1;
        else fill = (p - l.from) / (l.leave - l.from);
        tabs[i].querySelector(".fill").style.width = fill * 100 + "%";
        if (p >= l.from && p < l.leave) {
          if (p < l.arrive) {
            frame = l.f0 + (l.f1 - l.f0) * ease((p - l.from) / (l.arrive - l.from));
          } else {
            frame = l.f1;
            holding = i;
          }
        }
      });
      if (p >= 1) { frame = LESSONS[2].f1; holding = 2; active = 2; }

      tabs.forEach(function (t, i) {
        t.classList.toggle("is-active", i === active);
        t.setAttribute("aria-selected", i === active ? "true" : "false");
      });

      if (holding !== shownLesson) {
        shownLesson = holding;
        if (holding >= 0) {
          var l = LESSONS[holding];
          kickerEl.textContent = "דף ב, עמוד ב · שיעור " + (holding + 1) + " מתוך " + LESSONS.length;
          titleEl.textContent = l.title;
          blurbEl.textContent = l.blurb;
          goEl.href = "lessons/" + l.id + ".html";
        }
        card.classList.toggle("is-shown", holding >= 0);
      }
      hint.classList.toggle("is-gone", p > 0.02);

      wantFrame = Math.round(frame);
      requestDraw();
    }

    // ---- click a tab: fly there ----
    var flight = null;
    function flyTo(i) {
      var l = LESSONS[i];
      var r = trackRange();
      var dest = r.top + r.span * ((l.arrive + Math.min(l.leave, 1)) / 2);
      var start = window.scrollY;
      if (flight) cancelAnimationFrame(flight);
      if (reduceMotion) { window.scrollTo(0, dest); return; }
      // Longer distance -> longer flight, so a jump across two lessons
      // still reads as travel rather than a cut.
      var dur = Math.min(2600, 900 + Math.abs(dest - start) * 0.35);
      var t0 = performance.now();
      (function step(now) {
        var k = Math.min(1, (now - t0) / dur);
        window.scrollTo(0, start + (dest - start) * ease(k));
        if (k < 1) flight = requestAnimationFrame(step);
        else flight = null;
      })(t0);
    }
    // A manual scroll mid-flight wins over the animation.
    ["wheel", "touchstart", "keydown"].forEach(function (ev) {
      window.addEventListener(ev, function () {
        if (flight) { cancelAnimationFrame(flight); flight = null; }
      }, { passive: true });
    });

    window.addEventListener("scroll", update, { passive: true });
    window.addEventListener("resize", function () { sizeCanvas(); update(); });
    sizeCanvas();
    update();
  })();
  </script>

</body>
